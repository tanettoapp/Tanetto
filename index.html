<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F4EFE6">
<meta name="description" content="Tanetto: un piccolo compagno che ti aiuta a prenderti cura di te, un passo alla volta.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Ccircle cx=%2216%22 cy=%2219%22 r=%2210%22 fill=%22%23A8DBA1%22/%3E%3Cpath d=%22M17 4.5C12-1 6 1 5 4.5 9 8 14 8 17 4.5Z%22 fill=%22%2376BF72%22/%3E%3Cpath d=%22M17.5 3.5C22-1.5 28 0 28.5 3.5 25 7.5 20 7.5 17.5 3.5Z%22 fill=%22%238ED089%22/%3E%3Ccircle cx=%2212.5%22 cy=%2218%22 r=%221.6%22 fill=%22%2333302E%22/%3E%3Ccircle cx=%2219.5%22 cy=%2218%22 r=%221.6%22 fill=%22%2333302E%22/%3E%3C/svg%3E">
<style>body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<title>Tanetto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Figtree:wght@400;500;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<style>
/* Layout: una colonna da telefono (max 480px). In alto la stanza illustrata del compagno, sotto le schede di lavoro, barra delle sezioni in basso. */
:root {
  --bg: #F4EFE6;
  --paper: #FFFBF4;
  --paper-2: #EFE7DA;
  --ink: #2F2A26;
  --muted: #6E655D;
  --line: #E2D7C6;
  --accent: #4E8A4A;
  --accent-soft: #E1EFD9;
  --on-accent: #FFFFFF;
  --sun: #E9A23B;
  --seed: #9A6A30;
  --font-display: "Fredoka", "Nunito", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --shadow: 0 1px 0 rgba(80, 60, 30, .08), 0 6px 18px -10px rgba(80, 60, 30, .35);
  --shadow-lg: 0 2px 0 rgba(80, 60, 30, .06), 0 14px 30px -14px rgba(80, 60, 30, .45);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1A1714; --paper: #25211C; --paper-2: #2F2A24; --ink: #F1EBE2; --muted: #B5AA9D; --line: #3A342D;
    --accent: #93CC8B; --accent-soft: #2A3A27; --on-accent: #16210F; --sun: #F0B65A; --seed: #D9A867;
    --shadow: 0 1px 0 rgba(0, 0, 0, .3), 0 8px 20px -12px rgba(0, 0, 0, .8); --shadow-lg: 0 2px 0 rgba(0, 0, 0, .3), 0 16px 30px -14px rgba(0, 0, 0, .9); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1A1714; --paper: #25211C; --paper-2: #2F2A24; --ink: #F1EBE2; --muted: #B5AA9D; --line: #3A342D;
  --accent: #93CC8B; --accent-soft: #2A3A27; --on-accent: #16210F; --sun: #F0B65A; --seed: #D9A867;
  --shadow: 0 1px 0 rgba(0, 0, 0, .3), 0 8px 20px -12px rgba(0, 0, 0, .8); --shadow-lg: 0 2px 0 rgba(0, 0, 0, .3), 0 16px 30px -14px rgba(0, 0, 0, .9); color-scheme: dark;
}
:root[data-pet="ondi"] { --accent: #8A5A3C; --accent-soft: #F3E3D5; }
:root[data-pet="lumi"] { --accent: #4F55B8; --accent-soft: #E4E5FA; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"])[data-pet="ondi"] { --accent: #DDAA88; --accent-soft: #3C2E24; }
  :root:not([data-theme="light"])[data-pet="lumi"] { --accent: #A9AEFF; --accent-soft: #2A2C4A; }
}
:root[data-theme="dark"][data-pet="ondi"] { --accent: #DDAA88; --accent-soft: #3C2E24; }
:root[data-theme="dark"][data-pet="lumi"] { --accent: #A9AEFF; --accent-soft: #2A2C4A; }

html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.5; -webkit-tap-highlight-color: transparent; }
body::before { content: ""; position: fixed; inset: 0 0 auto 0; height: 340px; pointer-events: none; z-index: -1; background: radial-gradient(120% 100% at 50% 0%, color-mix(in srgb, var(--accent) 14%, transparent), transparent 70%); }
.app { max-width: 480px; margin: 0 auto; padding-inline: 16px; padding-block: 10px 110px; box-sizing: border-box; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 600; margin: 0; line-height: 1.2; text-wrap: balance; }
h1 { font-size: 28px; } h2 { font-size: 21px; } h3 { font-size: 17px; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.note { font-size: 13px; color: var(--muted); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 12px; }
.stack { display: flex; flex-direction: column; gap: 16px; }
.stack-s { display: flex; flex-direction: column; gap: 8px; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.spacer { flex: 1; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.btn { border: 0; border-radius: 999px; padding: 13px 22px; min-height: 48px; font-weight: 700; background: var(--accent); color: var(--on-accent); font-size: 16px; box-shadow: 0 3px 0 color-mix(in srgb, var(--accent) 70%, #000); font-family: var(--font-display); letter-spacing: .01em; }
.btn:active { transform: translateY(2px); box-shadow: 0 1px 0 color-mix(in srgb, var(--accent) 70%, #000); }
.btn[disabled] { opacity: .45; cursor: not-allowed; box-shadow: none; }
.btn.ghost { background: transparent; color: var(--accent); box-shadow: inset 0 0 0 2px var(--accent); }
.btn.block { width: 100%; }
.btn.small { min-height: 44px; padding: 8px 16px; font-size: 15px; }
.btn.gold { background: linear-gradient(#FFD27A, #E9A23B); color: #3B2A10; box-shadow: 0 3px 0 #B87A1E; }
.link { background: none; border: 0; color: var(--accent); font-weight: 700; padding: 8px 0; min-height: 44px; }

.card { background: var(--paper); border-radius: 20px; padding: 16px; box-shadow: var(--shadow); }
.sec { display: flex; align-items: center; gap: 10px; }
.sec h2 { flex: 1; min-width: 0; }

/* Barra in alto */
.top { display: flex; align-items: center; gap: 8px; padding-block: 2px 10px; }
.top .name { font-family: var(--font-display); font-weight: 600; font-size: 22px; color: var(--accent); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.top .brand { display: inline-flex; align-items: center; gap: 6px; }
.top .brand svg { width: 26px; height: 26px; }
.pill { display: inline-flex; align-items: center; gap: 6px; background: var(--paper); border-radius: 999px; padding: 5px 11px; font-weight: 700; font-size: 14px; box-shadow: var(--shadow); font-variant-numeric: tabular-nums; white-space: nowrap; }
.pill svg { width: 18px; height: 18px; }
.iconbtn { width: 40px; height: 40px; flex: none; border-radius: 50%; border: 0; background: var(--paper); box-shadow: var(--shadow); display: grid; place-items: center; color: var(--accent); padding: 0; }
.iconbtn svg { width: 20px; height: 20px; }
.iconbtn[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
.lang { border: 0; background: var(--paper); border-radius: 999px; padding: 6px 10px; min-height: 40px; box-shadow: var(--shadow); font-size: 14px; }
.field select { border: 2px solid var(--line); background: var(--paper); border-radius: 14px; padding: 10px 12px; min-height: 48px; width: 100%; box-sizing: border-box; }

/* La stanza */
.room { position: relative; border-radius: 26px; overflow: hidden; box-shadow: var(--shadow-lg); background: #EADBC2; aspect-ratio: 360 / 300; width: 100%; max-width: 100%; touch-action: manipulation; }
.room > svg { display: block; width: 100%; height: 100%; }
.roomwrap { display: flex; flex-direction: column; align-items: center; gap: 0; }
.bubble { position: relative; margin-top: -20px; z-index: 6; max-width: min(90%, 390px); background: var(--paper); color: var(--ink); border-radius: 18px; padding: 10px 16px; font-size: 15.5px; line-height: 1.4; text-align: center; box-shadow: var(--shadow-lg); }
.bubble::before { content: ""; position: absolute; left: 50%; top: -7px; width: 14px; height: 14px; background: var(--paper); transform: translateX(-50%) rotate(45deg); border-radius: 3px; }
.bubble b { display: block; font-family: var(--font-display); font-weight: 600; font-size: 13px; color: var(--accent); letter-spacing: .02em; }
.gift { position: absolute; right: 9%; bottom: 7%; width: 18%; aspect-ratio: 1; border: 0; background: none; padding: 0; z-index: 4; }
.gift svg { width: 100%; height: 100%; }
.pethit { position: absolute; left: 28%; top: 34%; width: 44%; height: 54%; border: 0; background: transparent; border-radius: 40%; z-index: 2; }
.fx { position: absolute; inset: 0; pointer-events: none; z-index: 5; overflow: hidden; }
.fx span { position: absolute; font-weight: 800; font-family: var(--font-display); }
.fx i { position: absolute; width: 8px; height: 12px; border-radius: 2px; }

/* Barre */
.meters { display: flex; flex-direction: column; gap: 12px; background: var(--paper); border-radius: 20px; padding: 14px 14px 14px 12px; box-shadow: var(--shadow); }
.meter { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 10px; align-items: center; }
.meter .bdg { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; box-shadow: inset 0 -3px 0 rgba(0, 0, 0, .14), 0 2px 6px -2px rgba(0, 0, 0, .25); }
.meter .bdg svg { width: 22px; height: 22px; }
.meter .bdg.en { background: radial-gradient(circle at 35% 30%, #FFE7A8, #F2B33D 70%); }
.meter .bdg.xp { background: radial-gradient(circle at 35% 30%, color-mix(in srgb, var(--accent) 45%, #fff), var(--accent) 75%); }
.meter .hd { display: flex; justify-content: space-between; gap: 8px; font-size: 13.5px; font-weight: 700; margin-bottom: 5px; line-height: 1.2; }
.meter .hd .v { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.bar { height: 16px; border-radius: 999px; background: var(--paper-2); overflow: hidden; box-shadow: inset 0 2px 3px rgba(0, 0, 0, .12); position: relative; }
.bar .fill { height: 100%; border-radius: 999px; position: relative; overflow: hidden; background: linear-gradient(180deg, #FFD98A, #EDA634); transition: width .7s cubic-bezier(.3, 1.4, .5, 1); }
.bar.xp .fill { background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 55%, #fff), var(--accent)); }
.bar.ev .fill { background: linear-gradient(180deg, color-mix(in srgb, var(--evc) 55%, #fff), var(--evc)); }
.bar .fill::after { content: ""; position: absolute; left: 6px; right: 6px; top: 3px; height: 4px; border-radius: 999px; background: rgba(255, 255, 255, .5); }
.bar .fill::before { content: ""; position: absolute; top: 0; bottom: 0; width: 40%; left: -50%; background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .45), transparent); animation: shine 3.6s ease-in-out infinite; }
@keyframes shine { 0%, 55% { left: -50%; } 100% { left: 130%; } }
@media (prefers-reduced-motion: reduce) { .bar .fill::before { animation: none; display: none; } }

/* Evento di stagione */
.event { background: var(--paper); border-radius: 20px; padding: 12px 14px 12px 12px; box-shadow: var(--shadow); display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 12px; align-items: center; position: relative; overflow: hidden; }
.event::after { content: ""; position: absolute; right: -30px; top: -30px; width: 110px; height: 110px; border-radius: 50%; background: var(--evc); opacity: .12; pointer-events: none; }
.event .evi { width: 52px; height: 52px; border-radius: 16px; display: grid; place-items: center; background: color-mix(in srgb, var(--evc) 22%, var(--paper)); }
.event .evi svg { width: 36px; height: 36px; }
.event h3 { font-size: 16px; }
.event .evp { font-size: 13px; color: var(--muted); line-height: 1.35; margin: 2px 0 6px; }
.event .evrow { display: flex; align-items: center; gap: 8px; }
.event .evrow .bar { flex: 1; height: 12px; }
.event .evrow .bar .fill::after { top: 2px; height: 3px; }
.event .evn { font-size: 12.5px; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.event .btn { margin-top: 8px; }

/* Obiettivi */
.goals { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px; }
.goal { display: flex; align-items: center; gap: 12px; background: var(--paper); border-radius: 18px; padding: 10px 12px 10px 10px; min-height: 62px; border: 0; width: 100%; text-align: left; box-shadow: var(--shadow); transition: background .2s; }
.goal .cat { width: 40px; height: 40px; border-radius: 13px; display: grid; place-items: center; flex: none; color: #fff; box-shadow: inset 0 -3px 0 rgba(0, 0, 0, .14); }
.goal .cat svg { width: 22px; height: 22px; }
.goal .txt { flex: 1; min-width: 0; overflow-wrap: anywhere; display: flex; flex-direction: column; line-height: 1.3; }
.goal .txt b { font-weight: 600; }
.goal .rw { font-size: 12.5px; color: var(--seed); font-weight: 700; display: inline-flex; align-items: center; gap: 3px; margin-top: 2px; }
.goal .rw svg { width: 13px; height: 13px; }
.goal .go { font-size: 12.5px; font-weight: 700; color: var(--accent); margin-top: 2px; }
.goal .tick { width: 32px; height: 32px; border-radius: 50%; border: 2.5px solid var(--line); display: grid; place-items: center; flex: none; transition: background .2s; }
.goal .tick svg { width: 18px; height: 18px; }
.goal[aria-pressed="true"] { background: var(--accent-soft); box-shadow: none; }
.goal[aria-pressed="true"] .tick { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.goal[aria-pressed="true"] .txt b { color: var(--muted); text-decoration: line-through; text-decoration-thickness: 2px; text-decoration-color: color-mix(in srgb, var(--accent) 60%, transparent); }
.goal[aria-pressed="true"] .cat { filter: saturate(.6); opacity: .8; }

.cta { display: flex; flex-direction: column; gap: 10px; align-items: stretch; background: var(--accent-soft); border-radius: 20px; padding: 16px; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 0; background: var(--paper); border-radius: 999px; padding: 9px 14px; min-height: 44px; box-shadow: var(--shadow); text-align: left; }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
.catgroup { display: flex; flex-direction: column; gap: 8px; }
.cathead { display: flex; align-items: center; gap: 8px; font-family: var(--font-display); font-weight: 600; font-size: 16px; }
.cathead i { width: 28px; height: 28px; border-radius: 9px; display: grid; place-items: center; color: #fff; }
.cathead i svg { width: 17px; height: 17px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field input { border: 2px solid var(--line); background: var(--paper); border-radius: 14px; padding: 11px 14px; min-height: 48px; box-sizing: border-box; width: 100%; }
.field input:focus { border-color: var(--accent); outline: none; }
.inline { display: flex; gap: 8px; }
.inline input { flex: 1; min-width: 0; }
.sticky { position: sticky; bottom: 0; z-index: 8; padding: 18px 0 12px; background: linear-gradient(to bottom, transparent, var(--bg) 26%); }

/* Giorni della settimana */
.sched { display: flex; flex-direction: column; gap: 12px; }
.sched .gname { font-weight: 600; font-size: 14.5px; display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.sched .gname i { width: 24px; height: 24px; border-radius: 8px; display: grid; place-items: center; color: #fff; flex: none; }
.sched .gname i svg { width: 15px; height: 15px; }
.days { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.day { min-height: 40px; border-radius: 11px; border: 0; background: var(--paper-2); font-weight: 700; font-size: 12.5px; padding: 0 2px; text-transform: capitalize; }
.day[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }

/* Interruttori */
.switchrow { display: flex; align-items: center; gap: 12px; min-height: 48px; }
.switchrow > span { flex: 1; }
.switch { width: 56px; height: 32px; border-radius: 999px; border: 0; background: var(--line); position: relative; padding: 0; flex: none; transition: background .2s; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0, 0, 0, .3); transition: left .2s; }
.switch[aria-checked="true"] { background: var(--accent); }
.switch[aria-checked="true"]::after { left: 27px; }

/* Onboarding */
.choose { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.choice { border: 0; background: var(--paper); border-radius: 22px; padding: 10px 6px 12px; display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 0; box-shadow: var(--shadow); }
.choice .halo { width: 100%; max-width: 118px; aspect-ratio: 1; border-radius: 50%; display: grid; place-items: center; }
.choice svg { width: 100%; height: auto; max-width: 118px; }
.choice[aria-checked="true"] { background: var(--accent-soft); box-shadow: inset 0 0 0 3px var(--accent); }
.choice .nm { font-family: var(--font-display); font-weight: 600; font-size: 18px; }
.choice .ds { font-size: 12.5px; color: var(--muted); text-align: center; line-height: 1.3; }
.steps { display: flex; gap: 6px; }
.steps span { height: 6px; flex: 1; border-radius: 999px; background: var(--paper-2); }
.steps span.on { background: var(--accent); }

/* Negozio e casetta */
.tabsx { display: flex; gap: 6px; background: var(--paper-2); padding: 4px; border-radius: 999px; }
.tabsx button { flex: 1; border: 0; background: none; border-radius: 999px; min-height: 44px; font-weight: 700; color: var(--muted); }
.tabsx button[aria-selected="true"] { background: var(--paper); color: var(--ink); box-shadow: var(--shadow); }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.item { border: 0; background: var(--paper); border-radius: 18px; padding: 10px 6px; display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 138px; font-size: 13.5px; text-align: center; box-shadow: var(--shadow); line-height: 1.25; }
.item .art { width: 100%; height: 62px; display: grid; place-items: center; }
.item .art svg { max-width: 82px; max-height: 62px; }
.item .price { display: inline-flex; align-items: center; gap: 3px; font-weight: 700; color: var(--seed); font-variant-numeric: tabular-nums; }
.item .price svg { width: 14px; height: 14px; }
.item .state { font-size: 12px; font-weight: 700; color: var(--accent); }
.item .tag { font-size: 11.5px; font-weight: 700; color: var(--muted); line-height: 1.2; }
.item[aria-pressed="true"] { background: var(--accent-soft); box-shadow: inset 0 0 0 3px var(--accent); }
.item.cant { opacity: .55; }

/* Avventure */
.dest { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 12px; align-items: center; background: var(--paper); border-radius: 20px; padding: 10px; box-shadow: var(--shadow); border: 0; width: 100%; text-align: left; }
.dest .pc { width: 112px; aspect-ratio: 16 / 10; border-radius: 12px; overflow: hidden; box-shadow: 0 0 0 3px #fff, 0 2px 6px rgba(0, 0, 0, .2); margin: 3px; box-sizing: border-box; width: 106px; }
.dest .pc svg { width: 100%; height: 100%; display: block; }
.dest .meta { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.dest .meta b { font-family: var(--font-display); font-weight: 600; font-size: 17px; line-height: 1.25; }
.dest .meta svg { width: 14px; height: 14px; vertical-align: -2px; }
.dest[aria-pressed="true"] { box-shadow: inset 0 0 0 3px var(--accent); background: var(--accent-soft); }
.dest.locked { opacity: .55; }
.departbar { position: fixed; left: 0; right: 0; bottom: calc(66px + env(safe-area-inset-bottom, 0px)); z-index: 9; padding: 10px 16px; }
.departbar .in { max-width: 448px; margin: 0 auto; }
.album { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.post { border: 0; padding: 5px 5px 0; background: #FFFDF8; color: #2F2A26; border-radius: 10px; overflow: hidden; box-shadow: var(--shadow); display: flex; flex-direction: column; text-align: left; }
.post:nth-child(3n+1) { transform: rotate(-1.2deg); } .post:nth-child(3n+2) { transform: rotate(.8deg); } .post:nth-child(3n) { transform: rotate(-.5deg); }
.post svg { width: 100%; height: auto; display: block; aspect-ratio: 16 / 10; border-radius: 5px; }
.post span { font-size: 12px; padding: 5px 2px 7px; line-height: 1.25; min-height: 2.5em; }
.post.missing { box-shadow: none; background: var(--paper-2); color: var(--muted); }
.post.missing .q { aspect-ratio: 16 / 10; display: grid; place-items: center; color: var(--muted); font-family: var(--font-display); font-size: 26px; border-radius: 5px; border: 2px dashed var(--line); box-sizing: border-box; }
.story { background: var(--paper); border-radius: 22px; padding: 14px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 10px; }
.story .pcbig { border-radius: 14px; overflow: hidden; box-shadow: 0 0 0 5px #fff, 0 4px 14px rgba(0, 0, 0, .25); margin: 5px; }
.story .pcbig svg { width: 100%; height: auto; display: block; }
.away { display: flex; flex-direction: column; gap: 10px; background: var(--accent-soft); border-radius: 20px; padding: 16px; }

/* Diario */
.moods { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.mood { border: 0; background: var(--paper-2); border-radius: 14px; min-height: 66px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 12px; padding: 6px 2px; }
.mood svg { width: 30px; height: 30px; }
.mood[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
.question { font-family: var(--font-display); font-size: 19px; font-weight: 500; }
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; text-align: center; font-variant-numeric: tabular-nums; }
.cal .wd { font-size: 12px; color: var(--muted); font-weight: 700; padding-bottom: 2px; }
.cal .d { aspect-ratio: 1; border-radius: 10px; display: grid; place-items: center; font-size: 13px; background: var(--paper-2); position: relative; }
.cal .d.l1 { background: color-mix(in srgb, var(--accent) 25%, var(--paper-2)); }
.cal .d.l2 { background: color-mix(in srgb, var(--accent) 55%, var(--paper-2)); }
.cal .d.l3 { background: var(--accent); color: var(--on-accent); }
.cal .d.rest { background: transparent; box-shadow: inset 0 0 0 2px var(--line); }
.cal .d.today { outline: 2px solid var(--ink); outline-offset: 1px; }
.cal .d.empty { background: none; }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); align-items: center; }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 4px; vertical-align: -1px; margin-right: 4px; }
.weekrow { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; text-align: center; }
.weekrow span { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 12px; color: var(--muted); font-weight: 700; text-transform: capitalize; }
.weekrow i { width: 30px; height: 30px; border-radius: 50%; background: var(--paper-2); display: block; }
.weekrow i.l1 { background: color-mix(in srgb, var(--accent) 30%, var(--paper-2)); }
.weekrow i.l2 { background: color-mix(in srgb, var(--accent) 60%, var(--paper-2)); }
.weekrow i.l3 { background: var(--accent); }
.weekrow i.rest { background: transparent; box-shadow: inset 0 0 0 2px var(--line); }
.entries { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px; }
.entries li { background: var(--paper); border-radius: 16px; padding: 12px; display: flex; flex-direction: column; gap: 4px; box-shadow: var(--shadow); }
.entries .h { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.entries .h svg { width: 20px; height: 20px; color: var(--accent); }
.entries .q { font-size: 13px; color: var(--muted); font-style: italic; }
.entries .t { overflow-wrap: anywhere; }

/* Finestre sopra la pagina */
.overlay { position: fixed; inset: 0; z-index: 30; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); display: grid; place-items: center; padding: 16px; overflow-y: auto; box-sizing: border-box; }
.overlay .box { width: 100%; max-width: 420px; display: flex; flex-direction: column; align-items: center; gap: 16px; text-align: center; box-sizing: border-box; }
.breath { position: relative; width: min(72vw, 280px); aspect-ratio: 1; display: grid; place-items: center; }
.breath .ring { position: absolute; inset: 0; border-radius: 50%; background: radial-gradient(circle, var(--accent-soft) 0%, color-mix(in srgb, var(--accent) 30%, var(--accent-soft)) 100%); transform: scale(.55); }
.breath svg { position: relative; width: 52%; }
.breath-word { font-family: var(--font-display); font-size: 26px; font-weight: 600; min-height: 1.3em; }
.levelup .badge { font-family: var(--font-display); font-weight: 700; font-size: 52px; color: var(--accent); line-height: 1; }
.weekimg { width: 100%; height: auto; max-height: 64vh; object-fit: contain; border-radius: 16px; box-shadow: var(--shadow-lg); background: var(--paper-2); -webkit-touch-callout: default; user-select: auto; }

/* Barra delle sezioni */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; background: color-mix(in srgb, var(--paper) 94%, transparent); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); box-shadow: 0 -1px 0 var(--line), 0 -8px 20px -16px rgba(0, 0, 0, .4); padding-bottom: env(safe-area-inset-bottom, 0px); z-index: 10; }
.tabs .in { max-width: 480px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); }
.tab { background: none; border: 0; min-height: 64px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11.5px; color: var(--muted); font-weight: 700; position: relative; }
.tab .ic { width: 44px; height: 28px; border-radius: 999px; display: grid; place-items: center; transition: background .2s; }
.tab svg { width: 23px; height: 23px; }
.tab[aria-current="page"] { color: var(--accent); }
.tab[aria-current="page"] .ic { background: var(--accent-soft); }
.tab .dot { position: absolute; top: 8px; left: calc(50% + 10px); width: 9px; height: 9px; border-radius: 50%; background: #E2643F; box-shadow: 0 0 0 2px var(--paper); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(80px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); border-radius: 999px; padding: 10px 18px; font-weight: 600; font-size: 15px; z-index: 40; max-width: calc(100% - 32px); text-align: center; box-sizing: border-box; }
.help p + p { margin-top: 4px; }
.hasbar .app { padding-bottom: 180px; }

/* ===== Versione 4 ===== */

.actions { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; width: 100%; margin-top: 12px; }
.act { border: 0; background: var(--paper); border-radius: 18px; padding: 8px 2px 7px; min-height: 64px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 12px; font-weight: 700; color: var(--ink); box-shadow: var(--shadow); line-height: 1.15; text-align: center; }
.act .aci { width: 34px; height: 34px; border-radius: 12px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); }
.act .aci svg { width: 20px; height: 20px; }
.act[data-act="feed"] .aci { background: #FDE3D4; color: #D9603A; }
.act[data-act="play"] .aci { background: #FFF0C2; color: #C98A10; }
.act[data-act="talk"] .aci { background: #E3EEFB; color: #3E7FC0; }
.act[data-act="nap"] .aci, .act[data-act="wake"] .aci { background: #E6E3FA; color: #6258C8; }
.act[data-act="photo"] .aci { background: #FBE0EA; color: #C8507A; }
.letter { position: absolute; left: 5%; bottom: 6%; width: 17%; aspect-ratio: 60 / 46; border: 0; background: none; padding: 0; z-index: 4; }
.letter svg { width: 100%; height: 100%; }
.meter .bdg.joy { background: radial-gradient(circle at 35% 30%, #FFC2D4, #EE7FA0 72%); }
.bar.joy .fill { background: linear-gradient(180deg, #FFB3C9, #E86A92); }
.teaser { display: flex; flex-direction: column; gap: 8px; }
.gdots { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; align-items: center; }
.gdots i { height: 12px; border-radius: 999px; background: var(--paper-2); display: block; position: relative; }
.gdots i.on { background: linear-gradient(90deg, #FFD27A, #F2B33D); }
.gdots i.big { height: 30px; background: none; }
.gdots i.big svg { position: absolute; inset: -4px 0 0; margin: auto; width: 30px; height: 30px; opacity: .55; filter: grayscale(.6); }
.gdots i.big.on svg { opacity: 1; filter: none; }
.floatplus { position: fixed; z-index: 60; font-family: var(--font-display); font-weight: 700; font-size: 20px; color: var(--seed); pointer-events: none; }
.flyseed { position: fixed; z-index: 60; width: 18px; height: 18px; pointer-events: none; }
.flyseed svg { width: 100%; height: 100%; }
.flyfood { position: absolute; width: 17%; pointer-events: none; }
.flyfood svg { width: 100%; height: auto; display: block; filter: drop-shadow(0 4px 4px rgba(0, 0, 0, .2)); }
.room.dark { box-shadow: var(--shadow-lg), 0 0 0 2px rgba(98, 88, 200, .25); }
.flash { position: absolute; inset: 0; background: #fff; z-index: 7; pointer-events: none; }
.sheetwrap { place-items: end center; padding: 0; }
.sheet { width: 100%; max-width: 480px; background: var(--paper); border-radius: 26px 26px 0 0; padding: 10px 16px calc(18px + env(safe-area-inset-bottom, 0px)); box-sizing: border-box; display: flex; flex-direction: column; gap: 10px; text-align: center; box-shadow: 0 -10px 30px -10px rgba(0, 0, 0, .35); }
.sheet .grab { width: 44px; height: 5px; border-radius: 999px; background: var(--line); margin: 0 auto 4px; }
.snacks { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.snack { border: 0; background: var(--paper-2); border-radius: 18px; padding: 10px 4px 8px; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 13px; font-weight: 600; position: relative; min-height: 96px; }
.snack svg { width: 48px; height: 48px; }
.favdot { position: absolute; top: 6px; right: 8px; color: #E86A92; font-style: normal; font-size: 14px; }
.gamebox { width: 100%; max-width: 440px; display: flex; flex-direction: column; gap: 10px; align-items: stretch; text-align: center; }
.ghead { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.gtime { height: 8px; border-radius: 999px; background: var(--paper-2); overflow: hidden; }
.gtime i { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, #FFD27A, #E9A23B); border-radius: 999px; }
.arena { position: relative; height: min(58vh, 460px); border-radius: 24px; overflow: hidden; background: linear-gradient(#26305E, #5C4A7A 70%, #F2A07A); box-shadow: var(--shadow-lg); touch-action: none; user-select: none; -webkit-user-select: none; }
.arena::before { content: ""; position: absolute; inset: 0; background-image: radial-gradient(1.5px 1.5px at 20% 30%, #fff8 50%, transparent 51%), radial-gradient(1.5px 1.5px at 70% 20%, #fff8 50%, transparent 51%), radial-gradient(1.2px 1.2px at 45% 60%, #fff6 50%, transparent 51%), radial-gradient(1.2px 1.2px at 85% 50%, #fff6 50%, transparent 51%); }
.gpet { position: absolute; left: 50%; bottom: 4px; width: 104px; margin-left: -52px; }
.gstart { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 24px 24px 120px; color: #fff; background: rgba(20, 16, 40, .35); }
.gstart .muted { color: #E6E0F5; }
.gcount { position: absolute; left: 0; right: 0; top: 34%; text-align: center; font-family: var(--font-display); font-weight: 700; font-size: 64px; color: #FFE7A0; text-shadow: 0 4px 14px rgba(0, 0, 0, .35); pointer-events: none; }
.fstar { position: absolute; top: 0; width: 58px; height: 58px; border: 0; padding: 6px; background: none; touch-action: none; }
.fstar svg { width: 100%; height: 100%; filter: drop-shadow(0 0 6px rgba(255, 231, 160, .9)); }
.fstar.gold svg { filter: drop-shadow(0 0 10px rgba(255, 201, 77, 1)); }
.gplus { position: absolute; font-family: var(--font-display); font-weight: 700; color: #FFE7A0; font-size: 22px; pointer-events: none; }
.talkbox { gap: 12px; }
.bubble.static { margin: 0; max-width: 100%; min-height: 2.8em; }
.paper { position: relative; width: 100%; background: #FFF8EA; color: #3A2F25; border-radius: 6px; padding: 28px 24px 24px; box-sizing: border-box; text-align: left; box-shadow: 0 12px 30px -12px rgba(0, 0, 0, .45); border-top: 6px solid #F2C9B8; }
.paper::after { content: ""; position: absolute; top: 14px; right: 16px; width: 44px; height: 52px; border: 2px dashed #E2B3A1; border-radius: 4px; background: radial-gradient(circle at 50% 45%, #F7A9C0 0 9px, transparent 10px), #FFF1E8; }
.paper h2 { color: #B5604A; margin-bottom: 14px; }
.paper .lt { font-family: var(--font-display); font-size: 21px; line-height: 1.5; font-weight: 500; padding-right: 8px; }
.paper h2 { padding-right: 60px; }
.paper .sign { margin-top: 14px; font-family: var(--font-display); color: #8A6A4E; font-weight: 600; }
.paper .lpet { position: absolute; right: 10px; bottom: -26px; width: 84px; }
.levelup .box { position: relative; overflow: hidden; }
.levelup .box > *:not(.rays):not(.fx) { position: relative; z-index: 1; }
.rays { position: absolute; left: 50%; top: 32%; width: 640px; height: 640px; margin: -320px 0 0 -320px; background: repeating-conic-gradient(color-mix(in srgb, var(--accent) 16%, transparent) 0 10deg, transparent 10deg 20deg); border-radius: 50%; pointer-events: none; -webkit-mask: radial-gradient(circle, #000 20%, transparent 65%); mask: radial-gradient(circle, #000 20%, transparent 65%); }
.spitem { width: 120px; height: 100px; display: grid; place-items: center; }
.spitem svg { max-width: 120px; max-height: 100px; }
.tracks { display: flex; flex-wrap: wrap; gap: 8px; padding-top: 6px; }
.chip.playing { box-shadow: inset 0 0 0 2px var(--accent), var(--shadow); }
.tutwrap { position: fixed; inset: 0; z-index: 70; }
.tutblock { position: absolute; inset: 0; }
.tutring { position: fixed; border-radius: 22px; box-shadow: 0 0 0 9999px rgba(24, 18, 12, .55), 0 0 0 3px #fff inset; pointer-events: none; }
.tutbox { position: fixed; left: 16px; right: 16px; max-width: 420px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; font-size: 16px; box-shadow: var(--shadow-lg); }


/* ===== Versione 5 ===== */
.btn.ghost.light { color: #fff; box-shadow: inset 0 0 0 2px #fff; }
.hub { max-height: 90vh; overflow-y: auto; }
.hubgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; text-align: left; }
.hubcard { border: 0; background: var(--paper-2); border-radius: 18px; padding: 12px; display: grid; grid-template-columns: 40px minmax(0, 1fr); grid-template-rows: auto auto; column-gap: 10px; align-items: center; min-height: 76px; text-align: left; }
.hubcard .hubic { grid-row: 1 / span 2; width: 40px; height: 40px; border-radius: 13px; display: grid; place-items: center; box-shadow: inset 0 -3px 0 rgba(0, 0, 0, .15); }
.hubcard .hubic svg { width: 22px; height: 22px; }
.hubcard b { font-family: var(--font-display); font-weight: 600; font-size: 15px; line-height: 1.2; }
.hubcard span:last-child { font-size: 12px; color: var(--muted); line-height: 1.25; }
.arena.calm { background: linear-gradient(#BFE0F2, #F7D9E3 75%, #FCEBD0); }
.lgbubble { position: absolute; left: 50%; bottom: 90px; margin-left: -80px; width: 160px; aspect-ratio: 1; padding: 18px 14px; box-sizing: border-box; border-radius: 50%; background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, .95), rgba(214, 236, 247, .55) 60%, rgba(155, 140, 242, .35)); box-shadow: inset 0 0 0 2px rgba(255, 255, 255, .8), 0 6px 18px rgba(80, 90, 160, .25); color: #3A3560; font-size: 14px; font-weight: 600; text-align: center; overflow-wrap: anywhere; display: grid; place-items: center; }
.gardenwrap { border-radius: 22px; overflow: hidden; box-shadow: var(--shadow-lg); }
.gardenwrap svg { display: block; width: 100%; height: auto; }
.glist { text-align: left; }
.glist ul { list-style: none; padding: 0; margin: 6px 0 0; display: flex; flex-direction: column; gap: 6px; }
.glist li { display: grid; grid-template-columns: 12px minmax(0, 1fr) auto; gap: 8px; align-items: center; font-size: 14px; background: var(--paper); border-radius: 12px; padding: 8px 10px; }
.glist .gdot { width: 12px; height: 12px; border-radius: 50%; }
.glist time { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.wavearena { background: linear-gradient(#CDEAF5, #9CCFE6 60%, #6FB4D8); display: grid; place-items: center; touch-action: none; }
.wcirc { width: 220px; height: 220px; border-radius: 50%; background: radial-gradient(circle, rgba(255, 255, 255, .85), rgba(255, 255, 255, .25)); display: grid; place-items: center; box-shadow: 0 0 0 6px rgba(255, 255, 255, .4); transition: box-shadow .3s; transform: scale(.55); }
.wcirc.sync { box-shadow: 0 0 0 8px rgba(111, 207, 151, .85), 0 0 40px rgba(111, 207, 151, .7); }
.wpet { width: 120px; }
.wlbl { position: absolute; left: 0; right: 0; bottom: 18px; text-align: center; font-family: var(--font-display); font-weight: 600; font-size: 22px; color: #1E4A63; margin: 0; pointer-events: none; }
.singarena { background: linear-gradient(#FCE3EC, #F7D9E3 50%, #DDEFD6); }
.spet { position: absolute; left: 50%; top: 18px; width: 120px; margin-left: -60px; }
.singarena .wlbl { bottom: auto; top: 150px; color: #8A3A5A; }
.flowers { position: absolute; left: 0; right: 0; bottom: 18px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; padding: 0 10px; }
.sflower { border: 0; background: rgba(255, 255, 255, .55); border-radius: 22px; aspect-ratio: 1; padding: 8px; transition: background .15s, box-shadow .15s; }
.sflower svg { width: 100%; height: 100%; }
.sflower.f0 svg ellipse { fill: #F2789B; } .sflower.f1 svg ellipse { fill: #FFC94D; } .sflower.f2 svg ellipse { fill: #6FB7E8; } .sflower.f3 svg ellipse { fill: #9B8CF2; }
.sflower.lit { background: #fff; box-shadow: 0 0 0 4px rgba(255, 255, 255, .9), 0 0 26px rgba(255, 220, 120, .9); }
.sflower[disabled] { cursor: default; }
.stretcharena { background: linear-gradient(#FCEBD0, #FBE0CF); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 12px; box-sizing: border-box; color: #3B2A1E; }
.stretcharena h3 { margin-top: 6px; } .stretcharena p { margin: 0; text-align: center; max-width: 300px; }
.stwrap { position: relative; width: 200px; height: 200px; }
.stwrap .ring { position: absolute; inset: 0; width: 100%; height: 100%; }
.stpet { position: absolute; inset: 30px; }
.stretcharena .gstart { color: #3B2A1E; background: rgba(252, 235, 208, .92); }
.stretcharena .gstart .muted { color: #6E655D; }
.mgrid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.mtile { border: 0; padding: 0; aspect-ratio: 1; border-radius: 18px; background: none; position: relative; }
.mtile .mback, .mtile .mface { position: absolute; inset: 0; border-radius: 18px; display: grid; place-items: center; }
.mtile .mback { background: linear-gradient(135deg, #C9A27A, #9A7650); box-shadow: inset 0 -4px 0 rgba(0, 0, 0, .15); }
.mtile .mback::after { content: ""; width: 34%; height: 28%; border-radius: 50%; background: rgba(255, 255, 255, .25); }
.mtile .mface { background: var(--paper); box-shadow: var(--shadow); display: none; padding: 10%; }
.mtile .mface svg { width: 100%; height: 100%; }
.mtile.up .mback { display: none; } .mtile.up .mface { display: grid; }
.mtile.done .mface { background: var(--accent-soft); box-shadow: inset 0 0 0 3px var(--accent); }
.gendcard { text-align: center; display: flex; flex-direction: column; gap: 6px; }
.tricklist { display: flex; flex-direction: column; gap: 6px; }
.trick { border: 0; background: var(--paper-2); border-radius: 14px; min-height: 50px; padding: 8px 14px; display: flex; align-items: center; justify-content: space-between; gap: 10px; text-align: left; }
.trick[disabled] { opacity: .55; }
.trick svg { width: 14px; height: 14px; vertical-align: -2px; }
.rainbow { position: absolute; left: 10%; right: 10%; top: 8%; aspect-ratio: 2 / 1; border-radius: 999px 999px 0 0; background: radial-gradient(circle at 50% 100%, transparent 44%, #9B8CF2 44% 50%, #6FB7E8 50% 56%, #6FCF97 56% 62%, #FFD25E 62% 68%, #F28A3C 68% 74%, #E2454A 74% 80%, transparent 80%); opacity: .8; pointer-events: none; }
.friendhit { position: absolute; left: 16%; top: 22%; width: 19%; height: 22%; border: 0; background: transparent; z-index: 3; border-radius: 40%; }
.summary { display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 10px; align-items: center; background: var(--accent-soft); border-radius: 16px; padding: 10px 12px; }
.summary .sumpet { width: 56px; }
.summary p { font-size: 14px; line-height: 1.4; }
.doclinks { display: flex; flex-direction: column; }
.doclink { border: 0; background: none; text-align: left; min-height: 48px; display: flex; align-items: center; justify-content: space-between; font-weight: 600; border-bottom: 1px solid var(--line); padding: 0 2px; }
.doclink:last-child { border-bottom: 0; }
.doclink span { color: var(--muted); font-size: 20px; }
.overlay .docbox { text-align: left; align-items: stretch; }
.overlay .docbox h2 { text-align: center; }
.doc { max-height: 62vh; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; font-size: 15px; line-height: 1.5; padding-right: 4px; }
.doc h3 { margin-top: 6px; }
.ritual { gap: 12px; }
.ritem { border: 0; background: var(--paper-2); border-radius: 14px; min-height: 52px; display: flex; align-items: center; gap: 12px; padding: 8px 12px; text-align: left; width: 100%; font-weight: 600; }
.ritem .tick { width: 28px; height: 28px; border-radius: 50%; border: 2.5px solid var(--line); display: grid; place-items: center; flex: none; }
.ritem .tick svg { width: 16px; height: 16px; }
.ritem[aria-pressed="true"] { background: var(--accent-soft); }
.ritem[aria-pressed="true"] .tick { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }

.gamebox .inline input { border: 2px solid var(--line); background: var(--paper); border-radius: 14px; padding: 11px 14px; min-height: 48px; box-sizing: border-box; }
.gamebox .inline input:focus { border-color: var(--accent); outline: none; }

/* ===== Versione 6: grafica ===== */
body::after { content: ""; position: fixed; inset: -20% -20% auto; height: 70vh; z-index: -1; pointer-events: none; background: radial-gradient(40% 50% at 20% 30%, color-mix(in srgb, var(--accent) 12%, transparent), transparent 70%), radial-gradient(35% 45% at 80% 20%, color-mix(in srgb, #FFD27A 16%, transparent), transparent 70%); animation: blobs 22s ease-in-out infinite alternate; }

  return `<path d="M22 30 L58 30 C52 70 46 100 52 132 L22 132 Z" fill="${c1}"/><path d="M150 30 L114 30 C120 70 126 100 120 132 L150 132 Z" fill="${c1}"/>${dots ? [[32, 50], [42, 72], [30, 96], [44, 116], [140, 50], [130, 72], [142, 96], [128, 116]].map(([x, y]) => `<circle cx="${x}" cy="${y}" r="2.6" fill="${c2}"/>`).join("") : ""}<path d="M22 30 L58 30 C52 70 46 100 52 132" fill="none" stroke="${c2}" stroke-width="2"/><path d="M150 30 L114 30 C120 70 126 100 120 132" fill="none" stroke="${c2}" stroke-width="2"/><rect x="16" y="24" width="140" height="8" rx="4" fill="#8E6440"/>`;
}
function wallSwatch(id) {
  const [a, b] = WALLS[id]; const c = nid("sw"); const st = WALL_STYLE[id];
  return `<svg viewBox="0 0 60 44" aria-hidden="true"><defs><clipPath id="${c}"><rect width="60" height="44" rx="8"/></clipPath></defs><g clip-path="url(#${c})"><rect width="60" height="44" fill="${a}"/>${st === "clouds" ? cloudPuff(18, 14, 0.7) + cloudPuff(44, 32, 0.6) + `<circle cx="46" cy="10" r="1.4" fill="#fff"/><circle cx="10" cy="34" r="1.4" fill="#fff"/>` : `<g transform="scale(.5)">${wallPattern(st, a, b)}</g>`}</g><rect x=".5" y=".5" width="59" height="43" rx="7.5" fill="none" stroke="#000" stroke-opacity=".06"/></svg>`;
}
const _itemArt = itemArt;
itemArt = function (id) {
  if (HAT_ART[id]) return `<svg viewBox="${HAT_VB[id]}" aria-hidden="true">${HAT_ART[id](92)}</svg>`;
  if (WALL_STYLE[id]) return wallSwatch(id);
  if (CURTAINS[id]) { const [a, b, d] = CURTAINS[id]; return `<svg viewBox="12 20 148 116" aria-hidden="true"><rect x="40" y="34" width="92" height="98" rx="8" fill="#CFE7F1"/>${curtainPair(a, b, d)}</svg>`; }
  if (ALT_VB[id]) return `<svg viewBox="${ALT_VB[id]}" aria-hidden="true">${furnAlt(SLOT[id], [id], true, null)}</svg>`;
  return _itemArt(id);
};

/* --- Negozio: si prova prima di comprare --- */
let tryId = null, tryScroll = 0;
function shopItem(s) {
  const t = L(); const own = ownsItem(s); const use = inUseItem(s); const trying = tryId === s.id;
  let state;
  if (trying) state = `<span class="state try">${t.tryOn}</span>`;
  else if (own) state = `<span class="state">${use ? t.using : t.use}</span>`;
  else if (s.event) state = `<span class="tag">${t.eventOnly}</span>`;
  else if (s.special) state = `<span class="tag">${t.specialOnly}</span>`;
  else if (s.found) state = `<span class="tag">${t.foundOnly}</span>`;
  else state = `<span class="price">${SEED}${s.price}</span>`;
  return `<button class="item ${lockedItem(s) ? "locked" : ""} ${trying ? "trying" : ""}" aria-pressed="${use}" data-shop="${s.id}"><span class="art">${itemArt(s.id)}</span><span class="nm">${esc(t.items[s.id])}</span>${state}</button>`;
}
function tryBar() {
  const t = L(); const s = tryId && SHOP.find((x) => x.id === tryId); if (!s) return "";
  let act;
  if (s.event) act = `<span class="tag">${t.eventOnly}</span>`;
  else if (s.special) act = `<span class="tag">${t.specialOnly}</span>`;
  else if (s.found) act = `<span class="tag">${t.foundOnly}</span>`;
  else if (S.seeds < s.price) act = `<button class="btn" disabled>${esc(t.missSeeds(s.price - S.seeds))}</button>`;
  else act = `<button class="btn" id="tryBuy">${t.buyFor} · <span class="pr">${SEED}${s.price}</span></button>`;
  return `<div class="departbar trybar" role="region" aria-label="${esc(t.tryOn)}"><div class="in"><div class="tinfo"><span class="tart">${itemArt(s.id)}</span><b>${esc(t.tryLbl(t.items[s.id]))}</b></div><div class="tact">${act}<button class="btn ghost" id="tryCancel">${t.tryCancel}</button></div></div></div>`;
}
viewHome = function () {
  const t = L(); const look = lookWith(tryId);
  const room = roomSVG({ ph: phase(), pet: S.pet, e: tryId ? "felice" : "normale", hat: look.hat, st: stage(), furn: look.furn, wall: look.wall, away: !!S.away, label: S.petName, season: season().id });
  const list = shopList(homeTab);
  let grid;
  if (homeTab === "furn") grid = GROUP_ORDER.map((g) => `<div class="shopgrp"><h3>${t.groups[g]}</h3><div class="grid3">${list.filter((s) => GROUP[s.id] === g).map(shopItem).join("")}</div></div>`).join("");
  else grid = `<div class="grid3">${homeTab === "wear" ? `<button class="item" aria-pressed="${!S.hat}" data-wear=""><span class="art"><svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M7 17L17 7"/></svg></span><span class="nm">${t.none}</span><span class="state">${!S.hat ? t.using : t.use}</span></button>` : ""}${list.map(shopItem).join("")}</div>`;
  return `${topBar()}<div class="stack"><div class="room ${tryId ? "trying" : ""}" id="room">${room}<div class="fx" id="fx"></div>${tryId ? `<span class="trytag">${t.tryOn}</span>` : ""}</div>
  <h1>${t.homeT}</h1><p class="muted">${t.homeP}</p>
  <div class="tabsx" role="tablist">${[["furn", t.shopFurn], ["wear", t.shopWear], ["wall", t.shopWall]].map(([k, l]) => `<button role="tab" aria-selected="${homeTab === k}" data-hometab="${k}">${l}</button>`).join("")}</div>
  ${grid}</div>${tryBar()}`;
};
function keepScroll(fn) { const y = window.scrollY; fn(); window.scrollTo(0, y); }
document.addEventListener("click", (ev) => {
  const b = ev.target.closest("button"); if (!b) return;
  if (b.dataset.tab !== undefined || b.dataset.hometab !== undefined || b.dataset.wear !== undefined) tryId = null;
}, true);
document.addEventListener("click", (ev) => {
  const b = ev.target.closest("button"); if (!b) return; const t = L();
  if (b.dataset.shop) {
    const s = SHOP.find((x) => x.id === b.dataset.shop); if (!s) return;
    if (ownsItem(s)) {
      tryId = null;
      if (s.kind === "furn") { if (CURTAINS[s.id] || !S.furn.includes(s.id)) S.furn = withItem(S.furn, s.id); else S.furn = S.furn.filter((x) => x !== s.id); }
      else if (s.kind === "wear") S.hat = S.hat === s.id ? null : s.id; else S.wall = s.id;
      SND.play("pop"); save(); keepScroll(render); jump(false); burst("star", 6); return;
    }
    if (tryId === s.id) { tryId = null; SND.play("click"); keepScroll(render); return; }
    if (!tryId) tryScroll = window.scrollY;
    tryId = s.id; SND.play("sparkle"); SND.haptic && SND.haptic(10);
    keepScroll(render);
    window.scrollTo({ top: 0, behavior: anim ? "smooth" : "auto" });
    setTimeout(() => { jump(true); burst("star", 8); }, anim ? 260 : 0);
    return;
  }
  if (b.id === "tryBuy") {
    const s = tryId && SHOP.find((x) => x.id === tryId); if (!s || lockedItem(s)) return;
    if (S.seeds < s.price) { toast(t.notEnough); return; }
    S.seeds -= s.price; if (!S.owned.includes(s.id)) S.owned.push(s.id); applyItem(s); tryId = null;
    save(); render(); window.scrollTo(0, 0); toast(t.bought(t.items[s.id])); SND.play("buy"); SND.haptic && SND.haptic([15, 40, 25]);
    setTimeout(() => { jump(true); burst("star", 12); burst("heart", 6); }, 60);
    return;
  }
  if (b.id === "tryCancel") { tryId = null; SND.play("click"); render(); window.scrollTo({ top: tryScroll, behavior: anim ? "smooth" : "auto" }); return; }
});

/* --- Niente più felicità: la card mostra il livello e la settimana --- */
const FLAME_W = `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5c1 4 5.5 5.2 5.5 10.5a5.5 5.5 0 0 1-11 0c0-2.8 1.6-4.4 2.7-5.4.3 2.2 1.4 3.3 2.7 3.3C11.4 8.5 11 5.5 12 2.5Z" fill="#fff"/></svg>`;
function weekDots() {
  const now = new Date(); const start = new Date(now); start.setDate(now.getDate() - ((now.getDay() + 6) % 7));
  const today = dkey(now);
  return [0, 1, 2, 3, 4, 5, 6].map((i) => {
    const d = new Date(start); d.setDate(start.getDate() + i); const k = dkey(d); const r = S.days[k];
    const on = r && (r.done > 0 || r.rest || (r.free && k !== today && k < today)); const isT = k === today; const fut = k > today;
    return `<i class="${on ? "on" : ""} ${isT ? "now" : ""} ${fut ? "fut" : ""}" title="${esc(wdName(i, "long"))}"><b>${wdName(i, "narrow")}</b></i>`;
  }).join("");
}
meters = function () {
  const t = L(); const need = xpNeed(S.level); const tg = todayGoals(); const done = S.done.filter((g) => tg.includes(g)).length;
  const pct = tg.length ? Math.round((done / tg.length) * 100) : 100; const C = 2 * Math.PI * 42; const off = C * (1 - pct / 100);
  const from = prevBar.ring != null && anim ? C * (1 - prevBar.ring / 100) : off;
  const gid = nid("rg"); const label = !tg.length ? t.freeL : done === tg.length ? t.allDoneL : t.todayL;
  return `<div class="meters2"><div class="ringwrap" role="progressbar" aria-label="${esc(t.todayL)}" aria-valuemin="0" aria-valuemax="${tg.length}" aria-valuenow="${done}"><svg viewBox="0 0 100 100" aria-hidden="true"><defs><linearGradient id="${gid}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFD27A"/><stop offset="1" stop-color="var(--accent)"/></linearGradient></defs><circle cx="50" cy="50" r="42" class="rbg"/><circle cx="50" cy="50" r="42" class="rfg" stroke="url(#${gid})" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${from.toFixed(1)}" data-ring="${off.toFixed(1)}" data-pct="${pct}" transform="rotate(-90 50 50)"/></svg><div class="rtxt"><b>${tg.length ? `${done}/${tg.length}` : "☀"}</b><span>${esc(label)}</span></div></div>
  <div class="mside"><div class="mrow"><span class="bdg xp">${STAR_W}</span><div class="mcol"><div class="hd"><span>${t.level} ${S.level}</span><span class="v">${t.xpTo(S.xp, need)}</span></div><div class="bar xp" role="progressbar" aria-label="${t.level}" aria-valuemin="0" aria-valuemax="${need}" aria-valuenow="${S.xp}">${fillTag("xp", (S.xp / need) * 100)}</div></div></div>
  <div class="mrow"><span class="bdg wk">${FLAME_W}</span><div class="mcol"><div class="hd"><span>${t.weekL}</span></div><div class="wdots">${weekDots()}</div></div></div></div></div>`;
};

/* --- Righe degli obiettivi colorate per categoria --- */
const _goalRow = goalRow;
goalRow = function (g) { return _goalRow(g).replace('class="goal"', `class="goal" style="--cc:${CAT_COLOR[goalCat(g)]}"`); };

window.__tlevel = SND.level;

splash();
render();

})();
</script>

</body>

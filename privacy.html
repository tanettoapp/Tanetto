const S = {"it":{"lang":"Italiano","locale":"it-IT","privB":"Informativa privacy","termsB":"Condizioni d'uso","priv":["Titolare del trattamento: il progetto Tanetto, gestito da una persona fisica. Contatto: tanettoapp@gmail.com.","Quali dati: Tanetto funziona anche senza account. In quel caso compagno, obiettivi, diario, giardino e progressi vengono salvati solo nella memoria di questo dispositivo e non vengono inviati a nessuno. I pensieri scritti in «Lascia andare» non vengono salvati affatto.","Se scrivi il tuo nome per il saluto (è facoltativo), resta salvato allo stesso modo: sul dispositivo e, se hai un account, nel backup online.","Copia dei dati: se tocchi «Salva una copia», Tanetto crea un file con i tuoi progressi direttamente sul tuo dispositivo. Il file resta a te e non viene inviato a nessuno. Con «Ripristina una copia» il file viene letto solo dal tuo dispositivo.","Account facoltativo e backup online: se scegli di creare un account (con Google o con e-mail e password), conserviamo il tuo indirizzo e-mail e una copia dei tuoi progressi, solo per farti accedere e per permetterti di ripristinarli. I dati sono custoditi da Google Firebase (Google Ireland Ltd.) su server nell'Unione Europea, trasmessi in modo cifrato e accessibili solo con il tuo account. Base giuridica: esecuzione del servizio che hai richiesto (art. 6, par. 1, lett. b del GDPR). Il backup resta finché non elimini il profilo: puoi farlo quando vuoi in Altro › Account e backup › Gestisci account › Elimina profilo, oppure dalla pagina tanettoapp.github.io/Tanetto/elimina-account.html. L'account e il backup vengono cancellati subito.","Acquisti: i pagamenti di Tanetto Plus e dei pacchetti di Tanì sono gestiti interamente da Google Play. Non riceviamo mai i dati della tua carta o del pagamento: Google comunica all'app solo quali acquisti sono attivi, per sbloccarli.","Statistiche anonime: per capire se l'app è utile contiamo, in forma aggregata, alcune azioni, per esempio quante volte l'app viene aperta o se viene usata nei giorni successivi. Usiamo GoatCounter, un servizio di statistiche che non usa cookie e non crea profili. Per inviare il conteggio il dispositivo si collega al servizio, che riceve tecnicamente l'indirizzo IP senza conservarlo in forma identificabile. Base giuridica: legittimo interesse a migliorare l'app (art. 6, par. 1, lett. f del GDPR).","Hosting: le pagine dell'app sono ospitate da un fornitore esterno, che può registrare l'indirizzo IP per motivi tecnici e di sicurezza secondo la propria informativa.","Cookie: Tanetto non usa cookie di profilazione né pubblicità. L'archiviazione locale serve solo a far funzionare l'app ed è strettamente necessaria.","Conservazione: i dati sul dispositivo restano finché non li cancelli. Puoi farlo in qualsiasi momento con «Ricomincia da capo» o cancellando i dati del browser. Le statistiche sono solo numeri aggregati.","I tuoi diritti: puoi chiedere informazioni, accesso, rettifica, cancellazione e limitazione, e opporti al trattamento, scrivendo al contatto qui sopra. Puoi anche presentare reclamo all'autorità di controllo: in Italia è il Garante per la protezione dei dati personali.","Età: Tanetto è pensato per persone dai 16 anni in su.","Modifiche: se questa informativa cambia, la versione aggiornata sarà sempre in questa pagina. Ultimo aggiornamento: 26/10/2026."],"terms":["Tanetto è offerto così com'è, senza garanzia di funzionamento continuo, e può cambiare nel tempo.","L'app aiuta a costruire piccole abitudini quotidiane con un compagno virtuale e non sostituisce consigli medici o psicologici.","Quello che scrivi resta tuo: sul tuo dispositivo e, se usi un account, nel tuo backup personale. Usa l'app con serenità, senza forzarti.","Funzioni a pagamento: Tanetto è gratuito. Tanetto Plus (abbonamento mensile o annuale) e i pacchetti di Tanì sono facoltativi e si acquistano tramite Google Play, che gestisce pagamento, rinnovi, disdette e rimborsi secondo le proprie condizioni. Gli abbonamenti si rinnovano da soli finché non li disdici in Google Play › Abbonamenti: la disdetta ferma il rinnovo successivo e Plus resta attivo fino alla fine del periodo già pagato. I Tanì sono una moneta virtuale da usare solo nell'app: non hanno valore in denaro e non si possono convertire in soldi.","Illustrazioni, testi, musiche e codice di Tanetto sono protetti dal diritto d'autore e non possono essere copiati o riutilizzati senza permesso.","Per qualsiasi domanda puoi scrivere al contatto indicato nell'informativa privacy."],"back":"Torna a Tanetto","del":"Elimina il tuo account Tanetto"},"de":{"lang":"Deutsch","locale":"de-DE","privB":"Datenschutzerklärung","termsB":"Nutzungsbedingungen","priv":["Verantwortlicher: das Projekt Tanetto, betrieben von einer Privatperson. Kontakt: tanettoapp@gmail.com.","Welche Daten: Tanetto funktioniert auch ohne Konto. Dann werden Begleiter, Ziele, Tagebuch, Garten und Fortschritt nur im Speicher dieses Geräts gesichert und an niemanden gesendet. Gedanken, die du bei „Loslassen“ schreibst, werden überhaupt nicht gespeichert.","Wenn du deinen Namen für die Begrüßung eingibst (freiwillig), wird er genauso gespeichert: auf deinem Gerät und, falls du ein Konto hast, in der Online-Sicherung.","Kopie der Daten: Wenn du auf „Kopie speichern“ tippst, erstellt Tanetto direkt auf deinem Gerät eine Datei mit deinem Fortschritt. Die Datei bleibt bei dir und wird an niemanden gesendet. Bei „Kopie wiederherstellen“ wird die Datei nur von deinem Gerät gelesen.","Freiwilliges Konto und Online-Backup: Wenn du ein Konto erstellst (mit Google oder mit E-Mail und Passwort), speichern wir deine E-Mail-Adresse und eine Kopie deines Fortschritts, nur damit du dich anmelden und ihn wiederherstellen kannst. Die Daten liegen bei Google Firebase (Google Ireland Ltd.) auf Servern in der Europäischen Union, werden verschlüsselt übertragen und sind nur mit deinem Konto zugänglich. Rechtsgrundlage: Erbringung des von dir gewünschten Dienstes (Art. 6 Abs. 1 lit. b DSGVO). Das Backup bleibt, bis du dein Profil löschst: jederzeit unter Mehr › Konto und Backup › Konto verwalten › Profil löschen oder auf der Seite tanettoapp.github.io/Tanetto/elimina-account.html. Konto und Backup werden sofort gelöscht.","Käufe: Die Zahlungen für Tanetto Plus und Tanì-Pakete wickelt vollständig Google Play ab. Wir erhalten nie deine Karten- oder Zahlungsdaten: Google teilt der App nur mit, welche Käufe aktiv sind, damit sie freigeschaltet werden.","Anonyme Statistik: Um zu verstehen, ob die App hilft, zählen wir zusammengefasst einige Aktionen, zum Beispiel wie oft die App geöffnet wird oder ob sie an den Folgetagen genutzt wird. Wir nutzen GoatCounter, einen Statistikdienst ohne Cookies und ohne Profile. Zum Senden der Zählung verbindet sich das Gerät mit dem Dienst, der dabei technisch die IP-Adresse erhält, sie aber nicht identifizierbar speichert. Rechtsgrundlage: berechtigtes Interesse an der Verbesserung der App (Art. 6 Abs. 1 lit. f DSGVO).","Hosting: Die Seiten der App werden von einem externen Anbieter bereitgestellt, der die IP-Adresse aus technischen und Sicherheitsgründen gemäß seiner eigenen Datenschutzerklärung protokollieren kann.","Cookies: Tanetto verwendet keine Tracking- oder Werbe-Cookies. Der lokale Speicher dient nur dem Funktionieren der App und ist unbedingt erforderlich.","Speicherdauer: Die Daten auf dem Gerät bleiben, bis du sie löschst. Das geht jederzeit mit „Von vorne beginnen“ oder durch Löschen der Browserdaten. Die Statistik besteht nur aus zusammengefassten Zahlen.","Deine Rechte: Du kannst Auskunft, Berichtigung, Löschung und Einschränkung verlangen und der Verarbeitung widersprechen, indem du an den Kontakt oben schreibst. Außerdem kannst du dich bei der zuständigen Datenschutzaufsichtsbehörde beschweren.","Alter: Tanetto ist für Menschen ab 16 Jahren gedacht.","Änderungen: Wenn sich diese Erklärung ändert, findest du die aktuelle Fassung immer hier. Letzte Aktualisierung: 26.10.2026."],"terms":["Tanetto wird so angeboten, wie es ist, ohne Garantie für einen ununterbrochenen Betrieb, und kann sich mit der Zeit ändern.","Die App hilft dabei, kleine tägliche Gewohnheiten mit einem virtuellen Begleiter aufzubauen, und ersetzt keine ärztliche oder psychologische Beratung.","Was du schreibst, gehört dir: auf deinem Gerät und, wenn du ein Konto nutzt, in deinem persönlichen Backup. Nutze die App entspannt und ohne Druck.","Kostenpflichtige Funktionen: Tanetto ist kostenlos. Tanetto Plus (Monats- oder Jahresabo) und Tanì-Pakete sind freiwillig und werden über Google Play gekauft; Google Play wickelt Zahlung, Verlängerungen, Kündigungen und Erstattungen nach den eigenen Bedingungen ab. Abos verlängern sich automatisch, bis du sie in Google Play › Abos kündigst: Die Kündigung stoppt die nächste Verlängerung, und Plus bleibt bis zum Ende des bereits bezahlten Zeitraums aktiv. Tanì sind eine virtuelle Währung nur für die App: Sie haben keinen Geldwert und können nicht in Geld umgetauscht werden.","Illustrationen, Texte, Musik und Code von Tanetto sind urheberrechtlich geschützt und dürfen ohne Erlaubnis nicht kopiert oder wiederverwendet werden.","Bei Fragen kannst du dich an den Kontakt in der Datenschutzerklärung wenden."],"back":"Zurück zu Tanetto","del":"Dein Tanetto-Konto löschen"},"es":{"lang":"Español","locale":"es-ES","privB":"Política de privacidad","termsB":"Condiciones de uso","priv":["Responsable del tratamiento: el proyecto Tanetto, gestionado por una persona física. Contacto: tanettoapp@gmail.com.","Qué datos: Tanetto también funciona sin cuenta. En ese caso, el compañero, los objetivos, el diario, el jardín y el progreso se guardan solo en la memoria de este dispositivo y no se envían a nadie. Los pensamientos escritos en «Soltar» no se guardan en absoluto.","Si escribes tu nombre para el saludo (es opcional), se guarda de la misma forma: en tu dispositivo y, si tienes una cuenta, en la copia de seguridad en línea.","Copia de los datos: si tocas «Guardar una copia», Tanetto crea un archivo con tu progreso directamente en tu dispositivo. El archivo es tuyo y no se envía a nadie. Con «Restaurar una copia», el archivo solo lo lee tu dispositivo.","Cuenta opcional y copia en línea: si decides crear una cuenta (con Google o con correo y contraseña), guardamos tu dirección de correo y una copia de tu progreso, solo para que puedas iniciar sesión y restaurarlo. Los datos los custodia Google Firebase (Google Ireland Ltd.) en servidores de la Unión Europea, se transmiten cifrados y solo se puede acceder a ellos con tu cuenta. Base jurídica: prestación del servicio que has pedido (art. 6.1.b del RGPD). La copia se conserva hasta que elimines tu perfil: puedes hacerlo cuando quieras en Más › Cuenta y copia de seguridad › Gestionar cuenta › Eliminar perfil, o en la página tanettoapp.github.io/Tanetto/elimina-account.html. La cuenta y la copia se borran al momento.","Compras: los pagos de Tanetto Plus y de los paquetes de Tanì los gestiona por completo Google Play. Nunca recibimos los datos de tu tarjeta ni del pago: Google solo indica a la app qué compras están activas para desbloquearlas.","Estadísticas anónimas: para saber si la app es útil contamos, de forma agregada, algunas acciones, por ejemplo cuántas veces se abre la app o si se usa en los días siguientes. Usamos GoatCounter, un servicio de estadísticas sin cookies que no crea perfiles. Para enviar el recuento, el dispositivo se conecta al servicio, que recibe técnicamente la dirección IP sin guardarla de forma identificable. Base jurídica: interés legítimo en mejorar la app (art. 6.1.f del RGPD).","Alojamiento: las páginas de la app están alojadas por un proveedor externo, que puede registrar la dirección IP por motivos técnicos y de seguridad según su propia política.","Cookies: Tanetto no usa cookies de seguimiento ni publicidad. El almacenamiento local solo sirve para que la app funcione y es estrictamente necesario.","Conservación: los datos del dispositivo se quedan hasta que los borres. Puedes hacerlo cuando quieras con «Empezar de nuevo» o borrando los datos del navegador. Las estadísticas son solo números agregados.","Tus derechos: puedes solicitar información, acceso, rectificación, supresión y limitación, y oponerte al tratamiento escribiendo al contacto indicado arriba. También puedes reclamar ante la autoridad de control: en España, la Agencia Española de Protección de Datos.","Edad: Tanetto está pensada para personas a partir de 16 años.","Cambios: si esta política cambia, la versión actualizada estará siempre en esta página. Última actualización: 26/10/2026."],"terms":["Tanetto se ofrece tal cual, sin garantía de funcionamiento ininterrumpido, y puede cambiar con el tiempo.","La app ayuda a crear pequeños hábitos diarios con un compañero virtual y no sustituye el consejo médico o psicológico.","Lo que escribes es tuyo: en tu dispositivo y, si usas una cuenta, en tu copia personal. Usa la app con calma, sin forzarte.","Funciones de pago: Tanetto es gratis. Tanetto Plus (suscripción mensual o anual) y los paquetes de Tanì son opcionales y se compran a través de Google Play, que gestiona el pago, las renovaciones, las cancelaciones y los reembolsos según sus propias condiciones. Las suscripciones se renuevan solas hasta que las canceles en Google Play › Suscripciones: la cancelación detiene la siguiente renovación y Plus sigue activo hasta el final del periodo ya pagado. Los Tanì son una moneda virtual para usar solo dentro de la app: no tienen valor económico y no se pueden cambiar por dinero.","Las ilustraciones, textos, música y código de Tanetto están protegidos por derechos de autor y no se pueden copiar ni reutilizar sin permiso.","Para cualquier duda puedes escribir al contacto indicado en la política de privacidad."],"back":"Volver a Tanetto","del":"Elimina tu cuenta de Tanetto"},"en":{"lang":"English","locale":"en-GB","privB":"Privacy policy","termsB":"Terms of use","priv":["Data controller: the Tanetto project, run by a private individual. Contact: tanettoapp@gmail.com.","What data: Tanetto also works without an account. In that case your companion, goals, journal, garden and progress are saved only in this device's memory and are not sent to anyone. Thoughts written in “Let it go” are not saved at all.","If you type your name for the greeting (it's optional), it's stored the same way: on your device and, if you have an account, in the online backup.","Copy of your data: if you tap “Save a copy”, Tanetto creates a file with your progress directly on your device. The file stays with you and is not sent to anyone. With “Restore a copy”, the file is read only by your device.","Optional account and online backup: if you choose to create an account (with Google or with email and password), we keep your email address and a copy of your progress, only to let you sign in and restore it. The data is held by Google Firebase (Google Ireland Ltd.) on servers in the European Union, sent encrypted and accessible only with your account. Legal basis: providing the service you asked for (Art. 6(1)(b) GDPR). The backup stays until you delete your profile: you can do so anytime in More › Account and backup › Manage account › Delete profile, or on the page tanettoapp.github.io/Tanetto/elimina-account.html. The account and the backup are deleted immediately.","Purchases: payments for Tanetto Plus and Tanì packs are handled entirely by Google Play. We never receive your card or payment details: Google only tells the app which purchases are active, so it can unlock them.","Anonymous statistics: to understand whether the app is useful, we count some actions in aggregate form, for example how often the app is opened or whether it's used on the following days. We use GoatCounter, a statistics service with no cookies and no profiles. To send the count, the device connects to the service, which technically receives the IP address without storing it in an identifiable way. Legal basis: legitimate interest in improving the app (Article 6(1)(f) GDPR / UK GDPR).","Hosting: the app's pages are hosted by an external provider, which may log the IP address for technical and security reasons under its own privacy policy.","Cookies: Tanetto uses no tracking or advertising cookies. Local storage is used only to make the app work and is strictly necessary.","Retention: data on the device stays until you delete it. You can do so at any time with “Start over” or by clearing your browser data. Statistics are only aggregate numbers.","Your rights: you can request information, access, correction, deletion and restriction, and object to processing, by writing to the contact above. You can also complain to your data protection authority (in the UK, the ICO).","Age: Tanetto is meant for people aged 16 and over.","Changes: if this policy changes, the updated version will always be on this page. Last updated: 26/10/2026."],"terms":["Tanetto is offered as it is, without a guarantee of uninterrupted operation, and may change over time.","The app helps you build small daily habits with a virtual companion and does not replace medical or psychological advice.","What you write is yours: on your device and, if you use an account, in your personal backup. Use the app calmly, without pushing yourself.","Paid features: Tanetto is free. Tanetto Plus (monthly or yearly subscription) and Tanì packs are optional and are bought through Google Play, which handles payment, renewals, cancellations and refunds under its own terms. Subscriptions renew automatically until you cancel them in Google Play › Subscriptions: cancelling stops the next renewal, and Plus stays active until the end of the period already paid. Tanì are a virtual currency for use only inside the app: they have no monetary value and cannot be exchanged for money.","Tanetto's illustrations, texts, music and code are protected by copyright and may not be copied or reused without permission.","For any question you can write to the contact listed in the privacy policy."],"back":"Back to Tanetto","del":"Delete your Tanetto account"},"fr":{"lang":"Français","locale":"fr-FR","privB":"Politique de confidentialité","termsB":"Conditions d'utilisation","priv":["Responsable du traitement : le projet Tanetto, géré par une personne physique. Contact : tanettoapp@gmail.com.","Quelles données : Tanetto fonctionne aussi sans compte. Dans ce cas, le compagnon, les objectifs, le journal, le jardin et les progrès sont enregistrés uniquement dans la mémoire de cet appareil et ne sont envoyés à personne. Les pensées écrites dans « Lâcher prise » ne sont pas enregistrées du tout.","Si tu écris ton prénom pour le message d'accueil (c'est facultatif), il est enregistré de la même façon : sur ton appareil et, si tu as un compte, dans la sauvegarde en ligne.","Copie des données : si tu touches « Enregistrer une copie », Tanetto crée un fichier avec ta progression directement sur ton appareil. Le fichier reste chez toi et n'est envoyé à personne. Avec « Restaurer une copie », le fichier est lu uniquement par ton appareil.","Compte facultatif et sauvegarde en ligne : si tu choisis de créer un compte (avec Google ou avec e-mail et mot de passe), nous conservons ton adresse e-mail et une copie de ta progression, uniquement pour te permettre de te connecter et de la restaurer. Les données sont hébergées par Google Firebase (Google Ireland Ltd.) sur des serveurs dans l'Union européenne, transmises de façon chiffrée et accessibles uniquement avec ton compte. Base légale : exécution du service que tu as demandé (art. 6, par. 1, point b du RGPD). La sauvegarde reste jusqu'à ce que tu supprimes ton profil : tu peux le faire à tout moment dans Plus › Compte et sauvegarde › Gérer le compte › Supprimer le profil, ou sur la page tanettoapp.github.io/Tanetto/elimina-account.html. Le compte et la sauvegarde sont supprimés immédiatement.","Achats : les paiements de Tanetto Plus et des packs de Tanì sont entièrement gérés par Google Play. Nous ne recevons jamais les données de ta carte ou de ton paiement : Google indique seulement à l'app quels achats sont actifs, pour les débloquer.","Statistiques anonymes : pour savoir si l'app est utile, nous comptons de façon agrégée certaines actions, par exemple combien de fois l'app est ouverte ou si elle est utilisée les jours suivants. Nous utilisons GoatCounter, un service de statistiques sans cookies et sans profilage. Pour envoyer le comptage, l'appareil se connecte au service, qui reçoit techniquement l'adresse IP sans la conserver de façon identifiable. Base légale : intérêt légitime à améliorer l'app (art. 6, par. 1, point f du RGPD).","Hébergement : les pages de l'app sont hébergées par un prestataire externe, qui peut enregistrer l'adresse IP pour des raisons techniques et de sécurité selon sa propre politique.","Cookies : Tanetto n'utilise ni cookies de suivi ni publicité. Le stockage local sert uniquement au fonctionnement de l'app et est strictement nécessaire.","Conservation : les données de l'appareil restent jusqu'à ce que tu les effaces. Tu peux le faire à tout moment avec « Tout recommencer » ou en effaçant les données du navigateur. Les statistiques ne sont que des chiffres agrégés.","Tes droits : tu peux demander l'information, l'accès, la rectification, l'effacement et la limitation, et t'opposer au traitement en écrivant au contact ci-dessus. Tu peux aussi déposer une plainte auprès de la CNIL.","Âge : Tanetto s'adresse aux personnes de 16 ans et plus.","Modifications : si cette politique change, la version à jour sera toujours sur cette page. Dernière mise à jour : 26/10/2026."],"terms":["Tanetto est proposé tel quel, sans garantie de fonctionnement ininterrompu, et peut évoluer avec le temps.","L'app aide à construire de petites habitudes quotidiennes avec un compagnon virtuel et ne remplace pas un avis médical ou psychologique.","Ce que tu écris t'appartient : sur ton appareil et, si tu utilises un compte, dans ta sauvegarde personnelle. Utilise l'app sereinement, sans te forcer.","Fonctions payantes : Tanetto est gratuit. Tanetto Plus (abonnement mensuel ou annuel) et les packs de Tanì sont facultatifs et s'achètent via Google Play, qui gère le paiement, les renouvellements, les résiliations et les remboursements selon ses propres conditions. Les abonnements se renouvellent automatiquement jusqu'à ce que tu les résilies dans Google Play › Abonnements : la résiliation arrête le renouvellement suivant et Plus reste actif jusqu'à la fin de la période déjà payée. Les Tanì sont une monnaie virtuelle à utiliser uniquement dans l'app : ils n'ont aucune valeur monétaire et ne peuvent pas être échangés contre de l'argent.","Les illustrations, textes, musiques et le code de Tanetto sont protégés par le droit d'auteur et ne peuvent pas être copiés ou réutilisés sans autorisation.","Pour toute question, tu peux écrire au contact indiqué dans la politique de confidentialité."],"back":"Retour à Tanetto","del":"Supprimer ton compte Tanetto"},"pt":{"lang":"Português (BR)","locale":"pt-BR","privB":"Política de privacidade","termsB":"Termos de uso","priv":["Controlador dos dados: o projeto Tanetto, mantido por uma pessoa física. Contato: tanettoapp@gmail.com.","Quais dados: o Tanetto também funciona sem conta. Nesse caso, o companheiro, as metas, o diário, o jardim e o progresso ficam salvos só na memória deste aparelho e não são enviados a ninguém. Os pensamentos escritos em “Deixe ir” não são salvos de jeito nenhum.","Se você escrever seu nome para a saudação (é opcional), ele fica salvo do mesmo jeito: no seu dispositivo e, se você tiver uma conta, no backup online.","Cópia dos dados: se você tocar em “Salvar uma cópia”, o Tanetto cria um arquivo com seu progresso diretamente no seu aparelho. O arquivo fica com você e não é enviado a ninguém. Com “Restaurar uma cópia”, o arquivo é lido apenas pelo seu aparelho.","Conta opcional e backup online: se você decidir criar uma conta (com o Google ou com e-mail e senha), guardamos seu endereço de e-mail e uma cópia do seu progresso, só para você entrar e restaurá-lo. Os dados ficam com o Google Firebase (Google Ireland Ltd.) em servidores na União Europeia, são transmitidos com criptografia e só podem ser acessados com a sua conta. Base legal: prestação do serviço que você pediu (art. 6.º, n.º 1, alínea b do RGPD). O backup fica guardado até você excluir seu perfil: dá para fazer isso quando quiser em Mais › Conta e backup › Gerenciar conta › Excluir perfil, ou na página tanettoapp.github.io/Tanetto/elimina-account.html. A conta e o backup são apagados na hora.","Compras: os pagamentos do Tanetto Plus e dos pacotes de Tanì são feitos inteiramente pelo Google Play. Nunca recebemos os dados do seu cartão ou do pagamento: o Google só informa ao app quais compras estão ativas, para liberá-las.","Estatísticas anônimas: para entender se o app é útil, contamos de forma agregada algumas ações, por exemplo quantas vezes o app é aberto ou se é usado nos dias seguintes. Usamos o GoatCounter, um serviço de estatísticas sem cookies e sem perfis. Para enviar a contagem, o aparelho se conecta ao serviço, que recebe tecnicamente o endereço IP sem guardá-lo de forma identificável. Base legal: legítimo interesse em melhorar o app (art. 7º, IX da LGPD e art. 6º, 1, f do GDPR europeu).","Hospedagem: as páginas do app são hospedadas por um fornecedor externo, que pode registrar o endereço IP por motivos técnicos e de segurança, conforme sua própria política.","Cookies: o Tanetto não usa cookies de rastreamento nem publicidade. O armazenamento local serve só para o app funcionar e é estritamente necessário.","Retenção: os dados no aparelho ficam até você apagá-los. Você pode fazer isso quando quiser com “Começar de novo” ou apagando os dados do navegador. As estatísticas são apenas números agregados.","Seus direitos: você pode pedir informações, acesso, correção, eliminação e limitação, e se opor ao tratamento, escrevendo para o contato acima. Também pode fazer uma reclamação à autoridade de proteção de dados: no Brasil, a ANPD.","Idade: o Tanetto é pensado para pessoas a partir de 16 anos.","Alterações: se esta política mudar, a versão atualizada estará sempre nesta página. Última atualização: 26/10/2026."],"terms":["O Tanetto é oferecido como está, sem garantia de funcionamento contínuo, e pode mudar com o tempo.","O app ajuda a criar pequenos hábitos diários com um companheiro virtual e não substitui orientação médica ou psicológica.","O que você escreve é seu: no seu aparelho e, se você usar uma conta, no seu backup pessoal. Use o app com tranquilidade, sem se cobrar.","Recursos pagos: o Tanetto é gratuito. O Tanetto Plus (assinatura mensal ou anual) e os pacotes de Tanì são opcionais e são comprados pelo Google Play, que cuida do pagamento, das renovações, dos cancelamentos e dos reembolsos conforme os próprios termos. As assinaturas renovam automaticamente até você cancelar em Google Play › Assinaturas: o cancelamento interrompe a próxima renovação e o Plus continua ativo até o fim do período já pago. Os Tanì são uma moeda virtual para usar só dentro do app: não têm valor em dinheiro e não podem ser trocados por dinheiro.","As ilustrações, textos, músicas e o código do Tanetto são protegidos por direitos autorais e não podem ser copiados ou reutilizados sem permissão.","Para qualquer dúvida, escreva para o contato indicado na política de privacidade."],"back":"Voltar ao Tanetto","del":"Excluir sua conta do Tanetto"},"ja":{"lang":"日本語","locale":"ja-JP","privB":"プライバシーポリシー","termsB":"利用規約","priv":["データ管理者：Tanetto プロジェクト（個人が運営）。連絡先：tanettoapp@gmail.com。","取り扱うデータ：Tanettoはアカウントなしでも使えます。その場合、パートナー、目標、日記、お庭、進み具合はこの端末の中だけに保存され、誰にも送信されません。「手放そう」に書いた思いは一切保存されません。","あいさつ用に名前を入力した場合（任意）、同じように保存されます。端末内と、アカウントがある場合はオンラインのバックアップです。","データのコピー：「コピーを保存」をタップすると、Tanettoは進み具合を含むファイルを端末上に直接作成します。ファイルはあなたの手元に残り、誰にも送信されません。「コピーを復元」では、ファイルはあなたの端末だけが読み込みます。","任意のアカウントとオンラインバックアップ：アカウントを作成した場合（Google、またはメールアドレスとパスワード）、ログインと復元のためだけに、メールアドレスと進み具合のコピーを保管します。データはGoogle Firebase（Google Ireland Ltd.）が欧州連合内のサーバーで管理し、暗号化して送信され、あなたのアカウントでのみアクセスできます。法的根拠：あなたが求めたサービスの提供（GDPR第6条1項b）。バックアップはプロフィールを削除するまで保管されます。削除はいつでも「その他 › アカウントとバックアップ › アカウントの管理 › プロフィールを削除」、またはページ tanettoapp.github.io/Tanetto/elimina-account.html からできます。アカウントとバックアップはすぐに削除されます。","購入：Tanetto PlusとTanìのパックの支払いは、すべてGoogle Playが処理します。カードや支払いの情報を私たちが受け取ることはありません。Googleがアプリに伝えるのは、ロックを解除するために、どの購入が有効かという情報だけです。","匿名の統計：アプリが役に立っているかを知るため、アプリが開かれた回数や翌日以降も使われているかなど、一部の操作を集計した形で数えています。Cookieもプロフィールも使わない統計サービスGoatCounterを利用しています。集計を送るために端末はこのサービスに接続し、サービスは技術的にIPアドレスを受け取りますが、個人を特定できる形では保存しません。法的根拠：アプリを改善するための正当な利益（GDPR/英国GDPR第6条1項（f））。","ホスティング：アプリのページは外部の事業者がホストしており、その事業者は自社のプライバシーポリシーに基づき、技術上・セキュリティ上の理由でIPアドレスを記録することがあります。","Cookie：Tanettoはトラッキング用や広告用のCookieを使いません。ローカルストレージはアプリを動かすためだけに使われ、厳密に必要なものです。","保存期間：端末上のデータは、あなたが削除するまで残ります。「最初からやり直す」やブラウザのデータ消去で、いつでも削除できます。統計は集計された数値のみです。","あなたの権利：上記の連絡先に連絡することで、情報の提供、アクセス、訂正、削除、利用の制限を求めたり、取り扱いに異議を申し立てたりできます。また、データ保護の監督機関（日本では個人情報保護委員会）に苦情を申し立てることもできます。","年齢：Tanettoは16歳以上の方を対象としています。","変更：このポリシーが変更された場合、最新版は常にこのページに掲載されます。最終更新日：2026/10/26。"],"terms":["Tanettoは現状のまま提供され、継続的な動作を保証するものではありません。内容は変わることがあります。","このアプリはバーチャルなパートナーといっしょに毎日の小さな習慣づくりを手伝うもので、医学的・心理的な助言の代わりにはなりません。","あなたが書いたものはあなたのものです。あなたの端末と、アカウントを使う場合はあなた専用のバックアップに保存されます。無理をせず、ゆったりとご利用ください。","有料機能：Tanettoは無料です。Tanetto Plus（月額または年額の定期購入）とTanìのパックは任意で、Google Playを通じて購入します。支払い、更新、解約、返金はGoogle Playの規約に従って処理されます。定期購入はGoogle Play › 定期購入で解約するまで自動で更新されます。解約すると次回の更新が止まり、Plusはすでに支払った期間の終わりまで有効です。Tanìはアプリ内だけで使える仮想通貨で、金銭的な価値はなく、お金に交換することはできません。","Tanettoのイラスト、文章、音楽、コードは著作権で保護されており、許可なく複製・再利用することはできません。","ご質問は、プライバシーポリシーに記載の連絡先までお寄せください。"],"back":"Tanettoに戻る","del":"Tanettoのアカウントを削除"},"ko":{"lang":"한국어","locale":"ko-KR","privB":"개인정보 처리방침","termsB":"이용 약관","priv":["개인정보 처리자: 개인이 운영하는 Tanetto 프로젝트. 연락처: tanettoapp@gmail.com.","수집하는 데이터: Tanetto는 계정 없이도 작동해요. 이 경우 친구, 목표, 일기, 정원, 진행 상황은 이 기기에만 저장되며 누구에게도 전송되지 않아요. ‘흘려보내기’에 적은 생각은 아예 저장되지 않아요.","인사에 쓸 이름을 입력하면(선택 사항) 같은 방식으로 저장돼요. 기기 안에, 그리고 계정이 있다면 온라인 백업에도 저장돼요.","데이터 사본: ‘사본 저장’을 탭하면 Tanetto가 진행 상황이 담긴 파일을 기기에 직접 만들어요. 파일은 사용자에게만 남고 누구에게도 전송되지 않아요. ‘사본 복원’을 하면 파일은 사용자의 기기에서만 읽혀요.","선택 사항인 계정과 온라인 백업: 계정을 만들면(Google 또는 이메일과 비밀번호) 로그인과 복원을 위해서만 이메일 주소와 진행 상황 사본을 보관해요. 데이터는 Google Firebase(Google Ireland Ltd.)가 유럽연합 내 서버에 보관하고, 암호화되어 전송되며, 사용자의 계정으로만 접근할 수 있어요. 법적 근거: 사용자가 요청한 서비스 제공(GDPR 제6조 1항 b). 백업은 프로필을 삭제할 때까지 보관돼요. 삭제는 언제든 더 보기 › 계정 및 백업 › 계정 관리 › 프로필 삭제, 또는 tanettoapp.github.io/Tanetto/elimina-account.html 페이지에서 할 수 있어요. 계정과 백업은 바로 삭제돼요.","구매: Tanetto Plus와 Tanì 패키지의 결제는 모두 Google Play가 처리해요. 카드나 결제 정보는 절대 받지 않아요. Google은 잠금 해제를 위해 어떤 구매가 활성 상태인지만 앱에 알려 줘요.","익명 통계: 앱이 유용한지 알기 위해 일부 동작의 횟수를 집계해요. 예를 들어 앱이 얼마나 자주 열리는지, 다음 날에도 사용되는지 등이에요. 쿠키와 프로필을 사용하지 않는 통계 서비스 GoatCounter를 이용해요. 집계를 보내기 위해 기기가 이 서비스에 연결되며, 서비스는 기술적으로 IP 주소를 받지만 식별 가능한 방식으로 저장하지 않아요. 법적 근거: 앱 개선에 대한 정당한 이익(GDPR / UK GDPR 제6조 제1항 (f)호).","호스팅: 앱 페이지는 외부 제공업체가 호스팅하며, 해당 업체는 자체 개인정보 처리방침에 따라 기술 및 보안상의 이유로 IP 주소를 기록할 수 있어요.","쿠키: Tanetto는 추적용 또는 광고용 쿠키를 사용하지 않아요. 로컬 스토리지는 앱 작동을 위해서만 쓰이며 반드시 필요한 것이에요.","보관 기간: 기기의 데이터는 사용자가 삭제할 때까지 남아 있어요. ‘처음부터 다시’를 누르거나 브라우저 데이터를 삭제해서 언제든 지울 수 있어요. 통계는 집계된 숫자일 뿐이에요.","사용자의 권리: 위 연락처로 문의해서 정보 제공, 열람, 정정, 삭제, 처리 제한을 요청하고 처리에 반대할 수 있어요. 또한 개인정보 보호 감독기관(영국의 경우 ICO)에 민원을 제기할 수 있어요.","나이: Tanetto는 만 16세 이상을 위한 앱이에요.","변경: 이 방침이 바뀌면 최신 버전은 항상 이 페이지에 있어요. 최종 업데이트: 2026. 10. 26.."],"terms":["Tanetto는 있는 그대로 제공되며, 중단 없는 작동을 보장하지 않고, 시간이 지나며 바뀔 수 있어요.","이 앱은 가상 친구와 함께 작은 생활 습관을 만들도록 돕는 앱이며, 의학적 또는 심리적 조언을 대신하지 않아요.","사용자가 쓴 내용은 사용자의 것이에요. 기기에, 그리고 계정을 쓰면 개인 백업에 저장돼요. 무리하지 말고 편안하게 사용하세요.","유료 기능: Tanetto는 무료예요. Tanetto Plus(월간 또는 연간 구독)와 Tanì 패키지는 선택 사항이며 Google Play를 통해 구매해요. 결제, 갱신, 해지, 환불은 Google Play가 자체 약관에 따라 처리해요. 구독은 Google Play › 구독에서 해지할 때까지 자동으로 갱신돼요. 해지하면 다음 갱신이 멈추고, Plus는 이미 결제한 기간이 끝날 때까지 유지돼요. Tanì는 앱 안에서만 쓰는 가상 화폐로, 금전적 가치가 없고 돈으로 바꿀 수 없어요.","Tanetto의 일러스트, 글, 음악, 코드는 저작권으로 보호되며 허가 없이 복제하거나 재사용할 수 없어요.","궁금한 점은 개인정보 처리방침에 적힌 연락처로 문의하세요."],"back":"Tanetto로 돌아가기","del":"Tanetto 계정 삭제"},"zh":{"lang":"简体中文","locale":"zh-CN","privB":"隐私政策","termsB":"使用条款","priv":["数据控制者：Tanetto 项目（由个人运营）。联系方式：tanettoapp@gmail.com。","收集哪些数据：Tanetto 不登录也能使用。这种情况下，你的小伙伴、目标、日记、花园和进度只保存在这台设备上，不会发送给任何人。在“放下吧”中写下的念头完全不会被保存。","如果你填写了用于问候的名字（可选），它也会以同样的方式保存：保存在你的设备上；如果你有账号，也会保存在在线备份中。","数据副本：如果你点“保存副本”，Tanetto 会直接在你的设备上生成一个包含你进度的文件。文件由你保管，不会发送给任何人。使用“恢复副本”时，文件只会由你的设备读取。","可选账号与网上备份：如果你选择创建账号（使用 Google 或邮箱和密码），我们会保存你的邮箱地址和一份进度副本，仅用于让你登录和恢复进度。数据由 Google Firebase（Google Ireland Ltd.）存放在欧盟境内的服务器上，以加密方式传输，只有用你的账号才能访问。法律依据：提供你所请求的服务（GDPR 第 6 条第 1 款 b 项）。备份会一直保留，直到你删除个人资料：你可以随时在“更多 › 账号与备份 › 管理账号 › 删除个人资料”中删除，或在页面 tanettoapp.github.io/Tanetto/elimina-account.html 上删除。账号和备份会立即删除。","购买：Tanetto Plus 和 Tanì 礼包的付款完全由 Google Play 处理。我们绝不会收到你的银行卡或付款信息：Google 只会告诉应用哪些购买有效，以便解锁。","匿名统计：为了了解应用是否有用，我们会以汇总形式统计部分操作，例如应用被打开的频率，或者之后几天是否还在使用。我们使用 GoatCounter，这是一项不使用 Cookie、不建立用户画像的统计服务。为了发送统计数据，设备会连接到该服务，该服务在技术上会接收到 IP 地址，但不会以可识别身份的方式存储。法律依据：改进应用的正当利益（GDPR / 英国 GDPR 第 6(1)(f) 条）。","托管：应用的页面由外部服务商托管，该服务商可能出于技术和安全原因，根据其自身的隐私政策记录 IP 地址。","Cookie：Tanetto 不使用任何追踪或广告类 Cookie。本地存储仅用于让应用正常运行，是严格必要的。","保存期限：设备上的数据会一直保留，直到你删除为止。你可以随时通过“重新开始”或清除浏览器数据来删除。统计数据只是汇总后的数字。","你的权利：你可以通过上述联系方式提出请求，要求获取信息、访问、更正、删除和限制处理你的数据，也可以反对数据处理。你还可以向你所在地的数据保护机构投诉（在英国为 ICO）。","年龄：Tanetto 适合 16 岁及以上的人使用。","变更：如果本政策有变更，更新后的版本将始终发布在本页面。最后更新：2026/10/26。"],"terms":["Tanetto 按现状提供，不保证不间断运行，并且可能随时间变化。","本应用借助一个虚拟小伙伴帮助你养成日常小习惯，不能代替医疗或心理方面的建议。","你写下的内容属于你：保存在你的设备上；如果你使用账号，也保存在你的个人备份中。请轻松地使用本应用，不要勉强自己。","付费功能：Tanetto 是免费的。Tanetto Plus（按月或按年订阅）和 Tanì 礼包是可选的，通过 Google Play 购买，付款、续订、取消和退款均由 Google Play 按其条款处理。订阅会自动续订，直到你在 Google Play › 订阅中取消：取消后将停止下一次续订，Plus 会保持有效直到已付费期间结束。Tanì 是只能在应用内使用的虚拟货币：没有货币价值，不能兑换成钱。","Tanetto 的插图、文字、音乐和代码受版权保护，未经许可不得复制或再次使用。","如有任何问题，可以通过隐私政策中列出的联系方式与我们联系。"],"back":"返回 Tanetto","del":"删除你的 Tanetto 账号"},"zht":{"lang":"繁體中文","locale":"zh-TW","privB":"隱私權政策","termsB":"使用條款","priv":["資料控管者：Tanetto 專案（由個人經營）。聯絡方式：tanettoapp@gmail.com。","收集哪些資料：Tanetto 不登入也能使用。這種情況下，你的小夥伴、目標、日記、花園和進度只會儲存在這台裝置上，不會傳送給任何人。在「放下吧」中寫下的念頭完全不會被儲存。","如果你填寫了用於問候的名字（可選），它也會以同樣的方式儲存：儲存在你的裝置上；如果你有帳號，也會儲存在線上備份中。","資料備份：如果你點「儲存備份」，Tanetto 會直接在你的裝置上建立一個包含你進度的檔案。這個檔案由你保管，不會傳送給任何人。使用「還原備份」時，檔案只會由你的裝置讀取。","選用帳號與網路備份：如果你選擇建立帳號（使用 Google 或電子郵件和密碼），我們會保存你的電子郵件地址和一份進度副本，僅用於讓你登入並還原進度。資料由 Google Firebase（Google Ireland Ltd.）存放在歐盟境內的伺服器上，以加密方式傳輸，只有用你的帳號才能存取。法律依據：提供你所要求的服務（GDPR 第 6 條第 1 項 b 款）。備份會一直保留，直到你刪除個人檔案：你隨時可以在「更多 › 帳號與備份 › 管理帳號 › 刪除個人檔案」刪除，或在頁面 tanettoapp.github.io/Tanetto/elimina-account.html 上刪除。帳號和備份會立即刪除。","購買：Tanetto Plus 和 Tanì 禮包的付款完全由 Google Play 處理。我們絕不會收到你的信用卡或付款資料：Google 只會告訴 App 哪些購買有效，以便解鎖。","匿名統計：為了了解這個 App 是否有用，我們會以彙總形式統計部分操作，例如 App 被開啟的頻率，或是否在之後幾天繼續使用。我們使用 GoatCounter，這是一個不使用 Cookie、不建立個人檔案的統計服務。為了傳送統計資料，裝置會連線到該服務，服務在技術上會接收到 IP 位址，但不會以可識別個人的方式儲存。法律依據：改善 App 的正當利益（GDPR / 英國 GDPR 第 6 條第 1 項第 f 款）。","主機代管：App 的網頁由外部服務商代管，該服務商可能基於技術和安全理由，依其自身的隱私權政策記錄 IP 位址。","Cookie：Tanetto 不使用任何追蹤或廣告 Cookie。本機儲存空間僅用於讓 App 正常運作，屬於絕對必要的用途。","保存期限：裝置上的資料會一直保留，直到你刪除為止。你隨時可以透過「重新開始」或清除瀏覽器資料來刪除。統計資料僅為彙總數字。","你的權利：你可以寫信至上述聯絡方式，要求取得資訊、查閱、更正、刪除及限制處理你的資料，並可反對資料處理。你也可以向資料保護主管機關提出申訴（在英國為 ICO）。","年齡：Tanetto 適用於 16 歲以上的使用者。","變更：如果本政策有所變更，更新後的版本將一律公布在此頁面。最後更新日期：2026/10/26。"],"terms":["Tanetto 依現狀提供，不保證不中斷運作，並可能隨時間改變。","這個 App 透過虛擬小夥伴幫助你養成每天的小習慣，不能取代醫療或心理專業建議。","你寫下的內容屬於你：保留在你的裝置上；如果你使用帳號，也會保留在你的個人備份中。請放輕鬆使用這個 App，不要勉強自己。","付費功能：Tanetto 是免費的。Tanetto Plus（月訂或年訂）和 Tanì 禮包為選用項目，透過 Google Play 購買，付款、續訂、取消和退款皆由 Google Play 依其條款處理。訂閱會自動續訂，直到你在 Google Play › 訂閱中取消：取消後會停止下一次續訂，Plus 會維持有效到已付費期間結束。Tanì 是只能在 App 內使用的虛擬貨幣：沒有金錢價值，也不能兌換成錢。","Tanetto 的插圖、文字、音樂和程式碼均受著作權保護，未經許可不得複製或重複使用。","如有任何問題，你可以寫信至隱私權政策中列出的聯絡方式。"],"back":"回到 Tanetto","del":"刪除你的 Tanetto 帳號"},"ru":{"lang":"Русский","locale":"ru-RU","privB":"Политика конфиденциальности","termsB":"Условия использования","priv":["Ответственный за обработку данных: проект Tanetto, который ведёт частное лицо. Контакт: tanettoapp@gmail.com.","Какие данные: Tanetto работает и без аккаунта. В этом случае питомец, цели, дневник, сад и прогресс сохраняются только в памяти этого устройства и никому не передаются. Мысли, записанные в «Отпусти», не сохраняются вообще.","Если ты укажешь имя для приветствия (это необязательно), оно хранится так же: на твоём устройстве и, если у тебя есть аккаунт, в онлайн-копии.","Копия данных: если нажать «Сохранить копию», Tanetto создаёт файл с твоим прогрессом прямо на твоём устройстве. Файл остаётся у тебя и никому не отправляется. При использовании «Восстановить копию» файл читается только твоим устройством.","Необязательный аккаунт и онлайн-копия: если ты решишь создать аккаунт (через Google или с e-mail и паролем), мы храним твой адрес e-mail и копию твоего прогресса — только чтобы ты мог войти и восстановить его. Данные хранит Google Firebase (Google Ireland Ltd.) на серверах в Европейском союзе, они передаются в зашифрованном виде и доступны только через твой аккаунт. Правовое основание: оказание услуги, которую ты запросил (ст. 6(1)(b) GDPR). Копия хранится, пока ты не удалишь профиль: это можно сделать в любой момент в «Ещё» › «Аккаунт и резервная копия» › «Управление аккаунтом» › «Удалить профиль» или на странице tanettoapp.github.io/Tanetto/elimina-account.html. Аккаунт и копия удаляются сразу.","Покупки: оплату Tanetto Plus и наборов Tanì полностью обрабатывает Google Play. Мы никогда не получаем данные твоей карты или платежа: Google сообщает приложению только о том, какие покупки активны, чтобы их разблокировать.","Анонимная статистика: чтобы понять, полезно ли приложение, мы подсчитываем некоторые действия в обобщённом виде, например как часто открывается приложение или используется ли оно в последующие дни. Мы используем GoatCounter — сервис статистики без cookie и без профилей. Чтобы передать подсчёт, устройство подключается к сервису, который технически получает IP-адрес, но не хранит его в виде, позволяющем установить личность. Правовое основание: законный интерес в улучшении приложения (статья 6(1)(f) GDPR / UK GDPR).","Хостинг: страницы приложения размещены у внешнего провайдера, который может записывать IP-адрес в технических целях и в целях безопасности в соответствии со своей политикой конфиденциальности.","Cookie: Tanetto не использует cookie для отслеживания или рекламы. Локальное хранилище используется только для работы приложения и является строго необходимым.","Срок хранения: данные на устройстве хранятся, пока ты их не удалишь. Это можно сделать в любой момент через «Начать заново» или очистив данные браузера. Статистика — это только обобщённые числа.","Твои права: ты можешь запросить информацию, доступ, исправление, удаление и ограничение обработки, а также возразить против обработки, написав по указанному выше контакту. Также можно подать жалобу в свой надзорный орган по защите данных (в Великобритании — ICO).","Возраст: Tanetto предназначено для людей от 16 лет.","Изменения: если эта политика изменится, актуальная версия всегда будет на этой странице. Последнее обновление: 26.10.2026."],"terms":["Tanetto предоставляется как есть, без гарантии бесперебойной работы, и может меняться со временем.","Приложение помогает формировать маленькие ежедневные привычки вместе с виртуальным питомцем и не заменяет медицинскую или психологическую консультацию.","Всё, что ты пишешь, принадлежит тебе: на твоём устройстве и, если ты пользуешься аккаунтом, в твоей личной копии. Пользуйся приложением спокойно, не перегружая себя.","Платные функции: Tanetto бесплатно. Tanetto Plus (подписка на месяц или год) и наборы Tanì необязательны и покупаются через Google Play, который обрабатывает оплату, продления, отмены и возвраты по своим условиям. Подписка продлевается автоматически, пока ты не отменишь её в Google Play › Подписки: отмена останавливает следующее продление, а Plus остаётся активным до конца уже оплаченного периода. Tanì — виртуальная валюта только для приложения: она не имеет денежной ценности и не обменивается на деньги.","Иллюстрации, тексты, музыка и код Tanetto защищены авторским правом и не могут копироваться или использоваться повторно без разрешения.","По любым вопросам можно написать по контакту, указанному в политике конфиденциальности."],"back":"Вернуться в Tanetto","del":"Удаление аккаунта Tanetto"},"pl":{"lang":"Polski","locale":"pl-PL","privB":"Polityka prywatności","termsB":"Warunki korzystania","priv":["Administrator danych: projekt Tanetto prowadzony przez osobę prywatną. Kontakt: tanettoapp@gmail.com.","Jakie dane: Tanetto działa także bez konta. Wtedy twój towarzysz, cele, dziennik, ogród i postępy są zapisywane wyłącznie w pamięci tego urządzenia i nie są nikomu przesyłane. Myśli zapisane w „Puść to” nie są w ogóle zachowywane.","Jeśli wpiszesz swoje imię do powitania (to dobrowolne), jest ono zapisywane tak samo: na twoim urządzeniu i, jeśli masz konto, w kopii zapasowej online.","Kopia danych: jeśli dotkniesz „Zapisz kopię”, Tanetto utworzy plik z twoimi postępami bezpośrednio na twoim urządzeniu. Plik zostaje u ciebie i nie jest nikomu przesyłany. Przy „Przywróć kopię” plik jest odczytywany wyłącznie przez twoje urządzenie.","Konto opcjonalne i kopia online: jeśli zdecydujesz się założyć konto (przez Google albo e-mail i hasło), przechowujemy twój adres e-mail i kopię twoich postępów wyłącznie po to, abyś mógł się zalogować i je przywrócić. Dane przechowuje Google Firebase (Google Ireland Ltd.) na serwerach w Unii Europejskiej; są przesyłane w formie zaszyfrowanej i dostępne tylko z twojego konta. Podstawa prawna: świadczenie usługi, o którą prosisz (art. 6 ust. 1 lit. b RODO). Kopia jest przechowywana do momentu usunięcia profilu: możesz to zrobić w każdej chwili w Więcej › Konto i kopia zapasowa › Zarządzaj kontem › Usuń profil albo na stronie tanettoapp.github.io/Tanetto/elimina-account.html. Konto i kopia są usuwane od razu.","Zakupy: płatności za Tanetto Plus i pakiety Tanì obsługuje w całości Google Play. Nigdy nie otrzymujemy danych twojej karty ani płatności: Google przekazuje aplikacji tylko informację, które zakupy są aktywne, aby je odblokować.","Anonimowe statystyki: aby sprawdzić, czy aplikacja jest przydatna, liczymy niektóre działania w formie zbiorczej, na przykład jak często aplikacja jest otwierana lub czy jest używana w kolejnych dniach. Korzystamy z GoatCounter, usługi statystycznej bez plików cookie i bez profili. Aby przesłać licznik, urządzenie łączy się z usługą, która technicznie otrzymuje adres IP, ale nie przechowuje go w sposób umożliwiający identyfikację. Podstawa prawna: prawnie uzasadniony interes polegający na ulepszaniu aplikacji (art. 6 ust. 1 lit. f RODO).","Hosting: strony aplikacji są hostowane przez zewnętrznego dostawcę, który może rejestrować adres IP ze względów technicznych i bezpieczeństwa, zgodnie z własną polityką prywatności.","Pliki cookie: Tanetto nie używa śledzących ani reklamowych plików cookie. Pamięć lokalna służy wyłącznie do działania aplikacji i jest ściśle niezbędna.","Przechowywanie: dane na urządzeniu pozostają tam, dopóki ich nie usuniesz. Możesz to zrobić w każdej chwili przez „Zacznij od nowa” lub czyszcząc dane przeglądarki. Statystyki to wyłącznie liczby zbiorcze.","Twoje prawa: możesz żądać informacji, dostępu do danych, ich sprostowania, usunięcia i ograniczenia przetwarzania, a także wnieść sprzeciw wobec przetwarzania, pisząc na powyższy adres kontaktowy. Możesz też złożyć skargę do organu ochrony danych (w Polsce: Prezes Urzędu Ochrony Danych Osobowych).","Wiek: Tanetto jest przeznaczone dla osób, które ukończyły 16 lat.","Zmiany: jeśli ta polityka się zmieni, aktualna wersja zawsze będzie dostępna na tej stronie. Ostatnia aktualizacja: 26.10.2026."],"terms":["Tanetto jest udostępniane w obecnej postaci, bez gwarancji nieprzerwanego działania, i może się z czasem zmieniać.","Aplikacja pomaga budować małe codzienne nawyki z wirtualnym towarzyszem i nie zastępuje porady lekarskiej ani psychologicznej.","To, co piszesz, należy do ciebie: na twoim urządzeniu, a jeśli używasz konta, także w twojej osobistej kopii. Korzystaj z aplikacji spokojnie, bez zmuszania się.","Funkcje płatne: Tanetto jest darmowe. Tanetto Plus (subskrypcja miesięczna lub roczna) i pakiety Tanì są opcjonalne i kupuje się je przez Google Play, który obsługuje płatności, odnowienia, anulowania i zwroty zgodnie z własnymi warunkami. Subskrypcje odnawiają się automatycznie, dopóki nie anulujesz ich w Google Play › Subskrypcje: anulowanie zatrzymuje kolejne odnowienie, a Plus działa do końca opłaconego okresu. Tanì to wirtualna waluta do używania tylko w aplikacji: nie ma wartości pieniężnej i nie można jej wymienić na pieniądze.","Ilustracje, teksty, muzyka i kod Tanetto są chronione prawem autorskim i nie mogą być kopiowane ani ponownie wykorzystywane bez zgody.","W razie pytań możesz napisać na adres kontaktowy podany w polityce prywatności."],"back":"Wróć do Tanetto","del":"Usuń swoje konto Tanetto"},"nl":{"lang":"Nederlands","locale":"nl-NL","privB":"Privacybeleid","termsB":"Gebruiksvoorwaarden","priv":["Verwerkingsverantwoordelijke: het project Tanetto, beheerd door een privépersoon. Contact: tanettoapp@gmail.com.","Welke gegevens: Tanetto werkt ook zonder account. In dat geval worden je maatje, doelen, dagboek, tuin en voortgang alleen in het geheugen van dit apparaat opgeslagen en naar niemand verstuurd. Gedachten die je schrijft bij “Laat het los” worden helemaal niet opgeslagen.","Als je je naam invult voor de begroeting (dat is vrijwillig), wordt die op dezelfde manier bewaard: op je apparaat en, als je een account hebt, in de online back-up.","Kopie van je gegevens: als je op “Kopie opslaan” tikt, maakt Tanetto direct op je apparaat een bestand met je voortgang. Het bestand blijft bij jou en wordt naar niemand verstuurd. Met “Kopie terugzetten” wordt het bestand alleen door je apparaat gelezen.","Optioneel account en online back-up: als je ervoor kiest een account te maken (met Google of met e-mail en wachtwoord), bewaren we je e-mailadres en een kopie van je voortgang, alleen zodat je kunt inloggen en hem kunt terugzetten. De gegevens worden bewaard door Google Firebase (Google Ireland Ltd.) op servers in de Europese Unie, versleuteld verstuurd en zijn alleen met jouw account toegankelijk. Rechtsgrond: uitvoering van de dienst waar je om vraagt (art. 6 lid 1 sub b AVG). De back-up blijft bewaard tot je je profiel verwijdert: dat kan altijd via Meer › Account en back-up › Account beheren › Profiel verwijderen, of op de pagina tanettoapp.github.io/Tanetto/elimina-account.html. Account en back-up worden meteen verwijderd.","Aankopen: betalingen voor Tanetto Plus en Tanì-pakketten worden volledig door Google Play afgehandeld. We ontvangen nooit je kaart- of betaalgegevens: Google laat de app alleen weten welke aankopen actief zijn, zodat ze worden ontgrendeld.","Anonieme statistieken: om te begrijpen of de app nuttig is, tellen we sommige acties in geaggregeerde vorm, bijvoorbeeld hoe vaak de app wordt geopend of of hij de dagen erna wordt gebruikt. We gebruiken GoatCounter, een statistiekdienst zonder cookies en zonder profielen. Om de telling te versturen maakt het apparaat verbinding met de dienst, die technisch gezien het IP-adres ontvangt zonder het op een herleidbare manier op te slaan. Rechtsgrond: gerechtvaardigd belang bij het verbeteren van de app (artikel 6, lid 1, onder f AVG).","Hosting: de pagina's van de app worden gehost door een externe aanbieder, die het IP-adres om technische en beveiligingsredenen kan vastleggen volgens zijn eigen privacybeleid.","Cookies: Tanetto gebruikt geen tracking- of advertentiecookies. Lokale opslag wordt alleen gebruikt om de app te laten werken en is strikt noodzakelijk.","Bewaartermijn: gegevens op het apparaat blijven bewaard tot je ze verwijdert. Dat kan op elk moment met “Opnieuw beginnen” of door je browsergegevens te wissen. Statistieken zijn alleen geaggregeerde getallen.","Je rechten: je kunt om informatie, inzage, rectificatie, verwijdering en beperking vragen en bezwaar maken tegen de verwerking, door te schrijven naar het contactadres hierboven. Je kunt ook een klacht indienen bij je toezichthouder voor gegevensbescherming (in Nederland de Autoriteit Persoonsgegevens).","Leeftijd: Tanetto is bedoeld voor mensen van 16 jaar en ouder.","Wijzigingen: als dit beleid verandert, staat de bijgewerkte versie altijd op deze pagina. Laatst bijgewerkt: 26-10-2026."],"terms":["Tanetto wordt aangeboden zoals het is, zonder garantie op ononderbroken werking, en kan in de loop van de tijd veranderen.","De app helpt je kleine dagelijkse gewoontes op te bouwen met een virtueel maatje en vervangt geen medisch of psychologisch advies.","Wat je schrijft is van jou: op je apparaat en, als je een account gebruikt, in je persoonlijke back-up. Gebruik de app rustig, zonder jezelf onder druk te zetten.","Betaalde functies: Tanetto is gratis. Tanetto Plus (maand- of jaarabonnement) en Tanì-pakketten zijn optioneel en koop je via Google Play, dat betaling, verlengingen, opzeggingen en terugbetalingen regelt volgens de eigen voorwaarden. Abonnementen worden automatisch verlengd tot je ze opzegt via Google Play › Abonnementen: opzeggen stopt de volgende verlenging en Plus blijft actief tot het einde van de al betaalde periode. Tanì zijn een virtuele munt die je alleen in de app gebruikt: ze hebben geen geldwaarde en kunnen niet worden ingewisseld voor geld.","De illustraties, teksten, muziek en code van Tanetto zijn auteursrechtelijk beschermd en mogen niet zonder toestemming worden gekopieerd of hergebruikt.","Voor vragen kun je schrijven naar het contactadres in het privacybeleid."],"back":"Terug naar Tanetto","del":"Je Tanetto-account verwijderen"},"tr":{"lang":"Türkçe","locale":"tr-TR","privB":"Gizlilik politikası","termsB":"Kullanım koşulları","priv":["Veri sorumlusu: bir birey tarafından yürütülen Tanetto projesi. İletişim: tanettoapp@gmail.com.","Hangi veriler: Tanetto hesap olmadan da çalışır. Bu durumda arkadaşın, hedeflerin, günlüğün, bahçen ve ilerlemen yalnızca bu cihazın belleğine kaydedilir ve kimseye gönderilmez. “Bırak gitsin” bölümüne yazılan düşünceler hiç kaydedilmez.","Selamlama için adını yazarsan (isteğe bağlıdır), aynı şekilde saklanır: cihazında ve hesabın varsa çevrimiçi yedekte.","Verilerinin kopyası: “Kopya kaydet”e dokunursan Tanetto ilerlemeni içeren bir dosyayı doğrudan cihazında oluşturur. Dosya sende kalır ve kimseye gönderilmez. “Kopyayı geri yükle” ile dosya yalnızca cihazın tarafından okunur.","İsteğe bağlı hesap ve çevrim içi yedek: Hesap oluşturmayı seçersen (Google ile ya da e-posta ve şifreyle), yalnızca giriş yapabilmen ve ilerlemeni geri yükleyebilmen için e-posta adresini ve ilerlemenin bir kopyasını saklarız. Veriler Google Firebase (Google Ireland Ltd.) tarafından Avrupa Birliği'ndeki sunucularda tutulur, şifreli olarak iletilir ve yalnızca senin hesabınla erişilebilir. Hukuki dayanak: talep ettiğin hizmetin sunulması (GDPR md. 6/1-b). Yedek, profilini silene kadar saklanır: bunu istediğin zaman Diğer › Hesap ve yedek › Hesabı yönet › Profili sil yoluyla ya da tanettoapp.github.io/Tanetto/elimina-account.html sayfasından yapabilirsin. Hesap ve yedek hemen silinir.","Satın alımlar: Tanetto Plus ve Tanì paketlerinin ödemeleri tamamen Google Play tarafından yapılır. Kart veya ödeme bilgilerini asla almayız: Google uygulamaya yalnızca hangi satın alımların etkin olduğunu, kilitleri açmak için bildirir.","Anonim istatistikler: uygulamanın işe yarayıp yaramadığını anlamak için bazı işlemleri toplu olarak sayarız; örneğin uygulamanın ne sıklıkla açıldığını ya da sonraki günlerde kullanılıp kullanılmadığını. Çerez ve profil kullanmayan bir istatistik hizmeti olan GoatCounter'ı kullanırız. Sayımı göndermek için cihaz bu hizmete bağlanır; hizmet teknik olarak IP adresini alır ancak onu kimliği belirlenebilir şekilde saklamaz. Hukuki dayanak: uygulamayı geliştirmeye yönelik meşru menfaat (GDPR / UK GDPR madde 6(1)(f)).","Barındırma: uygulamanın sayfaları harici bir sağlayıcı tarafından barındırılır; bu sağlayıcı teknik ve güvenlik nedenleriyle, kendi gizlilik politikası çerçevesinde IP adresini kaydedebilir.","Çerezler: Tanetto takip ya da reklam çerezi kullanmaz. Yerel depolama yalnızca uygulamanın çalışması için kullanılır ve kesinlikle gereklidir.","Saklama süresi: cihazdaki veriler sen silene kadar kalır. Bunu istediğin zaman “Baştan başla” ile ya da tarayıcı verilerini silerek yapabilirsin. İstatistikler yalnızca toplu sayılardan oluşur.","Hakların: yukarıdaki iletişim adresine yazarak bilgi, erişim, düzeltme, silme ve kısıtlama talep edebilir, işlemeye itiraz edebilirsin. Ayrıca veri koruma otoritesine şikâyette bulunabilirsin: Türkiye'de bu, Kişisel Verileri Koruma Kurumu'dur (KVKK).","Yaş: Tanetto 16 yaş ve üzeri kişiler içindir.","Değişiklikler: bu politika değişirse güncel sürüm her zaman bu sayfada olacaktır. Son güncelleme: 26.10.2026."],"terms":["Tanetto olduğu gibi sunulur, kesintisiz çalışma garantisi yoktur ve zamanla değişebilir.","Uygulama, sanal bir arkadaşla küçük günlük alışkanlıklar edinmene yardımcı olur ve tıbbi ya da psikolojik danışmanlığın yerini tutmaz.","Yazdıkların sana aittir: cihazında ve hesap kullanıyorsan kişisel yedeğinde. Uygulamayı kendini zorlamadan, gönül rahatlığıyla kullan.","Ücretli özellikler: Tanetto ücretsizdir. Tanetto Plus (aylık veya yıllık abonelik) ve Tanì paketleri isteğe bağlıdır ve Google Play üzerinden satın alınır; ödeme, yenileme, iptal ve iadeleri Google Play kendi koşullarına göre yönetir. Abonelikler, Google Play › Abonelikler'den iptal edene kadar otomatik yenilenir: iptal bir sonraki yenilemeyi durdurur ve Plus, ödenmiş dönemin sonuna kadar etkin kalır. Tanì yalnızca uygulama içinde kullanılan sanal bir paradır: parasal değeri yoktur ve paraya çevrilemez.","Tanetto'nun çizimleri, metinleri, müzikleri ve kodu telif hakkıyla korunur; izin alınmadan kopyalanamaz ya da yeniden kullanılamaz.","Her türlü sorun için gizlilik politikasında belirtilen iletişim adresine yazabilirsin."],"back":"Tanetto'ya dön","del":"Tanetto hesabını sil"}};
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const link = (s) => esc(s).replace(/tanettoapp\.github\.io\/Tanetto\/elimina-account\.html/g, '<a href="elimina-account.html">tanettoapp.github.io/Tanetto/elimina-account.html</a>').replace(/([\w.+-]+@[\w-]+\.[\w.]+)/g, '<a href="mailto:$1">$1</a>');
const pick = () => { const q = (/[?&]lang=([a-z]+)/.exec(location.search) || [])[1]; if (S[q]) return q; const n = (navigator.language || "en").toLowerCase(); if (/^zh-(tw|hk|mo)|hant/.test(n)) return "zht"; const l = n.slice(0, 2); return S[l] ? l : "en"; };
let lang = pick();
$("lang").innerHTML = Object.keys(S).map((k) => '<option value="' + k + '">' + S[k].lang + "</option>").join(""); $("lang").value = lang;
function paint() {
  const s = S[lang]; document.documentElement.lang = s.locale; document.title = "Tanetto — " + s.privB + " · " + s.termsB;
  $("pT").textContent = s.privB; $("tT").textContent = s.termsB; $("back").textContent = s.back; $("del").textContent = s.del;
  $("pB").innerHTML = s.priv.map((x) => "<p>" + link(x) + "</p>").join(""); $("tB").innerHTML = s.terms.map((x) => "<p>" + link(x) + "</p>").join("");
}
$("lang").addEventListener("change", () => { lang = $("lang").value; paint(); });
paint();
})();

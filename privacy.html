"use strict";
const S = {"it":{"lang":"Italiano","locale":"it-IT","privB":"Informativa privacy","termsB":"Condizioni d'uso","priv":["In breve: compagno, obiettivi e diario restano su questo telefono. Scrivere il tuo nome è facoltativo, la chat non invia nulla a nessuno e le uniche pubblicità sono brevi video che scegli tu di guardare. Se qualcosa non è chiaro, chiedi a un adulto di cui ti fidi.","Titolare del trattamento: Snugbloom Studio, Italia. Contatto: tanettoapp@gmail.com.","Quali dati: Tanetto funziona anche senza account. In quel caso compagno, obiettivi, diario, giardino e progressi vengono salvati solo nella memoria di questo dispositivo e non vengono inviati a nessuno. I pensieri scritti in «Lascia andare» non vengono salvati affatto.","Se scrivi il tuo nome per il saluto (è facoltativo), resta salvato allo stesso modo: sul dispositivo e, se hai un account, nel backup online.","Copia dei dati: se tocchi «Salva una copia», Tanetto crea un file con i tuoi progressi direttamente sul tuo dispositivo. Il file resta a te e non viene inviato a nessuno. Con «Ripristina una copia» il file viene letto solo dal tuo dispositivo.","Account facoltativo e backup online: se scegli di creare un account (con Google o con e-mail e password), conserviamo il tuo indirizzo e-mail e una copia dei tuoi progressi, solo per farti accedere e per permetterti di ripristinarli. I dati sono custoditi da Google Firebase (Google Ireland Ltd.) su server nell'Unione Europea, trasmessi in modo cifrato e accessibili solo con il tuo account. L'accesso (Firebase Authentication) è invece gestito da Google negli Stati Uniti, nell'ambito dell'EU-US Data Privacy Framework. Base giuridica: esecuzione del servizio che hai richiesto (art. 6, par. 1, lett. b del GDPR). Il backup resta finché non elimini il profilo: puoi farlo quando vuoi in Profilo › Account e dati › Gestisci account › Elimina profilo, oppure dalla pagina tanettoapp.github.io/Tanetto/elimina-account.html. L'account e il backup vengono cancellati subito.","Acquisti: i pagamenti di Tanetto Plus e dei pacchetti di Tanì sono gestiti interamente da Google Play. Non riceviamo mai i dati della tua carta o del pagamento: Google comunica all'app solo quali acquisti sono attivi, per sbloccarli.","Statistiche anonime: per capire se l'app è utile contiamo, in forma aggregata, alcune azioni, per esempio quante volte l'app viene aperta, se viene usata nei giorni successivi o quali parti vengono usate (come il negozio o i giochi), e riceviamo segnalazioni anonime degli errori (solo il tipo di errore, mai quello che scrivi). Usiamo GoatCounter, un servizio di statistiche che non usa cookie e non crea profili, gestito dall'Irlanda con i dati su server nell'Unione Europea (Finlandia e Germania). Per inviare il conteggio il dispositivo si collega al servizio, che riceve tecnicamente l'indirizzo IP senza conservarlo in forma identificabile. Base giuridica: legittimo interesse a migliorare l'app (art. 6, par. 1, lett. f del GDPR). Puoi spegnere le statistiche quando vuoi in Profilo › Privacy ed età. Sono sempre spente per chi non ha ancora l'età del consenso digitale o non ha detto l'età, e prima della domanda sull'età non si conta niente.","Hosting: le pagine dell'app sono ospitate da un fornitore esterno, che può registrare l'indirizzo IP per motivi tecnici e di sicurezza secondo la propria informativa.","Cookie: Tanetto non usa cookie di profilazione propri. L'archiviazione locale serve solo a far funzionare l'app (e a non contare due volte le statistiche) ed è strettamente necessaria. Nell'app Android puoi scegliere di guardare brevi pubblicità per ricevere un piccolo premio: non compaiono mai da sole, solo quando scegli tu di guardarne una.","Video con premio (solo app Android): le pubblicità sono fornite da Google AdMob (Google Ireland Ltd. e Google LLC; i dati possono essere trattati anche negli Stati Uniti). Google tratta questi dati come titolare autonomo secondo la propria informativa (https://policies.google.com/privacy); i trasferimenti verso gli Stati Uniti si basano sull'EU-US Data Privacy Framework. Tanetto non riceve mai il tuo ID pubblicità. Dove la legge lo richiede (Spazio economico europeo, Regno Unito e Svizzera), prima che venga mostrata qualsiasi pubblicità ti chiediamo il consenso con lo strumento di Google per la gestione del consenso (UMP); puoi cambiarlo quando vuoi in Profilo › Privacy ed età › Scelte sulla pubblicità. Per preparare e riprodurre i video, Google può raccogliere l'ID pubblicità del dispositivo, l'indirizzo IP e informazioni sulla tua interazione con gli annunci, per mostrarli, misurarli e prevenire le frodi e, solo con il tuo consenso, per personalizzarli. Base giuridica: il tuo consenso, dove richiesto (art. 6, par. 1, lett. a del GDPR), e il legittimo interesse a offrire premi facoltativi e a prevenire le frodi (art. 6, par. 1, lett. f del GDPR). Puoi reimpostare o eliminare l'ID pubblicità nelle impostazioni di Android. Come Google usa questi dati: https://policies.google.com/technologies/partner-sites. Puoi guardare al massimo 5 video al giorno e con Tanetto Plus non vedi nessuna pubblicità. Google può anche raccogliere dati diagnostici sul servizio pubblicitario (per esempio arresti anomali e prestazioni) e ricavare una posizione approssimativa dal tuo indirizzo IP, per gli stessi scopi.","Conservazione: i dati sul dispositivo restano finché non li cancelli. Puoi farlo in qualsiasi momento con «Ricomincia da capo» o cancellando i dati del browser. Le statistiche sono solo numeri aggregati.","I tuoi diritti: puoi chiedere informazioni, accesso, rettifica, cancellazione e limitazione, e opporti al trattamento, scrivendo al contatto qui sopra. Puoi anche presentare reclamo all'autorità di controllo: in Italia è il Garante per la protezione dei dati personali. Puoi anche chiedere una copia dei tuoi dati in un formato portabile e ritirare il consenso in qualsiasi momento, senza effetti su quanto fatto prima.","Diritti privacy negli stati USA: se vivi in uno stato degli USA con una legge sulla privacy dei consumatori, come la California, ti informiamo che non vendiamo i tuoi dati personali in cambio di denaro. Mostrare video con premio tramite Google AdMob può valere come «condivisione» per la pubblicità mirata secondo quelle leggi. Puoi opporti eliminando o reimpostando l'ID pubblicità nelle impostazioni di Android, oppure in Profilo › Privacy ed età › Scelte sulla pubblicità quando l'app la mostra, e puoi esercitare i diritti descritti sopra scrivendoci. Esercitare questi diritti non cambierà mai il modo in cui ti trattiamo.","Bambini e ragazzi: Tanetto è per tutte le età. La prima volta chiediamo mese e anno di nascita, che restano solo sul tuo dispositivo. Sotto i 13 anni, o se preferisci non dirlo, i video con premio sono solo quelli adatti ai bambini, mai personalizzati, e l'ID pubblicità non viene inviato. Sotto l'età del consenso digitale del tuo Paese (in Italia 14 anni) la pubblicità non è mai personalizzata e il backup online con un account non è disponibile: i dati restano solo sul dispositivo e puoi salvarne una copia in un file. La chat con il compagno ha solo risposte già scritte e non invia nulla a nessuno. I Tanì sono monete del gioco, non soldi veri; Tanetto Plus e i pacchetti di Tanì si pagano solo con Google Play. Negli Stati Uniti Tanetto non raccoglie informazioni personali dai bambini sotto i 13 anni: gli unici servizi che ricevono un identificativo tecnico sono GoatCounter (l'indirizzo IP, solo per contare e senza conservarlo) e Google AdMob (pubblicità adatta ai bambini, non personalizzata e senza l'ID pubblicità). Genitori e tutori possono scrivere a tanettoapp@gmail.com per qualsiasi domanda o richiesta.","Modifiche: se questa informativa cambia, la versione aggiornata sarà sempre in questa pagina. Ultimo aggiornamento: 14/11/2026."],"terms":["Lavoriamo perché Tanetto funzioni bene e migliori nel tempo; questo non limita i diritti che la legge ti riconosce come consumatore.","L'app aiuta a costruire piccole abitudini quotidiane con un compagno virtuale e non sostituisce consigli medici o psicologici.","Quello che scrivi resta tuo: sul tuo dispositivo e, se usi un account, nel tuo backup personale. Usa l'app con serenità, senza forzarti.","Funzioni a pagamento: Tanetto si scarica gratuitamente. Tanetto Plus (abbonamento mensile o annuale) e i pacchetti di Tanì sono facoltativi e si acquistano tramite Google Play, che gestisce pagamento, rinnovi, disdette e rimborsi secondo le proprie condizioni. Gli abbonamenti si rinnovano da soli finché non li disdici in Google Play › Abbonamenti: la disdetta ferma il rinnovo successivo e Plus resta attivo fino alla fine del periodo già pagato. I Tanì sono una moneta virtuale da usare solo nell'app: non hanno valore in denaro e non si possono convertire in soldi.","Se sei minorenne, chiedi a un genitore o a chi si occupa di te prima di acquistare qualcosa.","I contenuti digitali a pagamento (Tanetto Plus e Tanì) sono disponibili subito dopo l'acquisto; i rimborsi seguono le regole di Google Play e i diritti previsti dalla legge.","Illustrazioni, testi, musiche e codice di Tanetto sono protetti dal diritto d'autore e non possono essere copiati o riutilizzati senza permesso.","Queste condizioni sono regolate dalla legge italiana; se sei un consumatore, mantieni anche le tutele della legge del Paese in cui vivi.","Per qualsiasi domanda puoi scrivere al contatto indicato nell'informativa privacy."],"back":"Torna a Tanetto","del":"Elimina il tuo account Tanetto"},"de":{"lang":"Deutsch","locale":"de-DE","privB":"Datenschutzerklärung","termsB":"Nutzungsbedingungen","priv":["Kurz gesagt: Begleiter, Ziele und Tagebuch bleiben auf diesem Handy. Deinen Namen einzugeben ist freiwillig, der Chat sendet nichts an andere, und die einzige Werbung sind kurze Videos, die du selbst auswählst. Wenn dir etwas unklar ist, frag einen Erwachsenen, dem du vertraust.","Verantwortlicher: Snugbloom Studio, Italien. Kontakt: tanettoapp@gmail.com.","Welche Daten: Tanetto funktioniert auch ohne Konto. Dann werden Begleiter, Ziele, Tagebuch, Garten und Fortschritt nur im Speicher dieses Geräts gesichert und an niemanden gesendet. Gedanken, die du bei „Loslassen“ schreibst, werden überhaupt nicht gespeichert.","Wenn du deinen Namen für die Begrüßung eingibst (freiwillig), wird er genauso gespeichert: auf deinem Gerät und, falls du ein Konto hast, in der Online-Sicherung.","Kopie der Daten: Wenn du auf „Kopie speichern“ tippst, erstellt Tanetto direkt auf deinem Gerät eine Datei mit deinem Fortschritt. Die Datei bleibt bei dir und wird an niemanden gesendet. Bei „Kopie wiederherstellen“ wird die Datei nur von deinem Gerät gelesen.","Freiwilliges Konto und Online-Backup: Wenn du ein Konto erstellst (mit Google oder mit E-Mail und Passwort), speichern wir deine E-Mail-Adresse und eine Kopie deines Fortschritts, nur damit du dich anmelden und ihn wiederherstellen kannst. Die Daten liegen bei Google Firebase (Google Ireland Ltd.) auf Servern in der Europäischen Union, werden verschlüsselt übertragen und sind nur mit deinem Konto zugänglich. Die Anmeldung selbst (Firebase Authentication) wickelt Google in den USA ab, auf Grundlage des EU-US Data Privacy Framework. Rechtsgrundlage: Erbringung des von dir gewünschten Dienstes (Art. 6 Abs. 1 lit. b DSGVO). Das Backup bleibt, bis du dein Profil löschst: jederzeit unter Profil › Konto und Daten › Konto verwalten › Profil löschen oder auf der Seite tanettoapp.github.io/Tanetto/elimina-account.html. Konto und Backup werden sofort gelöscht.","Käufe: Die Zahlungen für Tanetto Plus und Tanì-Pakete wickelt vollständig Google Play ab. Wir erhalten nie deine Karten- oder Zahlungsdaten: Google teilt der App nur mit, welche Käufe aktiv sind, damit sie freigeschaltet werden.","Anonyme Statistik: Um zu verstehen, ob die App hilft, zählen wir zusammengefasst einige Aktionen, zum Beispiel wie oft die App geöffnet wird, ob sie an den Folgetagen genutzt wird oder welche Bereiche genutzt werden (etwa der Shop oder die Spiele), und wir erhalten anonyme Fehlerberichte (nur die Art des Fehlers, nie das, was du schreibst). Wir nutzen GoatCounter, einen Statistikdienst ohne Cookies und ohne Profile, betrieben von Irland aus, mit Daten auf Servern in der Europäischen Union (Finnland und Deutschland). Zum Senden der Zählung verbindet sich das Gerät mit dem Dienst, der dabei technisch die IP-Adresse erhält, sie aber nicht identifizierbar speichert. Rechtsgrundlage: berechtigtes Interesse an der Verbesserung der App (Art. 6 Abs. 1 lit. f DSGVO). Du kannst die Statistik jederzeit unter Profil › Datenschutz und Alter ausschalten. Sie ist immer aus für alle unter dem Alter der digitalen Einwilligung oder ohne Altersangabe, und vor der Frage nach dem Alter wird nichts gezählt.","Hosting: Die Seiten der App werden von einem externen Anbieter bereitgestellt, der die IP-Adresse aus technischen und Sicherheitsgründen gemäß seiner eigenen Datenschutzerklärung protokollieren kann.","Cookies: Tanetto selbst verwendet keine Tracking-Cookies. Der lokale Speicher dient nur dem Funktionieren der App (und dazu, die Statistik nicht doppelt zu zählen) und ist unbedingt erforderlich. In der Android-App kannst du dir freiwillig kurze Werbevideos ansehen, um eine kleine Belohnung zu bekommen: Sie erscheinen nie von selbst, sondern nur, wenn du dich dafür entscheidest.","Videos mit Belohnung (nur Android-App): Die Werbung stellt Google AdMob bereit (Google Ireland Ltd. und Google LLC; Daten können auch in den USA verarbeitet werden). Google verarbeitet diese Daten als eigenständig Verantwortlicher nach seiner eigenen Datenschutzerklärung (https://policies.google.com/privacy); Übermittlungen in die USA stützen sich auf das EU-US Data Privacy Framework. Tanetto selbst erhält deine Werbe-ID nie. Wo es gesetzlich vorgeschrieben ist (Europäischer Wirtschaftsraum, Vereinigtes Königreich und Schweiz), bitten wir dich mit dem Einwilligungstool von Google (UMP) um deine Einwilligung, bevor überhaupt Werbung angezeigt wird; du kannst sie jederzeit unter Profil › Datenschutz und Alter › Werbe-Einstellungen ändern. Um die Videos vorzubereiten und anzuzeigen, kann Google die Werbe-ID deines Geräts, deine IP-Adresse und Informationen über deine Interaktion mit der Werbung erheben, um Werbung auszuliefern, zu messen und Betrug zu verhindern und, nur mit deiner Einwilligung, um sie zu personalisieren. Rechtsgrundlage: deine Einwilligung, wo sie erforderlich ist (Art. 6 Abs. 1 lit. a DSGVO), und das berechtigte Interesse, freiwillige Belohnungen anzubieten und Betrug zu verhindern (Art. 6 Abs. 1 lit. f DSGVO). Die Werbe-ID kannst du in den Android-Einstellungen zurücksetzen oder löschen. Wie Google diese Daten nutzt: https://policies.google.com/technologies/partner-sites. Du kannst höchstens 5 Videos am Tag ansehen, und mit Tanetto Plus siehst du gar keine Werbung. Google kann außerdem zu denselben Zwecken Diagnosedaten zum Werbedienst erfassen (zum Beispiel Abstürze und Leistung) und aus deiner IP-Adresse einen ungefähren Standort ableiten.","Speicherdauer: Die Daten auf dem Gerät bleiben, bis du sie löschst. Das geht jederzeit mit „Von vorne beginnen“ oder durch Löschen der Browserdaten. Die Statistik besteht nur aus zusammengefassten Zahlen.","Deine Rechte: Du kannst Auskunft, Berichtigung, Löschung und Einschränkung verlangen und der Verarbeitung widersprechen, indem du an den Kontakt oben schreibst. Außerdem kannst du dich bei der zuständigen Datenschutzaufsichtsbehörde beschweren. Du kannst außerdem eine Kopie deiner Daten in einem übertragbaren Format verlangen und deine Einwilligung jederzeit widerrufen; was vorher geschehen ist, bleibt davon unberührt.","Datenschutzrechte in US-Bundesstaaten: Wenn du in einem US-Bundesstaat mit einem Verbraucherdatenschutzgesetz lebst, zum Beispiel in Kalifornien: Wir verkaufen deine personenbezogenen Daten nicht gegen Geld. Das Anzeigen von Belohnungsvideos über Google AdMob kann nach diesen Gesetzen als „Weitergabe“ (Sharing) für zielgerichtete Werbung gelten. Du kannst widersprechen, indem du deine Werbe-ID in den Android-Einstellungen löschst oder zurücksetzt, oder unter Profil › Datenschutz und Alter › Werbe-Einstellungen, wenn die App diesen Punkt anzeigt. Die oben beschriebenen Rechte übst du aus, indem du uns schreibst. Dadurch wirst du nie anders behandelt.","Kinder und Jugendliche: Tanetto ist für alle Altersgruppen. Beim ersten Mal fragen wir nach Geburtsmonat und -jahr; die Angabe bleibt nur auf deinem Gerät. Unter 13 Jahren, oder wenn du es lieber nicht sagst, gibt es nur kindgerechte Belohnungsvideos, nie personalisiert, und die Werbe-ID wird nicht gesendet. Unter dem Alter der digitalen Einwilligung in deinem Land (in Deutschland 16 Jahre) ist Werbung nie personalisiert und das Online-Backup mit Konto ist nicht verfügbar: Die Daten bleiben nur auf dem Gerät, und du kannst eine Kopie als Datei speichern. Der Chat mit dem Begleiter hat nur vorgefertigte Antworten und sendet nichts an andere. Tanì sind Spielmünzen, kein echtes Geld; Tanetto Plus und Tanì-Pakete werden nur über Google Play bezahlt. In den USA erhebt Tanetto von Kindern unter 13 Jahren keine personenbezogenen Daten: Nur zwei Dienste erhalten eine technische Kennung, GoatCounter (die IP-Adresse, nur zum Zählen und ohne sie zu speichern) und Google AdMob (kindgerechte, nicht personalisierte Werbung ohne Werbe-ID). Eltern und Erziehungsberechtigte können sich mit jeder Frage oder Bitte an tanettoapp@gmail.com wenden.","Änderungen: Wenn sich diese Erklärung ändert, findest du die aktuelle Fassung immer hier. Letzte Aktualisierung: 14.11.2026."],"terms":["Wir arbeiten daran, dass Tanetto gut funktioniert und mit der Zeit besser wird; deine gesetzlichen Rechte als Verbraucher werden dadurch nicht eingeschränkt.","Die App hilft dabei, kleine tägliche Gewohnheiten mit einem virtuellen Begleiter aufzubauen, und ersetzt keine ärztliche oder psychologische Beratung.","Was du schreibst, gehört dir: auf deinem Gerät und, wenn du ein Konto nutzt, in deinem persönlichen Backup. Nutze die App entspannt und ohne Druck.","Kostenpflichtige Funktionen: Tanetto kann kostenlos heruntergeladen werden. Tanetto Plus (Monats- oder Jahresabo) und Tanì-Pakete sind freiwillig und werden über Google Play gekauft; Google Play wickelt Zahlung, Verlängerungen, Kündigungen und Erstattungen nach den eigenen Bedingungen ab. Abos verlängern sich automatisch, bis du sie in Google Play › Abos kündigst: Die Kündigung stoppt die nächste Verlängerung, und Plus bleibt bis zum Ende des bereits bezahlten Zeitraums aktiv. Tanì sind eine virtuelle Währung nur für die App: Sie haben keinen Geldwert und können nicht in Geld umgetauscht werden.","Wenn du minderjährig bist, frag vor einem Kauf deine Eltern oder eine erziehungsberechtigte Person.","Kostenpflichtige digitale Inhalte (Tanetto Plus und Tanì) stehen sofort nach dem Kauf bereit; Erstattungen richten sich nach den Regeln von Google Play und deinen gesetzlichen Rechten.","Illustrationen, Texte, Musik und Code von Tanetto sind urheberrechtlich geschützt und dürfen ohne Erlaubnis nicht kopiert oder wiederverwendet werden.","Für diese Bedingungen gilt italienisches Recht; als Verbraucher behältst du auch den Schutz des Rechts des Landes, in dem du lebst.","Bei Fragen kannst du dich an den Kontakt in der Datenschutzerklärung wenden."],"back":"Zurück zu Tanetto","del":"Dein Tanetto-Konto löschen"},"es":{"lang":"Español","locale":"es-ES","privB":"Política de privacidad","termsB":"Condiciones de uso","priv":["En resumen: tu compañero, tus objetivos y tu diario se quedan en este teléfono. Escribir tu nombre es opcional, el chat no envía nada a nadie y los únicos anuncios son vídeos cortos que tú eliges ver. Si algo no está claro, pregunta a una persona adulta de confianza.","Responsable del tratamiento: Snugbloom Studio, Italia. Contacto: tanettoapp@gmail.com.","Qué datos: Tanetto también funciona sin cuenta. En ese caso, el compañero, los objetivos, el diario, el jardín y el progreso se guardan solo en la memoria de este dispositivo y no se envían a nadie. Los pensamientos escritos en «Soltar» no se guardan en absoluto.","Si escribes tu nombre para el saludo (es opcional), se guarda de la misma forma: en tu dispositivo y, si tienes una cuenta, en la copia de seguridad en línea.","Copia de los datos: si tocas «Guardar una copia», Tanetto crea un archivo con tu progreso directamente en tu dispositivo. El archivo es tuyo y no se envía a nadie. Con «Restaurar una copia», el archivo solo lo lee tu dispositivo.","Cuenta opcional y copia en línea: si decides crear una cuenta (con Google o con correo y contraseña), guardamos tu dirección de correo y una copia de tu progreso, solo para que puedas iniciar sesión y restaurarlo. Los datos los custodia Google Firebase (Google Ireland Ltd.) en servidores de la Unión Europea, se transmiten cifrados y solo se puede acceder a ellos con tu cuenta. El inicio de sesión (Firebase Authentication) lo gestiona Google en Estados Unidos, al amparo del Marco de Privacidad de Datos UE-EE. UU. Base jurídica: prestación del servicio que has pedido (art. 6.1.b del RGPD). La copia se conserva hasta que elimines tu perfil: puedes hacerlo cuando quieras en Perfil › Cuenta y datos › Gestionar cuenta › Eliminar perfil, o en la página tanettoapp.github.io/Tanetto/elimina-account.html. La cuenta y la copia se borran al momento.","Compras: los pagos de Tanetto Plus y de los paquetes de Tanì los gestiona por completo Google Play. Nunca recibimos los datos de tu tarjeta ni del pago: Google solo indica a la app qué compras están activas para desbloquearlas.","Estadísticas anónimas: para saber si la app es útil contamos, de forma agregada, algunas acciones, por ejemplo cuántas veces se abre la app, si se usa en los días siguientes o qué partes se usan (como la tienda o los juegos), y recibimos informes anónimos de errores (solo el tipo de error, nunca lo que escribes). Usamos GoatCounter, un servicio de estadísticas sin cookies que no crea perfiles, gestionado desde Irlanda y con los datos en servidores de la Unión Europea (Finlandia y Alemania). Para enviar el recuento, el dispositivo se conecta al servicio, que recibe técnicamente la dirección IP sin guardarla de forma identificable. Base jurídica: interés legítimo en mejorar la app (art. 6.1.f del RGPD). Puedes desactivar las estadísticas cuando quieras en Perfil › Privacidad y edad. Siempre están desactivadas para quien aún no tiene la edad del consentimiento digital o no ha dicho su edad, y antes de la pregunta sobre la edad no se cuenta nada.","Alojamiento: las páginas de la app están alojadas por un proveedor externo, que puede registrar la dirección IP por motivos técnicos y de seguridad según su propia política.","Cookies: Tanetto no usa cookies de seguimiento propias. El almacenamiento local solo sirve para que la app funcione (y para no contar dos veces las estadísticas) y es estrictamente necesario. En la app de Android puedes elegir ver anuncios cortos para conseguir una pequeña recompensa: nunca aparecen solos, solo cuando tú decides ver uno.","Vídeos con recompensa (solo app de Android): los anuncios los proporciona Google AdMob (Google Ireland Ltd. y Google LLC; los datos también pueden tratarse en Estados Unidos). Google trata estos datos como responsable independiente según su propia política de privacidad (https://policies.google.com/privacy); las transferencias a Estados Unidos se basan en el Marco de Privacidad de Datos UE-EE. UU. Tanetto nunca recibe tu ID de publicidad. Donde la ley lo exige (Espacio Económico Europeo, Reino Unido y Suiza), te pedimos el consentimiento con la herramienta de gestión del consentimiento de Google (UMP) antes de mostrar cualquier anuncio; puedes cambiarlo cuando quieras en Perfil › Privacidad y edad › Opciones de publicidad. Para preparar y mostrar los vídeos, Google puede recoger el ID de publicidad del dispositivo, la dirección IP e información sobre tu interacción con los anuncios, para mostrarlos, medirlos y prevenir el fraude y, solo con tu consentimiento, para personalizarlos. Base jurídica: tu consentimiento, cuando es necesario (art. 6.1.a del RGPD), y el interés legítimo en ofrecer recompensas opcionales y prevenir el fraude (art. 6.1.f del RGPD). Puedes restablecer o eliminar el ID de publicidad en los ajustes de Android. Cómo usa Google estos datos: https://policies.google.com/technologies/partner-sites. Puedes ver como máximo 5 vídeos al día y, con Tanetto Plus, no ves ningún anuncio. Google también puede recoger datos de diagnóstico del servicio de anuncios (por ejemplo, fallos y rendimiento) y deducir una ubicación aproximada a partir de tu dirección IP, con los mismos fines.","Conservación: los datos del dispositivo se quedan hasta que los borres. Puedes hacerlo cuando quieras con «Empezar de nuevo» o borrando los datos del navegador. Las estadísticas son solo números agregados.","Tus derechos: puedes solicitar información, acceso, rectificación, supresión y limitación, y oponerte al tratamiento escribiendo al contacto indicado arriba. También puedes reclamar ante la autoridad de control: en España, la Agencia Española de Protección de Datos. También puedes pedir una copia de tus datos en un formato portable y retirar tu consentimiento en cualquier momento, sin que afecte a lo realizado antes.","Derechos de privacidad en estados de EE. UU.: si vives en un estado de EE. UU. con una ley de privacidad del consumidor, como California, te informamos de que no vendemos tus datos personales a cambio de dinero. Mostrar vídeos con recompensa mediante Google AdMob puede considerarse «compartir» datos para publicidad dirigida según esas leyes. Puedes oponerte borrando o restableciendo tu ID de publicidad en los ajustes de Android, o en Perfil › Privacidad y edad › Opciones de publicidad cuando la app lo muestre, y puedes ejercer los derechos descritos arriba escribiéndonos. Ejercer estos derechos nunca cambiará el trato que recibes.","Niñas, niños y adolescentes: Tanetto es para todas las edades. La primera vez preguntamos el mes y el año de nacimiento, que se quedan solo en tu dispositivo. Por debajo de los 13 años, o si prefieres no decirlo, los vídeos con premio son solo los adecuados para niños, nunca personalizados, y no se envía el ID de publicidad. Por debajo de la edad de consentimiento digital de tu país (en España, 14 años) la publicidad nunca es personalizada y la copia en línea con cuenta no está disponible: los datos se quedan solo en el dispositivo y puedes guardar una copia en un archivo. El chat con el compañero solo tiene respuestas ya escritas y no envía nada a nadie. Los Tanì son monedas del juego, no dinero real; Tanetto Plus y los paquetes de Tanì solo se pagan con Google Play. En Estados Unidos, Tanetto no recoge información personal de menores de 13 años: los únicos servicios que reciben un identificador técnico son GoatCounter (la dirección IP, solo para contar y sin guardarla) y Google AdMob (anuncios adecuados para niños, no personalizados y sin el ID de publicidad). Madres, padres y tutores pueden escribir a tanettoapp@gmail.com con cualquier pregunta o solicitud.","Cambios: si esta política cambia, la versión actualizada estará siempre en esta página. Última actualización: 14/11/2026."],"terms":["Trabajamos para que Tanetto funcione bien y mejore con el tiempo; esto no limita tus derechos legales como consumidor.","La app ayuda a crear pequeños hábitos diarios con un compañero virtual y no sustituye el consejo médico o psicológico.","Lo que escribes es tuyo: en tu dispositivo y, si usas una cuenta, en tu copia personal. Usa la app con calma, sin forzarte.","Funciones de pago: Tanetto se descarga gratis. Tanetto Plus (suscripción mensual o anual) y los paquetes de Tanì son opcionales y se compran a través de Google Play, que gestiona el pago, las renovaciones, las cancelaciones y los reembolsos según sus propias condiciones. Las suscripciones se renuevan solas hasta que las canceles en Google Play › Suscripciones: la cancelación detiene la siguiente renovación y Plus sigue activo hasta el final del periodo ya pagado. Los Tanì son una moneda virtual para usar solo dentro de la app: no tienen valor económico y no se pueden cambiar por dinero.","Si eres menor de edad, pide permiso a tu madre, padre o tutor antes de comprar algo.","El contenido digital de pago (Tanetto Plus y Tanì) está disponible en cuanto lo compras; los reembolsos siguen las normas de Google Play y tus derechos legales.","Las ilustraciones, textos, música y código de Tanetto están protegidos por derechos de autor y no se pueden copiar ni reutilizar sin permiso.","Estas condiciones se rigen por la ley italiana; si eres consumidor, también conservas la protección de la ley del país donde vives.","Para cualquier duda puedes escribir al contacto indicado en la política de privacidad."],"back":"Volver a Tanetto","del":"Elimina tu cuenta de Tanetto"},"en":{"lang":"English","locale":"en-GB","privB":"Privacy policy","termsB":"Terms of use","priv":["In short: your companion, goals and journal stay on this phone. Typing your name is optional, the chat sends nothing to anyone, and the only ads are short videos that you choose to watch. If something here isn't clear, ask an adult you trust.","Data controller: Snugbloom Studio, Italy. Contact: tanettoapp@gmail.com.","What data: Tanetto also works without an account. In that case your companion, goals, journal, garden and progress are saved only in this device's memory and are not sent to anyone. Thoughts written in “Let it go” are not saved at all.","If you type your name for the greeting (it's optional), it's stored the same way: on your device and, if you have an account, in the online backup.","Copy of your data: if you tap “Save a copy”, Tanetto creates a file with your progress directly on your device. The file stays with you and is not sent to anyone. With “Restore a copy”, the file is read only by your device.","Optional account and online backup: if you choose to create an account (with Google or with email and password), we keep your email address and a copy of your progress, only to let you sign in and restore it. The data is held by Google Firebase (Google Ireland Ltd.) on servers in the European Union, sent encrypted and accessible only with your account. Sign-in itself (Firebase Authentication) is handled by Google in the United States, under the EU–US Data Privacy Framework. Legal basis: providing the service you asked for (Art. 6(1)(b) GDPR). The backup stays until you delete your profile: you can do so anytime in Profile › Account and data › Manage account › Delete profile, or on the page tanettoapp.github.io/Tanetto/elimina-account.html. The account and the backup are deleted immediately.","Purchases: payments for Tanetto Plus and Tanì packs are handled entirely by Google Play. We never receive your card or payment details: Google only tells the app which purchases are active, so it can unlock them.","Anonymous statistics: to understand whether the app is useful, we count some actions in aggregate form, for example how often the app is opened, whether it's used on the following days or which parts are used (such as the shop or the games), and we receive anonymous error reports (only the type of error, never what you write). We use GoatCounter, a statistics service with no cookies and no profiles, run from Ireland with data on servers in the European Union (Finland and Germany). To send the count, the device connects to the service, which technically receives the IP address without storing it in an identifiable way. Legal basis: legitimate interest in improving the app (Article 6(1)(f) GDPR / UK GDPR). You can turn the statistics off at any time in Profile › Privacy and age. They are always off for anyone under the age of digital consent or who hasn't given their age, and nothing is counted before the age question.","Hosting: the app's pages are hosted by an external provider, which may log the IP address for technical and security reasons under its own privacy policy.","Cookies: Tanetto itself uses no tracking cookies. Local storage is used only to make the app work (and to avoid counting statistics twice) and is strictly necessary. In the Android app you can choose to watch short ads to get a small reward: they never appear on their own, only when you choose to watch one.","Rewarded videos (Android app only): ads are provided by Google AdMob (Google Ireland Ltd. and Google LLC; data may also be processed in the United States). Google acts as an independent controller of this data under its own privacy policy (https://policies.google.com/privacy); transfers to the US rely on the EU–US Data Privacy Framework. Tanetto itself never receives your advertising ID. Where the law requires it (European Economic Area, United Kingdom and Switzerland), we ask for your consent with Google's consent management tool (UMP) before any ad is shown; you can change it anytime in Profile › Privacy and age › Ad choices. To load and play the videos, Google may collect your device's advertising ID, your IP address and information about your interaction with the ads, to serve and measure them and prevent fraud and, only with your consent, to personalise them. Legal basis: your consent, where required (Art. 6(1)(a) GDPR / UK GDPR), and legitimate interest in offering optional rewards and preventing fraud (Art. 6(1)(f) GDPR / UK GDPR). You can reset or delete the advertising ID in your Android settings. How Google uses this data: https://policies.google.com/technologies/partner-sites. You can watch up to 5 videos a day, and with Tanetto Plus you see no ads at all. Google may also collect diagnostic information about the ad service (for example crashes and performance) and estimate an approximate location from your IP address, for the same purposes.","Retention: data on the device stays until you delete it. You can do so at any time with “Start over” or by clearing your browser data. Statistics are only aggregate numbers.","Your rights: you can request information, access, correction, deletion and restriction, and object to processing, by writing to the contact above. You can also complain to your data protection authority (in the UK, the ICO). You can also ask for a copy of your data in a portable format, and you can withdraw your consent at any time; this does not affect what was done before.","US state privacy rights: if you live in a US state with a consumer privacy law, such as California, note that we do not sell your personal information for money. Showing reward videos through Google AdMob may count as “sharing” for targeted advertising under those laws. You can opt out by deleting or resetting your advertising ID in your Android settings, or in Profile › Privacy and age › Ad choices when the app shows it, and you can use the rights described above by writing to us. Using these rights will never change how we treat you.","Children and teens: Tanetto is for all ages. The first time, we ask for your month and year of birth, which stay only on your device. Under 13, or if you'd rather not say, reward videos are only child-appropriate ones, never personalised, and the advertising ID is not sent. Under the age of digital consent in your country (13 in the UK, 16 where the law sets no lower age), ads are never personalised and the online backup with an account isn't available: your data stays only on the device, and you can save a copy to a file. The chat with your companion only has pre-written replies and sends nothing to anyone. Tanì are game coins, not real money; Tanetto Plus and Tanì packs are paid only through Google Play. In the United States, Tanetto does not collect personal information from children under 13: the only services that receive a technical identifier are GoatCounter (the IP address, only to count and not stored) and Google AdMob (child-appropriate ads that are not personalised, without the advertising ID). Parents and guardians can write to tanettoapp@gmail.com with any question or request.","Changes: if this policy changes, the updated version will always be on this page. Last updated: 14/11/2026."],"terms":["We work to keep Tanetto running well and to improve it over time; this does not limit your legal rights as a consumer.","The app helps you build small daily habits with a virtual companion and does not replace medical or psychological advice.","What you write is yours: on your device and, if you use an account, in your personal backup. Use the app calmly, without pushing yourself.","Paid features: Tanetto is free to download. Tanetto Plus (monthly or yearly subscription) and Tanì packs are optional and are bought through Google Play, which handles payment, renewals, cancellations and refunds under its own terms. Subscriptions renew automatically until you cancel them in Google Play › Subscriptions: cancelling stops the next renewal, and Plus stays active until the end of the period already paid. Tanì are a virtual currency for use only inside the app: they have no monetary value and cannot be exchanged for money.","If you are a minor, ask a parent or guardian before buying anything.","Paid digital content (Tanetto Plus and Tanì) is available as soon as you buy it; refunds follow Google Play's policies and your legal rights.","Tanetto's illustrations, texts, music and code are protected by copyright and may not be copied or reused without permission.","These terms are governed by Italian law; if you are a consumer, you also keep the protections of the law of the country where you live.","For any question you can write to the contact listed in the privacy policy."],"back":"Back to Tanetto","del":"Delete your Tanetto account"},"fr":{"lang":"Français","locale":"fr-FR","privB":"Politique de confidentialité","termsB":"Conditions d'utilisation","priv":["En bref : ton compagnon, tes objectifs et ton journal restent sur ce téléphone. Écrire ton prénom est facultatif, le chat n'envoie rien à personne et les seules publicités sont de courtes vidéos que tu choisis de regarder. Si quelque chose n'est pas clair, demande à un adulte de confiance.","Responsable du traitement : Snugbloom Studio, Italie. Contact : tanettoapp@gmail.com.","Quelles données : Tanetto fonctionne aussi sans compte. Dans ce cas, le compagnon, les objectifs, le journal, le jardin et les progrès sont enregistrés uniquement dans la mémoire de cet appareil et ne sont envoyés à personne. Les pensées écrites dans « Lâcher prise » ne sont pas enregistrées du tout.","Si tu écris ton prénom pour le message d'accueil (c'est facultatif), il est enregistré de la même façon : sur ton appareil et, si tu as un compte, dans la sauvegarde en ligne.","Copie des données : si tu touches « Enregistrer une copie », Tanetto crée un fichier avec ta progression directement sur ton appareil. Le fichier reste chez toi et n'est envoyé à personne. Avec « Restaurer une copie », le fichier est lu uniquement par ton appareil.","Compte facultatif et sauvegarde en ligne : si tu choisis de créer un compte (avec Google ou avec e-mail et mot de passe), nous conservons ton adresse e-mail et une copie de ta progression, uniquement pour te permettre de te connecter et de la restaurer. Les données sont hébergées par Google Firebase (Google Ireland Ltd.) sur des serveurs dans l'Union européenne, transmises de façon chiffrée et accessibles uniquement avec ton compte. La connexion elle-même (Firebase Authentication) est gérée par Google aux États-Unis, dans le cadre du Data Privacy Framework UE-États-Unis. Base légale : exécution du service que tu as demandé (art. 6, par. 1, point b du RGPD). La sauvegarde reste jusqu'à ce que tu supprimes ton profil : tu peux le faire à tout moment dans Profil › Compte et données › Gérer le compte › Supprimer le profil, ou sur la page tanettoapp.github.io/Tanetto/elimina-account.html. Le compte et la sauvegarde sont supprimés immédiatement.","Achats : les paiements de Tanetto Plus et des packs de Tanì sont entièrement gérés par Google Play. Nous ne recevons jamais les données de ta carte ou de ton paiement : Google indique seulement à l'app quels achats sont actifs, pour les débloquer.","Statistiques anonymes : pour savoir si l'app est utile, nous comptons de façon agrégée certaines actions, par exemple combien de fois l'app est ouverte, si elle est utilisée les jours suivants ou quelles parties sont utilisées (comme la boutique ou les jeux), et nous recevons des rapports d'erreur anonymes (seulement le type d'erreur, jamais ce que tu écris). Nous utilisons GoatCounter, un service de statistiques sans cookies et sans profilage, géré depuis l'Irlande, avec des données sur des serveurs dans l'Union européenne (Finlande et Allemagne). Pour envoyer le comptage, l'appareil se connecte au service, qui reçoit techniquement l'adresse IP sans la conserver de façon identifiable. Base légale : intérêt légitime à améliorer l'app (art. 6, par. 1, point f du RGPD). Tu peux désactiver les statistiques à tout moment dans Profil › Confidentialité et âge. Elles sont toujours désactivées pour qui n'a pas encore l'âge du consentement numérique ou n'a pas indiqué son âge, et rien n'est compté avant la question sur l'âge.","Hébergement : les pages de l'app sont hébergées par un prestataire externe, qui peut enregistrer l'adresse IP pour des raisons techniques et de sécurité selon sa propre politique.","Cookies : Tanetto n'utilise lui-même aucun cookie de suivi. Le stockage local sert uniquement au fonctionnement de l'app (et à ne pas compter deux fois les statistiques) et est strictement nécessaire. Dans l'app Android, tu peux choisir de regarder de courtes publicités pour recevoir une petite récompense : elles n'apparaissent jamais d'elles-mêmes, seulement quand tu choisis d'en regarder une.","Vidéos récompensées (app Android uniquement) : les publicités sont fournies par Google AdMob (Google Ireland Ltd. et Google LLC ; les données peuvent aussi être traitées aux États-Unis). Google traite ces données en tant que responsable de traitement indépendant, selon sa propre politique de confidentialité (https://policies.google.com/privacy) ; les transferts vers les États-Unis reposent sur le cadre de protection des données UE–États-Unis (Data Privacy Framework). Tanetto ne reçoit jamais ton identifiant publicitaire. Là où la loi l'exige (Espace économique européen, Royaume-Uni et Suisse), nous te demandons ton consentement avec l'outil de gestion du consentement de Google (UMP) avant toute publicité ; tu peux le modifier à tout moment dans Profil › Confidentialité et âge › Choix publicitaires. Pour préparer et afficher les vidéos, Google peut collecter l'identifiant publicitaire de l'appareil, l'adresse IP et des informations sur ton interaction avec les annonces, afin de les diffuser, de les mesurer et de prévenir la fraude et, uniquement avec ton consentement, de les personnaliser. Base légale : ton consentement, lorsqu'il est requis (art. 6, par. 1, point a du RGPD), et l'intérêt légitime à proposer des récompenses facultatives et à prévenir la fraude (art. 6, par. 1, point f du RGPD). Tu peux réinitialiser ou supprimer l'identifiant publicitaire dans les paramètres d'Android. Comment Google utilise ces données : https://policies.google.com/technologies/partner-sites. Tu peux regarder au maximum 5 vidéos par jour, et avec Tanetto Plus tu ne vois aucune publicité. Google peut aussi collecter des données de diagnostic sur le service publicitaire (par exemple plantages et performances) et estimer une position approximative à partir de ton adresse IP, pour les mêmes finalités.","Conservation : les données de l'appareil restent jusqu'à ce que tu les effaces. Tu peux le faire à tout moment avec « Tout recommencer » ou en effaçant les données du navigateur. Les statistiques ne sont que des chiffres agrégés.","Tes droits : tu peux demander l'information, l'accès, la rectification, l'effacement et la limitation, et t'opposer au traitement en écrivant au contact ci-dessus. Tu peux aussi déposer une plainte auprès de la CNIL. Tu peux aussi demander une copie de tes données dans un format portable et retirer ton consentement à tout moment, sans effet sur ce qui a été fait avant.","Droits à la vie privée dans les États américains : si tu vis dans un État américain doté d'une loi sur la vie privée des consommateurs, comme la Californie, sache que nous ne vendons pas tes données personnelles contre de l'argent. L'affichage de vidéos avec récompense via Google AdMob peut être considéré comme un « partage » à des fins de publicité ciblée au sens de ces lois. Tu peux t'y opposer en supprimant ou en réinitialisant ton identifiant publicitaire dans les réglages Android, ou dans Profil › Confidentialité et âge › Choix publicitaires lorsque l'app l'affiche, et tu peux exercer les droits décrits ci-dessus en nous écrivant. Exercer ces droits ne changera jamais la façon dont nous te traitons.","Enfants et ados : Tanetto est pour tous les âges. La première fois, nous demandons le mois et l'année de naissance, qui restent seulement sur ton appareil. Avant 13 ans, ou si tu préfères ne pas le dire, les vidéos récompensées sont uniquement adaptées aux enfants, jamais personnalisées, et l'identifiant publicitaire n'est pas envoyé. Sous l'âge du consentement numérique de ton pays (en France, 15 ans), la publicité n'est jamais personnalisée et la sauvegarde en ligne avec un compte n'est pas disponible : les données restent seulement sur l'appareil, et tu peux en enregistrer une copie dans un fichier. Le chat avec ton compagnon n'a que des réponses déjà écrites et n'envoie rien à personne. Les Tanì sont des pièces du jeu, pas de l'argent réel ; Tanetto Plus et les packs de Tanì se paient uniquement via Google Play. Aux États-Unis, Tanetto ne collecte aucune information personnelle auprès des enfants de moins de 13 ans : les seuls services qui reçoivent un identifiant technique sont GoatCounter (l'adresse IP, uniquement pour compter et sans la conserver) et Google AdMob (des publicités adaptées aux enfants, non personnalisées et sans l'identifiant publicitaire). Les parents et tuteurs peuvent écrire à tanettoapp@gmail.com pour toute question ou demande.","Modifications : si cette politique change, la version à jour sera toujours sur cette page. Dernière mise à jour : 14/11/2026."],"terms":["Nous faisons en sorte que Tanetto fonctionne bien et s'améliore avec le temps ; cela ne limite pas tes droits légaux de consommateur.","L'app aide à construire de petites habitudes quotidiennes avec un compagnon virtuel et ne remplace pas un avis médical ou psychologique.","Ce que tu écris t'appartient : sur ton appareil et, si tu utilises un compte, dans ta sauvegarde personnelle. Utilise l'app sereinement, sans te forcer.","Fonctions payantes : Tanetto se télécharge gratuitement. Tanetto Plus (abonnement mensuel ou annuel) et les packs de Tanì sont facultatifs et s'achètent via Google Play, qui gère le paiement, les renouvellements, les résiliations et les remboursements selon ses propres conditions. Les abonnements se renouvellent automatiquement jusqu'à ce que tu les résilies dans Google Play › Abonnements : la résiliation arrête le renouvellement suivant et Plus reste actif jusqu'à la fin de la période déjà payée. Les Tanì sont une monnaie virtuelle à utiliser uniquement dans l'app : ils n'ont aucune valeur monétaire et ne peuvent pas être échangés contre de l'argent.","Si tu as moins de 18 ans, demande à un parent ou à un tuteur avant d'acheter quoi que ce soit.","Le contenu numérique payant (Tanetto Plus et Tanì) est disponible dès l'achat ; les remboursements suivent les règles de Google Play et tes droits légaux.","Les illustrations, textes, musiques et le code de Tanetto sont protégés par le droit d'auteur et ne peuvent pas être copiés ou réutilisés sans autorisation.","Ces conditions sont régies par le droit italien ; en tant que consommateur, tu gardes aussi la protection de la loi du pays où tu vis.","Pour toute question, tu peux écrire au contact indiqué dans la politique de confidentialité."],"back":"Retour à Tanetto","del":"Supprimer ton compte Tanetto"},"pt":{"lang":"Português (BR)","locale":"pt-BR","privB":"Política de privacidade","termsB":"Termos de uso","priv":["Resumindo: seu companheiro, suas metas e seu diário ficam neste celular. Escrever seu nome é opcional, o chat não envia nada a ninguém e os únicos anúncios são vídeos curtos que você escolhe assistir. Se algo não estiver claro, pergunte a um adulto de confiança.","Controlador dos dados: Snugbloom Studio, Itália. Contato: tanettoapp@gmail.com.","Quais dados: o Tanetto também funciona sem conta. Nesse caso, o companheiro, as metas, o diário, o jardim e o progresso ficam salvos só na memória deste aparelho e não são enviados a ninguém. Os pensamentos escritos em “Deixe ir” não são salvos de jeito nenhum.","Se você escrever seu nome para a saudação (é opcional), ele fica salvo do mesmo jeito: no seu dispositivo e, se você tiver uma conta, no backup online.","Cópia dos dados: se você tocar em “Salvar uma cópia”, o Tanetto cria um arquivo com seu progresso diretamente no seu aparelho. O arquivo fica com você e não é enviado a ninguém. Com “Restaurar uma cópia”, o arquivo é lido apenas pelo seu aparelho.","Conta opcional e backup online: se você decidir criar uma conta (com o Google ou com e-mail e senha), guardamos seu endereço de e-mail e uma cópia do seu progresso, só para você entrar e restaurá-lo. Os dados ficam com o Google Firebase (Google Ireland Ltd.) em servidores na União Europeia, são transmitidos com criptografia e só podem ser acessados com a sua conta. O login em si (Firebase Authentication) é feito pelo Google nos Estados Unidos, com base no EU-US Data Privacy Framework. Base legal: prestação do serviço que você pediu (art. 6.º, n.º 1, alínea b do RGPD). O backup fica guardado até você excluir seu perfil: dá para fazer isso quando quiser em Perfil › Conta e dados › Gerenciar conta › Excluir perfil, ou na página tanettoapp.github.io/Tanetto/elimina-account.html. A conta e o backup são apagados na hora.","Compras: os pagamentos do Tanetto Plus e dos pacotes de Tanì são feitos inteiramente pelo Google Play. Nunca recebemos os dados do seu cartão ou do pagamento: o Google só informa ao app quais compras estão ativas, para liberá-las.","Estatísticas anônimas: para entender se o app é útil, contamos de forma agregada algumas ações, por exemplo quantas vezes o app é aberto, se é usado nos dias seguintes ou quais partes são usadas (como a loja ou os jogos), e recebemos relatórios de erro anônimos (só o tipo de erro, nunca o que você escreve). Usamos o GoatCounter, um serviço de estatísticas sem cookies e sem perfis, operado a partir da Irlanda, com os dados em servidores na União Europeia (Finlândia e Alemanha). Para enviar a contagem, o aparelho se conecta ao serviço, que recebe tecnicamente o endereço IP sem guardá-lo de forma identificável. Base legal: legítimo interesse em melhorar o app (art. 7º, IX da LGPD e art. 6º, 1, f do GDPR europeu). Você pode desativar as estatísticas quando quiser em Perfil › Privacidade e idade. Elas ficam sempre desativadas para quem ainda não tem a idade do consentimento digital ou não informou a idade, e nada é contado antes da pergunta sobre a idade.","Hospedagem: as páginas do app são hospedadas por um fornecedor externo, que pode registrar o endereço IP por motivos técnicos e de segurança, conforme sua própria política.","Cookies: o Tanetto não usa cookies de rastreamento próprios. O armazenamento local serve só para o app funcionar (e para não contar as estatísticas duas vezes) e é estritamente necessário. No app para Android, você pode escolher assistir a anúncios curtos para ganhar uma pequena recompensa: eles nunca aparecem sozinhos, só quando você decide assistir a um.","Vídeos com recompensa (só no app para Android): os anúncios são fornecidos pelo Google AdMob (Google Ireland Ltd. e Google LLC; os dados também podem ser tratados nos Estados Unidos). O Google trata esses dados como controlador independente, de acordo com a própria política de privacidade (https://policies.google.com/privacy); as transferências para os Estados Unidos se baseiam no EU-US Data Privacy Framework. O Tanetto nunca recebe o seu ID de publicidade. Onde a lei exige (Espaço Econômico Europeu, Reino Unido e Suíça), pedimos seu consentimento com a ferramenta de gestão de consentimento do Google (UMP) antes de qualquer anúncio; você pode mudá-lo quando quiser em Perfil › Privacidade e idade › Escolhas de publicidade. Para preparar e exibir os vídeos, o Google pode coletar o ID de publicidade do aparelho, o endereço IP e informações sobre sua interação com os anúncios, para exibi-los, medi-los e evitar fraudes e, só com seu consentimento, para personalizá-los. Base legal: seu consentimento, quando necessário (art. 7º, I da LGPD e art. 6º, 1, a do GDPR europeu), e o legítimo interesse em oferecer recompensas opcionais e evitar fraudes (art. 7º, IX da LGPD e art. 6º, 1, f do GDPR europeu). Você pode redefinir ou excluir o ID de publicidade nas configurações do Android. Como o Google usa esses dados: https://policies.google.com/technologies/partner-sites. Você pode assistir a no máximo 5 vídeos por dia e, com o Tanetto Plus, não vê nenhum anúncio. O Google também pode coletar dados de diagnóstico do serviço de anúncios (por exemplo, falhas e desempenho) e estimar uma localização aproximada a partir do seu endereço IP, para as mesmas finalidades.","Retenção: os dados no aparelho ficam até você apagá-los. Você pode fazer isso quando quiser com “Começar de novo” ou apagando os dados do navegador. As estatísticas são apenas números agregados.","Seus direitos: você pode pedir informações, acesso, correção, eliminação e limitação, e se opor ao tratamento, escrevendo para o contato acima. Também pode fazer uma reclamação à autoridade de proteção de dados: no Brasil, a ANPD. Você também pode pedir uma cópia dos seus dados em formato portável e retirar seu consentimento a qualquer momento, sem afetar o que foi feito antes.","Direitos de privacidade em estados dos EUA: se você mora em um estado dos EUA com uma lei de privacidade do consumidor, como a Califórnia, saiba que não vendemos seus dados pessoais em troca de dinheiro. Exibir vídeos com recompensa pelo Google AdMob pode contar como “compartilhamento” para publicidade direcionada segundo essas leis. Você pode recusar excluindo ou redefinindo seu ID de publicidade nas configurações do Android, ou em Perfil › Privacidade e idade › Escolhas de publicidade quando o app mostrar essa opção, e pode exercer os direitos descritos acima escrevendo para nós. Exercer esses direitos nunca vai mudar a forma como tratamos você.","Crianças e adolescentes: o Tanetto é para todas as idades. Na primeira vez perguntamos o mês e o ano de nascimento, que ficam só no seu dispositivo. Abaixo dos 13 anos, ou se você preferir não dizer, os vídeos com prêmio são só os adequados para crianças, nunca personalizados, e o ID de publicidade não é enviado. Abaixo da idade de consentimento digital do seu país (16 anos onde a lei não define uma idade menor), a publicidade nunca é personalizada e o backup on-line com conta não está disponível: os dados ficam só no dispositivo, e você pode salvar uma cópia em um arquivo. O chat com o companheiro só tem respostas já escritas e não envia nada a ninguém. Os Tanì são moedas do jogo, não dinheiro de verdade; o Tanetto Plus e os pacotes de Tanì são pagos só pelo Google Play. Nos Estados Unidos, o Tanetto não coleta informações pessoais de crianças menores de 13 anos: os únicos serviços que recebem um identificador técnico são o GoatCounter (o endereço IP, só para contar e sem guardá-lo) e o Google AdMob (anúncios adequados para crianças, não personalizados e sem o ID de publicidade). Pais, mães e responsáveis podem escrever para tanettoapp@gmail.com com qualquer dúvida ou pedido.","Alterações: se esta política mudar, a versão atualizada estará sempre nesta página. Última atualização: 14/11/2026."],"terms":["Trabalhamos para que o Tanetto funcione bem e melhore com o tempo; isso não limita seus direitos legais como consumidor.","O app ajuda a criar pequenos hábitos diários com um companheiro virtual e não substitui orientação médica ou psicológica.","O que você escreve é seu: no seu aparelho e, se você usar uma conta, no seu backup pessoal. Use o app com tranquilidade, sem se cobrar.","Recursos pagos: o Tanetto é gratuito para baixar. O Tanetto Plus (assinatura mensal ou anual) e os pacotes de Tanì são opcionais e são comprados pelo Google Play, que cuida do pagamento, das renovações, dos cancelamentos e dos reembolsos conforme os próprios termos. As assinaturas renovam automaticamente até você cancelar em Google Play › Assinaturas: o cancelamento interrompe a próxima renovação e o Plus continua ativo até o fim do período já pago. Os Tanì são uma moeda virtual para usar só dentro do app: não têm valor em dinheiro e não podem ser trocados por dinheiro.","Se você for menor de idade, peça a um responsável antes de comprar qualquer coisa.","O conteúdo digital pago (Tanetto Plus e Tanì) fica disponível assim que você compra; os reembolsos seguem as regras do Google Play e os seus direitos legais.","As ilustrações, textos, músicas e o código do Tanetto são protegidos por direitos autorais e não podem ser copiados ou reutilizados sem permissão.","Estes termos são regidos pela lei italiana; se você for consumidor, também mantém as proteções da lei do país onde mora.","Para qualquer dúvida, escreva para o contato indicado na política de privacidade."],"back":"Voltar ao Tanetto","del":"Excluir sua conta do Tanetto"},"ja":{"lang":"日本語","locale":"ja-JP","privB":"プライバシーポリシー","termsB":"利用規約","priv":["かんたんに言うと：パートナー、目標、日記はこのスマホの中だけに残ります。名前の入力は自由で、チャットはだれにも何も送りません。広告は、あなたが見ると決めた短い動画だけです。わからないことがあれば、信頼できる大人に聞いてみてください。","データ管理者：Snugbloom Studio（イタリア）。連絡先：tanettoapp@gmail.com。","取り扱うデータ：Tanettoはアカウントなしでも使えます。その場合、パートナー、目標、日記、お庭、進み具合はこの端末の中だけに保存され、誰にも送信されません。「手放そう」に書いた思いは一切保存されません。","あいさつ用に名前を入力した場合（任意）、同じように保存されます。端末内と、アカウントがある場合はオンラインのバックアップです。","データのコピー：「コピーを保存」をタップすると、Tanettoは進み具合を含むファイルを端末上に直接作成します。ファイルはあなたの手元に残り、誰にも送信されません。「コピーを復元」では、ファイルはあなたの端末だけが読み込みます。","任意のアカウントとオンラインバックアップ：アカウントを作成した場合（Google、またはメールアドレスとパスワード）、ログインと復元のためだけに、メールアドレスと進み具合のコピーを保管します。データはGoogle Firebase（Google Ireland Ltd.）が欧州連合内のサーバーで管理し、暗号化して送信され、あなたのアカウントでのみアクセスできます。ログイン処理（Firebase Authentication）は、EU-米国データプライバシーフレームワークに基づき、Google が米国で行います。法的根拠：あなたが求めたサービスの提供（GDPR第6条1項b）。バックアップはプロフィールを削除するまで保管されます。削除はいつでも「マイページ › アカウントとデータ › アカウントの管理 › プロフィールを削除」、またはページ tanettoapp.github.io/Tanetto/elimina-account.html からできます。アカウントとバックアップはすぐに削除されます。","購入：Tanetto PlusとTanìのパックの支払いは、すべてGoogle Playが処理します。カードや支払いの情報を私たちが受け取ることはありません。Googleがアプリに伝えるのは、ロックを解除するために、どの購入が有効かという情報だけです。","匿名の統計：アプリが役に立っているかを知るため、アプリが開かれた回数、翌日以降も使われているか、どの機能が使われているか（ショップやゲームなど）といった一部の操作を集計した形で数えています。また、匿名のエラー報告（エラーの種類だけで、あなたが書いた内容は含みません）を受け取ります。Cookieもプロフィールも使わない統計サービスGoatCounterを利用しています。運営はアイルランドからで、データは欧州連合内（フィンランドとドイツ）のサーバーに保存されます。集計を送るために端末はこのサービスに接続し、サービスは技術的にIPアドレスを受け取りますが、個人を特定できる形では保存しません。法的根拠：アプリを改善するための正当な利益（GDPR/英国GDPR第6条1項（f））。 統計は「マイページ › プライバシーと年齢」でいつでもオフにできます。デジタル同意年齢に達していない方や年齢を答えていない方は常にオフで、年齢の質問より前には何も数えません。","ホスティング：アプリのページは外部の事業者がホストしており、その事業者は自社のプライバシーポリシーに基づき、技術上・セキュリティ上の理由でIPアドレスを記録することがあります。","Cookie：Tanetto自体はトラッキング用のCookieを使いません。ローカルストレージはアプリを動かすため（と、統計を二重に数えないため）だけに使われ、厳密に必要なものです。Androidアプリでは、ちょっとしたごほうびをもらうために短い広告を見るかどうかを、自分で選べます。広告が勝手に表示されることはなく、あなたが選んだときだけ再生されます。","ごほうび付き動画（Androidアプリのみ）：広告はGoogle AdMob（Google Ireland Ltd.およびGoogle LLC）が提供しており、データは米国で処理されることもあります。Googleは、これらのデータを独立した管理者として、自社のプライバシーポリシー（https://policies.google.com/privacy）に基づいて取り扱います。米国への移転はEU-US Data Privacy Frameworkに基づいています。Tanetto自体があなたの広告IDを受け取ることはありません。法律で必要とされる地域（欧州経済領域、英国、スイス）では、広告を表示する前に、Googleの同意管理ツール（UMP）であなたの同意を求めます。同意は「マイページ › プライバシーと年齢 › 広告の設定」からいつでも変更できます。動画を準備して表示するために、Googleは端末の広告ID、IPアドレス、広告とのやり取りに関する情報を収集することがあります。目的は、広告の配信・効果測定・不正防止と、あなたの同意がある場合に限り広告のパーソナライズです。法的根拠：必要な場合はあなたの同意（GDPR第6条1項a）、および任意のごほうびの提供と不正防止のための正当な利益（GDPR第6条1項f）。広告IDはAndroidの設定でリセットまたは削除できます。Googleによるデータの使い方は、Googleの説明ページ（https://policies.google.com/technologies/partner-sites）で確認できます。動画は1日5本まで見られます。Tanetto Plusでは広告は一切表示されません。また Google は、同じ目的のために、広告サービスの診断情報（クラッシュやパフォーマンスなど）を収集し、IP アドレスからおおよその位置を推定することがあります。","保存期間：端末上のデータは、あなたが削除するまで残ります。「最初からやり直す」やブラウザのデータ消去で、いつでも削除できます。統計は集計された数値のみです。","あなたの権利：上記の連絡先に連絡することで、情報の提供、アクセス、訂正、削除、利用の制限を求めたり、取り扱いに異議を申し立てたりできます。また、データ保護の監督機関（日本では個人情報保護委員会）に苦情を申し立てることもできます。また、データを持ち運び可能な形式で受け取ることを求めたり、同意をいつでも撤回したりできます（撤回前の取り扱いには影響しません）。","米国の州のプライバシー権：カリフォルニア州など、消費者プライバシー法のある米国の州にお住まいの場合、私たちはあなたの個人情報を金銭と引き換えに販売していません。ただし、Google AdMob を通じて報酬動画を表示することは、これらの法律上、ターゲティング広告のための「共有」にあたる場合があります。Android の設定で広告 ID を削除またはリセットするか、アプリに表示される場合は「マイページ › プライバシーと年齢 › 広告の設定」から、これを拒否できます。上記の権利は、私たちに連絡することで行使できます。権利を行使しても、あなたの扱いが変わることはありません。","子どもと10代の方へ：Tanettoはすべての年齢の人のためのアプリです。最初に生まれた年と月をたずねますが、この情報はお使いの端末にだけ保存されます。13歳未満の方、または答えなかった方には、子ども向けのごほうび動画だけが表示され、パーソナライズされることはなく、広告IDも送信されません。お住まいの国のデジタル同意年齢（法律で低い年齢が定められていない場合は16歳）未満の方には、パーソナライズ広告は表示されず、アカウントによるオンラインバックアップも使えません。データは端末にだけ残り、ファイルにコピーを保存できます。パートナーとのチャットは用意された返事だけで、だれにも何も送信しません。Tanìはゲームのコインで、本物のお金ではありません。Tanetto PlusとTanìパックの支払いはGoogle Playのみです。米国では、Tanettoは13歳未満の子どもから個人情報を収集しません。技術的な識別子を受け取るのは、GoatCounter（数えるためだけのIPアドレスで、保存されません）とGoogle AdMob（子ども向けでパーソナライズされない広告で、広告IDは使いません）だけです。保護者の方は、ご質問やご依頼があればtanettoapp@gmail.comまでご連絡ください。","変更：このポリシーが変更された場合、最新版は常にこのページに掲載されます。最終更新日：2026/11/14。"],"terms":["Tanetto が安定して動き、少しずつ良くなるよう努めています。これは、消費者としてのあなたの法的な権利を制限するものではありません。","このアプリはバーチャルなパートナーといっしょに毎日の小さな習慣づくりを手伝うもので、医学的・心理的な助言の代わりにはなりません。","あなたが書いたものはあなたのものです。あなたの端末と、アカウントを使う場合はあなた専用のバックアップに保存されます。無理をせず、ゆったりとご利用ください。","有料機能：Tanettoは無料でダウンロードできます。Tanetto Plus（月額または年額の定期購入）とTanìのパックは任意で、Google Playを通じて購入します。支払い、更新、解約、返金はGoogle Playの規約に従って処理されます。定期購入はGoogle Play › 定期購入で解約するまで自動で更新されます。解約すると次回の更新が止まり、Plusはすでに支払った期間の終わりまで有効です。Tanìはアプリ内だけで使える仮想通貨で、金銭的な価値はなく、お金に交換することはできません。","未成年の方は、何かを購入する前に保護者の方に相談してください。","有料のデジタルコンテンツ（Tanetto Plus と Tanì）は購入後すぐに利用できます。返金は Google Play のポリシーと法律上の権利に従います。","Tanettoのイラスト、文章、音楽、コードは著作権で保護されており、許可なく複製・再利用することはできません。","この規約にはイタリア法が適用されます。消費者の方は、お住まいの国の法律による保護も受けられます。","ご質問は、プライバシーポリシーに記載の連絡先までお寄せください。"],"back":"Tanettoに戻る","del":"Tanettoのアカウントを削除"},"ko":{"lang":"한국어","locale":"ko-KR","privB":"개인정보 처리방침","termsB":"이용 약관","priv":["간단히 말하면: 친구, 목표, 일기는 이 휴대폰에만 남아요. 이름 입력은 선택이고, 채팅은 누구에게도 아무것도 보내지 않으며, 광고는 직접 고른 짧은 영상뿐이에요. 잘 모르겠는 부분이 있으면 믿을 수 있는 어른에게 물어보세요.","개인정보 처리자: Snugbloom Studio(이탈리아). 연락처: tanettoapp@gmail.com.","수집하는 데이터: Tanetto는 계정 없이도 작동해요. 이 경우 친구, 목표, 일기, 정원, 진행 상황은 이 기기에만 저장되며 누구에게도 전송되지 않아요. ‘흘려보내기’에 적은 생각은 아예 저장되지 않아요.","인사에 쓸 이름을 입력하면(선택 사항) 같은 방식으로 저장돼요. 기기 안에, 그리고 계정이 있다면 온라인 백업에도 저장돼요.","데이터 사본: ‘사본 저장’을 탭하면 Tanetto가 진행 상황이 담긴 파일을 기기에 직접 만들어요. 파일은 사용자에게만 남고 누구에게도 전송되지 않아요. ‘사본 복원’을 하면 파일은 사용자의 기기에서만 읽혀요.","선택 사항인 계정과 온라인 백업: 계정을 만들면(Google 또는 이메일과 비밀번호) 로그인과 복원을 위해서만 이메일 주소와 진행 상황 사본을 보관해요. 데이터는 Google Firebase(Google Ireland Ltd.)가 유럽연합 내 서버에 보관하고, 암호화되어 전송되며, 사용자의 계정으로만 접근할 수 있어요. 로그인 자체(Firebase Authentication)는 EU-미국 데이터 프라이버시 프레임워크에 따라 Google이 미국에서 처리해요. 법적 근거: 사용자가 요청한 서비스 제공(GDPR 제6조 1항 b). 백업은 프로필을 삭제할 때까지 보관돼요. 삭제는 언제든 프로필 › 계정 및 데이터 › 계정 관리 › 프로필 삭제, 또는 tanettoapp.github.io/Tanetto/elimina-account.html 페이지에서 할 수 있어요. 계정과 백업은 바로 삭제돼요.","구매: Tanetto Plus와 Tanì 패키지의 결제는 모두 Google Play가 처리해요. 카드나 결제 정보는 절대 받지 않아요. Google은 잠금 해제를 위해 어떤 구매가 활성 상태인지만 앱에 알려 줘요.","익명 통계: 앱이 유용한지 알기 위해 일부 동작의 횟수를 집계해요. 예를 들어 앱이 얼마나 자주 열리는지, 다음 날에도 사용되는지, 어떤 기능(상점이나 게임 등)이 쓰이는지 등이에요. 익명 오류 보고도 받아요(오류 종류만 받고, 사용자가 쓴 내용은 절대 받지 않아요). 쿠키와 프로필을 사용하지 않는 통계 서비스 GoatCounter를 이용해요. 이 서비스는 아일랜드에서 운영되며 데이터는 유럽연합(핀란드와 독일)의 서버에 저장돼요. 집계를 보내기 위해 기기가 이 서비스에 연결되며, 서비스는 기술적으로 IP 주소를 받지만 식별 가능한 방식으로 저장하지 않아요. 법적 근거: 앱 개선에 대한 정당한 이익(GDPR / UK GDPR 제6조 제1항 (f)호). 통계는 언제든지 프로필 › 개인정보와 나이에서 끌 수 있어요. 디지털 동의 연령이 안 됐거나 나이를 알려 주지 않았다면 항상 꺼져 있고, 나이 질문 전에는 아무것도 세지 않아요.","호스팅: 앱 페이지는 외부 제공업체가 호스팅하며, 해당 업체는 자체 개인정보 처리방침에 따라 기술 및 보안상의 이유로 IP 주소를 기록할 수 있어요.","쿠키: Tanetto 자체는 추적용 쿠키를 사용하지 않아요. 로컬 스토리지는 앱 작동을 위해서만(그리고 통계를 두 번 세지 않기 위해서만) 쓰이며 반드시 필요한 것이에요. Android 앱에서는 작은 보상을 받기 위해 짧은 광고를 볼지 직접 선택할 수 있어요. 광고가 저절로 나타나는 일은 없고, 사용자가 선택할 때만 재생돼요.","보상형 동영상(Android 앱 전용): 광고는 Google AdMob(Google Ireland Ltd. 및 Google LLC)이 제공하며, 데이터는 미국에서 처리될 수도 있어요. Google은 자체 개인정보처리방침(https://policies.google.com/privacy)에 따라 이 데이터를 독립적인 컨트롤러로서 처리해요. 미국으로의 이전은 EU-미국 데이터 프라이버시 프레임워크에 근거해요. Tanetto는 광고 ID를 절대 받지 않아요. 법에서 요구하는 지역(유럽경제지역, 영국, 스위스)에서는 광고를 보여 주기 전에 Google의 동의 관리 도구(UMP)로 동의를 요청해요. 동의는 언제든 프로필 › 개인정보와 나이 › 광고 선택에서 바꿀 수 있어요. 동영상을 준비하고 보여 주기 위해 Google은 기기의 광고 ID, IP 주소, 광고와의 상호작용에 관한 정보를 수집할 수 있어요. 목적은 광고 게재, 성과 측정, 부정 행위 방지이며, 사용자가 동의한 경우에만 광고 맞춤화에도 쓰여요. 법적 근거: 필요한 경우 사용자의 동의(GDPR 제6조 1항 a), 그리고 선택형 보상 제공과 부정 행위 방지에 대한 정당한 이익(GDPR 제6조 1항 f). 광고 ID는 Android 설정에서 재설정하거나 삭제할 수 있어요. Google이 이 데이터를 사용하는 방법은 Google 안내 페이지(https://policies.google.com/technologies/partner-sites)에서 확인할 수 있어요. 동영상은 하루 최대 5개까지 볼 수 있고, Tanetto Plus에서는 광고가 전혀 표시되지 않아요. 또한 Google은 같은 목적으로 광고 서비스의 진단 정보(예: 오류 및 성능)를 수집하고, IP 주소로 대략적인 위치를 추정할 수 있어요.","보관 기간: 기기의 데이터는 사용자가 삭제할 때까지 남아 있어요. ‘처음부터 다시’를 누르거나 브라우저 데이터를 삭제해서 언제든 지울 수 있어요. 통계는 집계된 숫자일 뿐이에요.","사용자의 권리: 위 연락처로 문의해서 정보 제공, 열람, 정정, 삭제, 처리 제한을 요청하고 처리에 반대할 수 있어요. 또한 개인정보 보호 감독기관(영국의 경우 ICO)에 민원을 제기할 수 있어요. 또한 데이터를 옮길 수 있는 형식으로 받아 보도록 요청하고, 언제든 동의를 철회할 수 있어요. 철회 전에 이루어진 처리에는 영향이 없어요.","미국 주별 개인정보 보호 권리: 캘리포니아처럼 소비자 개인정보 보호법이 있는 미국 주에 살고 있다면, 저희는 개인정보를 돈을 받고 판매하지 않아요. 다만 Google AdMob으로 보상형 동영상을 보여 주는 것은 해당 법에 따라 맞춤 광고를 위한 '공유'로 볼 수 있어요. Android 설정에서 광고 ID를 삭제하거나 재설정하거나, 앱에 표시되는 경우 프로필 › 개인정보와 나이 › 광고 선택에서 거부할 수 있어요. 위에 설명한 권리는 저희에게 연락해서 행사할 수 있어요. 권리를 행사해도 불이익은 전혀 없어요.","어린이와 청소년: Tanetto는 모든 나이를 위한 앱이에요. 처음에 태어난 연도와 월을 물어보며, 이 정보는 기기에만 남아요. 만 13세 미만이거나 말하고 싶지 않다고 하면 어린이에게 맞는 보상 영상만 보이고, 맞춤 광고는 없으며 광고 ID도 보내지 않아요. 살고 있는 나라의 디지털 동의 연령(법에 더 낮은 나이가 없으면 16세) 미만이면 광고는 절대 맞춤이 아니고, 계정을 쓰는 온라인 백업도 쓸 수 없어요. 데이터는 기기에만 남고, 파일로 사본을 저장할 수 있어요. 친구와의 채팅은 미리 써 둔 답만 있고 누구에게도 아무것도 보내지 않아요. Tanì는 게임 속 동전이고 진짜 돈이 아니에요. Tanetto Plus와 Tanì 패키지는 Google Play로만 결제해요. 미국에서 Tanetto는 만 13세 미만 어린이의 개인정보를 수집하지 않아요. 기술적인 식별 정보를 받는 서비스는 GoatCounter(집계용 IP 주소만, 저장하지 않음)와 Google AdMob(어린이에게 맞는 비맞춤형 광고, 광고 ID 없이)뿐이에요. 부모님과 보호자는 궁금한 점이나 요청이 있으면 tanettoapp@gmail.com로 연락해 주세요.","변경: 이 방침이 바뀌면 최신 버전은 항상 이 페이지에 있어요. 최종 업데이트: 2026. 11. 14."],"terms":["Tanetto가 잘 작동하고 꾸준히 나아지도록 노력해요. 이것이 소비자로서의 법적 권리를 제한하지는 않아요.","이 앱은 가상 친구와 함께 작은 생활 습관을 만들도록 돕는 앱이며, 의학적 또는 심리적 조언을 대신하지 않아요.","사용자가 쓴 내용은 사용자의 것이에요. 기기에, 그리고 계정을 쓰면 개인 백업에 저장돼요. 무리하지 말고 편안하게 사용하세요.","유료 기능: Tanetto는 무료로 다운로드할 수 있어요. Tanetto Plus(월간 또는 연간 구독)와 Tanì 패키지는 선택 사항이며 Google Play를 통해 구매해요. 결제, 갱신, 해지, 환불은 Google Play가 자체 약관에 따라 처리해요. 구독은 Google Play › 구독에서 해지할 때까지 자동으로 갱신돼요. 해지하면 다음 갱신이 멈추고, Plus는 이미 결제한 기간이 끝날 때까지 유지돼요. Tanì는 앱 안에서만 쓰는 가상 화폐로, 금전적 가치가 없고 돈으로 바꿀 수 없어요.","미성년자라면 무언가를 구매하기 전에 보호자에게 먼저 물어보세요.","유료 디지털 콘텐츠(Tanetto Plus와 Tanì)는 구매하는 즉시 이용할 수 있어요. 환불은 Google Play 정책과 법적 권리에 따라요.","Tanetto의 일러스트, 글, 음악, 코드는 저작권으로 보호되며 허가 없이 복제하거나 재사용할 수 없어요.","이 약관에는 이탈리아 법이 적용돼요. 소비자라면 거주하는 나라의 법이 주는 보호도 그대로 받아요.","궁금한 점은 개인정보 처리방침에 적힌 연락처로 문의하세요."],"back":"Tanetto로 돌아가기","del":"Tanetto 계정 삭제"},"zh":{"lang":"简体中文","locale":"zh-CN","privB":"隐私政策","termsB":"使用条款","priv":["简单来说：你的小伙伴、目标和日记都留在这台手机上。填写名字是可选的，聊天不会向任何人发送任何内容，唯一的广告是你自己选择观看的短视频。如果有不明白的地方，可以问问你信任的大人。","数据控制者：Snugbloom Studio（意大利）。联系方式：tanettoapp@gmail.com。","收集哪些数据：Tanetto 不登录也能使用。这种情况下，你的小伙伴、目标、日记、花园和进度只保存在这台设备上，不会发送给任何人。在“放下吧”中写下的念头完全不会被保存。","如果你填写了用于问候的名字（可选），它也会以同样的方式保存：保存在你的设备上；如果你有账号，也会保存在在线备份中。","数据副本：如果你点“保存副本”，Tanetto 会直接在你的设备上生成一个包含你进度的文件。文件由你保管，不会发送给任何人。使用“恢复副本”时，文件只会由你的设备读取。","可选账号与网上备份：如果你选择创建账号（使用 Google 或邮箱和密码），我们会保存你的邮箱地址和一份进度副本，仅用于让你登录和恢复进度。数据由 Google Firebase（Google Ireland Ltd.）存放在欧盟境内的服务器上，以加密方式传输，只有用你的账号才能访问。登录本身（Firebase Authentication）由 Google 在美国处理，依据为欧盟-美国数据隐私框架。法律依据：提供你所请求的服务（GDPR 第 6 条第 1 款 b 项）。备份会一直保留，直到你删除个人资料：你可以随时在“我的 › 账号与数据 › 管理账号 › 删除个人资料”中删除，或在页面 tanettoapp.github.io/Tanetto/elimina-account.html 上删除。账号和备份会立即删除。","购买：Tanetto Plus 和 Tanì 礼包的付款完全由 Google Play 处理。我们绝不会收到你的银行卡或付款信息：Google 只会告诉应用哪些购买有效，以便解锁。","匿名统计：为了了解应用是否有用，我们会以汇总形式统计部分操作，例如应用被打开的频率、之后几天是否还在使用，或使用了哪些功能（比如商店或小游戏），我们还会收到匿名的错误报告（只有错误类型，绝不包含你写的内容）。我们使用 GoatCounter，这是一项不使用 Cookie、不建立用户画像的统计服务，由爱尔兰运营，数据存放在欧盟境内（芬兰和德国）的服务器上。为了发送统计数据，设备会连接到该服务，该服务在技术上会接收到 IP 地址，但不会以可识别身份的方式存储。法律依据：改进应用的正当利益（GDPR / 英国 GDPR 第 6(1)(f) 条）。 你可以随时在“我的 › 隐私与年龄”中关闭统计。对于未达到数字同意年龄或未提供年龄的用户，统计始终关闭；在询问年龄之前，不会统计任何内容。","托管：应用的页面由外部服务商托管，该服务商可能出于技术和安全原因，根据其自身的隐私政策记录 IP 地址。","Cookie：Tanetto 本身不使用任何追踪类 Cookie。本地存储仅用于让应用正常运行（以及避免重复统计），是严格必要的。在 Android 应用中，你可以自己选择观看简短的广告来获得小奖励：广告绝不会自行弹出，只有在你选择观看时才会播放。","奖励视频（仅限 Android 应用）：广告由 Google AdMob（Google Ireland Ltd. 和 Google LLC）提供，数据也可能在美国处理。Google 作为独立的数据控制者，按照其自身的隐私权政策（https://policies.google.com/privacy）处理这些数据；向美国的传输以《欧盟-美国数据隐私框架》为依据。Tanetto 本身绝不会收到你的广告 ID。在法律有要求的地区（欧洲经济区、英国和瑞士），在展示任何广告之前，我们会通过 Google 的同意管理工具（UMP）征求你的同意；你可以随时在“我的 › 隐私与年龄 › 广告选择”中更改。为了准备和播放视频，Google 可能会收集设备的广告 ID、IP 地址以及你与广告互动的信息，用于投放和衡量广告、防止欺诈，并且仅在你同意的情况下用于个性化广告。法律依据：在需要时为你的同意（GDPR 第 6 条第 1 款 a 项），以及提供可选奖励和防止欺诈的正当利益（GDPR 第 6 条第 1 款 f 项）。你可以在 Android 设置中重置或删除广告 ID。关于 Google 如何使用这些数据，请参阅 Google 的说明页面（https://policies.google.com/technologies/partner-sites）。你每天最多可以观看 5 个视频；使用 Tanetto Plus 则完全不会看到广告。Google 还可能出于相同目的收集广告服务的诊断信息（例如崩溃和性能数据），并根据你的 IP 地址估算大致位置。","保存期限：设备上的数据会一直保留，直到你删除为止。你可以随时通过“重新开始”或清除浏览器数据来删除。统计数据只是汇总后的数字。","你的权利：你可以通过上述联系方式提出请求，要求获取信息、访问、更正、删除和限制处理你的数据，也可以反对数据处理。你还可以向你所在地的数据保护机构投诉（在英国为 ICO）。你也可以要求以可携带的格式获取你的数据副本，并可随时撤回同意，但这不影响撤回之前的处理。","美国各州隐私权利：如果你居住在设有消费者隐私法的美国州（例如加利福尼亚州），我们不会为换取金钱而出售你的个人信息。不过，根据这些法律，通过 Google AdMob 展示奖励视频可能被视为出于定向广告目的的“共享”。你可以在 Android 设置中删除或重置广告 ID，或在应用显示该选项时前往“我的 › 隐私与年龄 › 广告选择”拒绝这种共享；也可以写信给我们，行使上文所述的权利。行使这些权利不会让你受到任何不同对待。","儿童和青少年：Tanetto 适合所有年龄的人。第一次使用时，我们会询问你出生的年份和月份，这些信息只保存在你的设备上。未满 13 岁，或你选择不告诉我们时，只会显示适合儿童的奖励视频，绝不个性化，也不会发送广告 ID。未满你所在国家的数字同意年龄（法律未规定更低年龄时为 16 岁）时，广告绝不个性化，也不能使用账号在线备份：数据只保存在设备上，你可以把副本保存成文件。和小伙伴的聊天只有预先写好的回复，不会向任何人发送任何内容。Tanì 是游戏里的金币，不是真钱；Tanetto Plus 和 Tanì 礼包只能通过 Google Play 付款。在美国，Tanetto 不会收集 13 岁以下儿童的个人信息：只有 GoatCounter（仅为计数而接收的 IP 地址，不会保存）和 Google AdMob（适合儿童、非个性化、不使用广告 ID 的广告）会收到技术标识。家长和监护人如有任何问题或请求，可以写信到 tanettoapp@gmail.com。","变更：如果本政策有变更，更新后的版本将始终发布在本页面。最后更新：2026/11/14。"],"terms":["我们努力让 Tanetto 稳定运行并不断改进；这不会限制你作为消费者依法享有的权利。","本应用借助一个虚拟小伙伴帮助你养成日常小习惯，不能代替医疗或心理方面的建议。","你写下的内容属于你：保存在你的设备上；如果你使用账号，也保存在你的个人备份中。请轻松地使用本应用，不要勉强自己。","付费功能：Tanetto 可免费下载。Tanetto Plus（按月或按年订阅）和 Tanì 礼包是可选的，通过 Google Play 购买，付款、续订、取消和退款均由 Google Play 按其条款处理。订阅会自动续订，直到你在 Google Play › 订阅中取消：取消后将停止下一次续订，Plus 会保持有效直到已付费期间结束。Tanì 是只能在应用内使用的虚拟货币：没有货币价值，不能兑换成钱。","如果你是未成年人，购买任何东西之前请先询问父母或监护人。","付费数字内容（Tanetto Plus 和 Tanì）在购买后立即可用；退款依照 Google Play 的政策和你的法定权利处理。","Tanetto 的插图、文字、音乐和代码受版权保护，未经许可不得复制或再次使用。","本条款受意大利法律管辖；如果你是消费者，你仍享有居住国法律提供的保护。","如有任何问题，可以通过隐私政策中列出的联系方式与我们联系。"],"back":"返回 Tanetto","del":"删除你的 Tanetto 账号"},"zht":{"lang":"繁體中文","locale":"zh-TW","privB":"隱私權政策","termsB":"使用條款","priv":["簡單來說：你的小夥伴、目標和日記都留在這支手機上。填寫名字是選擇性的，聊天不會傳送任何內容給任何人，唯一的廣告是你自己選擇觀看的短片。如果有不明白的地方，可以問問你信任的大人。","資料控管者：Snugbloom Studio（義大利）。聯絡方式：tanettoapp@gmail.com。","收集哪些資料：Tanetto 不登入也能使用。這種情況下，你的小夥伴、目標、日記、花園和進度只會儲存在這台裝置上，不會傳送給任何人。在「放下吧」中寫下的念頭完全不會被儲存。","如果你填寫了用於問候的名字（可選），它也會以同樣的方式儲存：儲存在你的裝置上；如果你有帳號，也會儲存在線上備份中。","資料備份：如果你點「儲存備份」，Tanetto 會直接在你的裝置上建立一個包含你進度的檔案。這個檔案由你保管，不會傳送給任何人。使用「還原備份」時，檔案只會由你的裝置讀取。","選用帳號與網路備份：如果你選擇建立帳號（使用 Google 或電子郵件和密碼），我們會保存你的電子郵件地址和一份進度副本，僅用於讓你登入並還原進度。資料由 Google Firebase（Google Ireland Ltd.）存放在歐盟境內的伺服器上，以加密方式傳輸，只有用你的帳號才能存取。登入本身（Firebase Authentication）由 Google 在美國處理，依據為歐盟-美國資料隱私框架。法律依據：提供你所要求的服務（GDPR 第 6 條第 1 項 b 款）。備份會一直保留，直到你刪除個人檔案：你隨時可以在「我的 › 帳號與資料 › 管理帳號 › 刪除個人檔案」刪除，或在頁面 tanettoapp.github.io/Tanetto/elimina-account.html 上刪除。帳號和備份會立即刪除。","購買：Tanetto Plus 和 Tanì 禮包的付款完全由 Google Play 處理。我們絕不會收到你的信用卡或付款資料：Google 只會告訴 App 哪些購買有效，以便解鎖。","匿名統計：為了了解這個 App 是否有用，我們會以彙總形式統計部分操作，例如 App 被開啟的頻率、之後幾天是否繼續使用，或使用了哪些功能（像是商店或小遊戲），我們也會收到匿名的錯誤報告（只有錯誤類型，絕不包含你寫的內容）。我們使用 GoatCounter，這是一個不使用 Cookie、不建立個人檔案的統計服務，由愛爾蘭營運，資料存放在歐盟境內（芬蘭和德國）的伺服器上。為了傳送統計資料，裝置會連線到該服務，服務在技術上會接收到 IP 位址，但不會以可識別個人的方式儲存。法律依據：改善 App 的正當利益（GDPR / 英國 GDPR 第 6 條第 1 項第 f 款）。 你可以隨時在「我的 › 隱私與年齡」中關閉統計。對於未達數位同意年齡或未提供年齡的使用者，統計一律關閉；在詢問年齡之前，不會統計任何內容。","主機代管：App 的網頁由外部服務商代管，該服務商可能基於技術和安全理由，依其自身的隱私權政策記錄 IP 位址。","Cookie：Tanetto 本身不使用任何追蹤 Cookie。本機儲存空間僅用於讓 App 正常運作（以及避免重複統計），屬於絕對必要的用途。在 Android App 中，你可以自己選擇觀看簡短的廣告來獲得小獎勵：廣告絕不會自行跳出，只有在你選擇觀看時才會播放。","獎勵影片（僅限 Android App）：廣告由 Google AdMob（Google Ireland Ltd. 和 Google LLC）提供，資料也可能在美國處理。Google 以獨立資料控管者的身分，依其自身的隱私權政策（https://policies.google.com/privacy）處理這些資料；傳輸至美國係以「歐盟－美國資料隱私框架」為依據。Tanetto 本身絕不會收到你的廣告 ID。在法律有要求的地區（歐洲經濟區、英國和瑞士），在顯示任何廣告之前，我們會透過 Google 的同意管理工具（UMP）徵求你的同意；你隨時可以在「我的 › 隱私與年齡 › 廣告選擇」中變更。為了準備和播放影片，Google 可能會收集裝置的廣告 ID、IP 位址，以及你與廣告互動的資訊，用於放送和評估廣告、防止詐欺，並且僅在你同意的情況下用於個人化廣告。法律依據：在需要時為你的同意（GDPR 第 6 條第 1 項 a 款），以及提供選用獎勵和防止詐欺的正當利益（GDPR 第 6 條第 1 項 f 款）。你可以在 Android 設定中重設或刪除廣告 ID。關於 Google 如何使用這些資料，請參閱 Google 的說明頁面（https://policies.google.com/technologies/partner-sites）。你每天最多可以觀看 5 部影片；使用 Tanetto Plus 則完全不會看到廣告。Google 也可能基於相同目的收集廣告服務的診斷資訊（例如當機和效能資料），並根據你的 IP 位址推估大致位置。","保存期限：裝置上的資料會一直保留，直到你刪除為止。你隨時可以透過「重新開始」或清除瀏覽器資料來刪除。統計資料僅為彙總數字。","你的權利：你可以寫信至上述聯絡方式，要求取得資訊、查閱、更正、刪除及限制處理你的資料，並可反對資料處理。你也可以向資料保護主管機關提出申訴（在英國為 ICO）。你也可以要求以可攜的格式取得你的資料副本，並可隨時撤回同意，但這不影響撤回之前的處理。","美國各州隱私權利：如果你居住在設有消費者隱私法的美國州（例如加州），我們不會為換取金錢而出售你的個人資料。不過，依照這些法律，透過 Google AdMob 顯示獎勵影片可能被視為基於目標式廣告目的的「分享」。你可以在 Android 設定中刪除或重設廣告 ID，或在應用程式顯示該選項時前往「我的 › 隱私與年齡 › 廣告選擇」拒絕這種分享；也可以寫信給我們，行使上文所述的權利。行使這些權利不會讓你受到任何差別待遇。","兒童與青少年：Tanetto 適合所有年齡的人。第一次使用時，我們會詢問你出生的年份和月份，這些資訊只保存在你的裝置上。未滿 13 歲，或你選擇不告訴我們時，只會顯示適合兒童的獎勵影片，絕不個人化，也不會傳送廣告 ID。未滿你所在國家的數位同意年齡（法律未規定更低年齡時為 16 歲）時，廣告絕不個人化，也不能使用帳號線上備份：資料只保存在裝置上，你可以把副本存成檔案。和小夥伴的聊天只有預先寫好的回覆，不會傳送任何內容給任何人。Tanì 是遊戲裡的金幣，不是真的錢；Tanetto Plus 和 Tanì 禮包只能透過 Google Play 付款。在美國，Tanetto 不會蒐集 13 歲以下兒童的個人資訊：只有 GoatCounter（僅為計數而接收的 IP 位址，不會保存）和 Google AdMob（適合兒童、非個人化、不使用廣告 ID 的廣告）會收到技術識別碼。家長和監護人如有任何問題或請求，可以寫信到 tanettoapp@gmail.com。","變更：如果本政策有所變更，更新後的版本將一律公布在此頁面。最後更新日期：2026/11/14。"],"terms":["我們努力讓 Tanetto 穩定運作並持續改進；這不會限制你身為消費者依法享有的權利。","這個 App 透過虛擬小夥伴幫助你養成每天的小習慣，不能取代醫療或心理專業建議。","你寫下的內容屬於你：保留在你的裝置上；如果你使用帳號，也會保留在你的個人備份中。請放輕鬆使用這個 App，不要勉強自己。","付費功能：Tanetto 可免費下載。Tanetto Plus（月訂或年訂）和 Tanì 禮包為選用項目，透過 Google Play 購買，付款、續訂、取消和退款皆由 Google Play 依其條款處理。訂閱會自動續訂，直到你在 Google Play › 訂閱中取消：取消後會停止下一次續訂，Plus 會維持有效到已付費期間結束。Tanì 是只能在 App 內使用的虛擬貨幣：沒有金錢價值，也不能兌換成錢。","如果你未成年，購買任何東西前請先詢問父母或監護人。","付費數位內容（Tanetto Plus 和 Tanì）在購買後立即可用；退款依照 Google Play 的政策和你的法定權利處理。","Tanetto 的插圖、文字、音樂和程式碼均受著作權保護，未經許可不得複製或重複使用。","本條款受義大利法律管轄；如果你是消費者，你仍享有居住國法律提供的保護。","如有任何問題，你可以寫信至隱私權政策中列出的聯絡方式。"],"back":"回到 Tanetto","del":"刪除你的 Tanetto 帳號"},"ru":{"lang":"Русский","locale":"ru-RU","privB":"Политика конфиденциальности","termsB":"Условия использования","priv":["Коротко: питомец, цели и дневник остаются на этом телефоне. Писать своё имя не обязательно, чат никому ничего не отправляет, а реклама показывается только в коротких видео и только по твоему выбору. Если что-то непонятно, спроси взрослого, которому доверяешь.","Ответственный за обработку данных: Snugbloom Studio, Италия. Контакт: tanettoapp@gmail.com.","Какие данные: Tanetto работает и без аккаунта. В этом случае питомец, цели, дневник, сад и прогресс сохраняются только в памяти этого устройства и никому не передаются. Мысли, записанные в «Отпусти», не сохраняются вообще.","Если ты укажешь имя для приветствия (это необязательно), оно хранится так же: на твоём устройстве и, если у тебя есть аккаунт, в онлайн-копии.","Копия данных: если нажать «Сохранить копию», Tanetto создаёт файл с твоим прогрессом прямо на твоём устройстве. Файл остаётся у тебя и никому не отправляется. При использовании «Восстановить копию» файл читается только твоим устройством.","Необязательный аккаунт и онлайн-копия: если ты решишь создать аккаунт (через Google или с e-mail и паролем), мы храним твой адрес e-mail и копию твоего прогресса — только чтобы ты мог войти и восстановить его. Данные хранит Google Firebase (Google Ireland Ltd.) на серверах в Европейском союзе, они передаются в зашифрованном виде и доступны только через твой аккаунт. Сам вход (Firebase Authentication) обрабатывает Google в США в рамках EU-US Data Privacy Framework. Правовое основание: оказание услуги, которую ты запросил (ст. 6(1)(b) GDPR). Копия хранится, пока ты не удалишь профиль: это можно сделать в любой момент в «Профиль» › «Аккаунт и данные» › «Управление аккаунтом» › «Удалить профиль» или на странице tanettoapp.github.io/Tanetto/elimina-account.html. Аккаунт и копия удаляются сразу.","Покупки: оплату Tanetto Plus и наборов Tanì полностью обрабатывает Google Play. Мы никогда не получаем данные твоей карты или платежа: Google сообщает приложению только о том, какие покупки активны, чтобы их разблокировать.","Анонимная статистика: чтобы понять, полезно ли приложение, мы подсчитываем некоторые действия в обобщённом виде, например как часто открывается приложение, используется ли оно в последующие дни или какие разделы открывают (например, магазин или игры), а также получаем анонимные отчёты об ошибках (только вид ошибки, никогда не то, что ты пишешь). Мы используем GoatCounter, сервис статистики без cookie и без профилей; он работает из Ирландии, а данные хранятся на серверах в Европейском союзе (Финляндия и Германия). Чтобы передать подсчёт, устройство подключается к сервису, который технически получает IP-адрес, но не хранит его в виде, позволяющем установить личность. Правовое основание: законный интерес в улучшении приложения (статья 6(1)(f) GDPR / UK GDPR). Статистику можно выключить в любой момент: «Профиль» › «Приватность и возраст». Для тех, кто младше возраста цифрового согласия или не указал возраст, она всегда выключена, а до вопроса о возрасте ничего не считается.","Хостинг: страницы приложения размещены у внешнего провайдера, который может записывать IP-адрес в технических целях и в целях безопасности в соответствии со своей политикой конфиденциальности.","Cookie: Tanetto само не использует cookie для отслеживания. Локальное хранилище используется только для работы приложения (и чтобы не считать статистику дважды) и является

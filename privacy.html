 maken tegen de verwerking, door te schrijven naar het contactadres hierboven. Je kunt ook een klacht indienen bij je toezichthouder voor gegevensbescherming (in Nederland de Autoriteit Persoonsgegevens). Je kunt ook een kopie van je gegevens in een overdraagbaar formaat vragen en je toestemming op elk moment intrekken; dat heeft geen gevolgen voor wat daarvoor is gebeurd.","Privacyrechten in Amerikaanse staten: als je in een Amerikaanse staat woont met een privacywet voor consumenten, zoals Californië, dan verkopen wij je persoonsgegevens niet voor geld. Het tonen van video's met beloning via Google AdMob kan volgens die wetten wel gelden als ‘delen’ voor gerichte advertenties. Je kunt daar bezwaar tegen maken door je advertentie-ID te verwijderen of te resetten in de Android-instellingen, of via Profiel › Advertentiekeuzes als de app die optie toont. De rechten hierboven oefen je uit door ons te schrijven. Dat verandert nooit hoe we je behandelen.","Leeftijd: Tanetto is bedoeld voor mensen van 16 jaar en ouder.","Wijzigingen: als dit beleid verandert, staat de bijgewerkte versie altijd op deze pagina. Laatst bijgewerkt: 11-11-2026."],"terms":["Tanetto wordt aangeboden zoals het is, zonder garantie op ononderbroken werking, en kan in de loop van de tijd veranderen.","De app helpt je kleine dagelijkse gewoontes op te bouwen met een virtueel maatje en vervangt geen medisch of psychologisch advies.","Wat je schrijft is van jou: op je apparaat en, als je een account gebruikt, in je persoonlijke back-up. Gebruik de app rustig, zonder jezelf onder druk te zetten.","Betaalde functies: Tanetto is gratis. Tanetto Plus (maand- of jaarabonnement) en Tanì-pakketten zijn optioneel en koop je via Google Play, dat betaling, verlengingen, opzeggingen en terugbetalingen regelt volgens de eigen voorwaarden. Abonnementen worden automatisch verlengd tot je ze opzegt via Google Play › Abonnementen: opzeggen stopt de volgende verlenging en Plus blijft actief tot het einde van de al betaalde periode. Tanì zijn een virtuele munt die je alleen in de app gebruikt: ze hebben geen geldwaarde en kunnen niet worden ingewisseld voor geld.","De illustraties, teksten, muziek en code van Tanetto zijn auteursrechtelijk beschermd en mogen niet zonder toestemming worden gekopieerd of hergebruikt.","Voor vragen kun je schrijven naar het contactadres in het privacybeleid."],"back":"Terug naar Tanetto","del":"Je Tanetto-account verwijderen"},"tr":{"lang":"Türkçe","locale":"tr-TR","privB":"Gizlilik politikası","termsB":"Kullanım koşulları","priv":["Veri sorumlusu: Snugbloom Studio, İtalya'da yaşayan bireysel bir geliştiricinin ticari adıdır. Geliştiricinin tam adı ve posta adresi, Tanetto'nun Google Play sayfasındaki geliştirici bilgilerinde yer alır. İletişim: tanettoapp@gmail.com.","Hangi veriler: Tanetto hesap olmadan da çalışır. Bu durumda arkadaşın, hedeflerin, günlüğün, bahçen ve ilerlemen yalnızca bu cihazın belleğine kaydedilir ve kimseye gönderilmez. “Bırak gitsin” bölümüne yazılan düşünceler hiç kaydedilmez.","Selamlama için adını yazarsan (isteğe bağlıdır), aynı şekilde saklanır: cihazında ve hesabın varsa çevrimiçi yedekte.","Verilerinin kopyası: “Kopya kaydet”e dokunursan Tanetto ilerlemeni içeren bir dosyayı doğrudan cihazında oluşturur. Dosya sende kalır ve kimseye gönderilmez. “Kopyayı geri yükle” ile dosya yalnızca cihazın tarafından okunur.","İsteğe bağlı hesap ve çevrim içi yedek: Hesap oluşturmayı seçersen (Google ile ya da e-posta ve şifreyle), yalnızca giriş yapabilmen ve ilerlemeni geri yükleyebilmen için e-posta adresini ve ilerlemenin bir kopyasını saklarız. Veriler Google Firebase (Google Ireland Ltd.) tarafından Avrupa Birliği'ndeki sunucularda tutulur, şifreli olarak iletilir ve yalnızca senin hesabınla erişilebilir. Girişin kendisi (Firebase Authentication) ise AB-ABD Veri Gizliliği Çerçevesi kapsamında Google tarafından ABD'de yürütülür. Hukuki dayanak: talep ettiğin hizmetin sunulması (GDPR md. 6/1-b). Yedek, profilini silene kadar saklanır: bunu istediğin zaman Profil › Hesap ve yedek › Hesabı yönet › Profili sil yoluyla ya da tanettoapp.github.io/Tanetto/elimina-account.html sayfasından yapabilirsin. Hesap ve yedek hemen silinir.","Satın alımlar: Tanetto Plus ve Tanì paketlerinin ödemeleri tamamen Google Play tarafından yapılır. Kart veya ödeme bilgilerini asla almayız: Google uygulamaya yalnızca hangi satın alımların etkin olduğunu, kilitleri açmak için bildirir.","Anonim istatistikler: uygulamanın işe yarayıp yaramadığını anlamak için bazı işlemleri toplu olarak sayarız; örneğin uygulamanın ne sıklıkla açıldığını ya da sonraki günlerde kullanılıp kullanılmadığını. Çerez ve profil kullanmayan bir istatistik hizmeti olan GoatCounter'ı kullanırız. Sayımı göndermek için cihaz bu hizmete bağlanır; hizmet teknik olarak IP adresini alır ancak onu kimliği belirlenebilir şekilde saklamaz. Hukuki dayanak: uygulamayı geliştirmeye yönelik meşru menfaat (GDPR / UK GDPR madde 6(1)(f)).","Barındırma: uygulamanın sayfaları harici bir sağlayıcı tarafından barındırılır; bu sağlayıcı teknik ve güvenlik nedenleriyle, kendi gizlilik politikası çerçevesinde IP adresini kaydedebilir.","Çerezler: Tanetto'nun kendisi takip çerezi kullanmaz. Yerel depolama yalnızca uygulamanın çalışması için kullanılır ve kesinlikle gereklidir. Android uygulamasında, küçük bir ödül kazanmak için istersen kısa reklamlar izleyebilirsin: reklamlar asla kendiliğinden çıkmaz, yalnızca sen izlemeyi seçtiğinde açılır.","Ödüllü videolar (yalnızca Android uygulaması): reklamlar Google AdMob (Google Ireland Ltd. ve Google LLC) tarafından sağlanır; veriler Amerika Birleşik Devletleri'nde de işlenebilir. Google bu verileri kendi gizlilik politikasına (https://policies.google.com/privacy) göre bağımsız veri sorumlusu olarak işler; ABD'ye aktarımlar AB-ABD Veri Gizliliği Çerçevesi'ne dayanır. Tanetto'nun kendisi reklam kimliğini asla almaz. Yasanın gerektirdiği yerlerde (Avrupa Ekonomik Alanı, Birleşik Krallık ve İsviçre), herhangi bir reklam gösterilmeden önce Google'ın izin yönetimi aracıyla (UMP) iznini isteriz; bu izni istediğin zaman Profil › Reklam tercihleri bölümünden değiştirebilirsin. Videoları hazırlamak ve göstermek için Google, cihazının reklam kimliğini, IP adresini ve reklamlarla etkileşimine ilişkin bilgileri toplayabilir; bunu reklamları sunmak, ölçmek ve dolandırıcılığı önlemek için, yalnızca iznin varsa da reklamları kişiselleştirmek için yapar. Hukuki dayanak: gerektiği durumlarda iznin (GDPR md. 6/1-a) ve isteğe bağlı ödüller sunma ile dolandırıcılığı önlemeye yönelik meşru menfaat (GDPR md. 6/1-f). Reklam kimliğini Android ayarlarından sıfırlayabilir veya silebilirsin. Google'ın bu verileri nasıl kullandığı: https://policies.google.com/technologies/partner-sites. Günde en fazla 5 video izleyebilirsin; Tanetto Plus ile hiç reklam görmezsin. Google ayrıca aynı amaçlarla reklam hizmetine ait tanılama verilerini (örneğin çökmeler ve performans) toplayabilir ve IP adresinden yaklaşık konumunu tahmin edebilir.","Saklama süresi: cihazdaki veriler sen silene kadar kalır. Bunu istediğin zaman “Baştan başla” ile ya da tarayıcı verilerini silerek yapabilirsin. İstatistikler yalnızca toplu sayılardan oluşur.","Hakların: yukarıdaki iletişim adresine yazarak bilgi, erişim, düzeltme, silme ve kısıtlama talep edebilir, işlemeye itiraz edebilirsin. Ayrıca veri koruma otoritesine şikâyette bulunabilirsin: Türkiye'de bu, Kişisel Verileri Koruma Kurumu'dur (KVKK). Ayrıca verilerinin taşınabilir bir biçimde bir kopyasını isteyebilir ve onayını istediğin zaman geri çekebilirsin; bu, geri çekmeden önceki işlemleri etkilemez.","ABD eyaletlerinde gizlilik hakları: Kaliforniya gibi tüketici gizliliği yasası olan bir ABD eyaletinde yaşıyorsan, kişisel verilerini para karşılığında satmadığımızı bilmeni isteriz. Ancak Google AdMob aracılığıyla ödüllü videolar göstermek, bu yasalara göre hedefli reklam amacıyla “paylaşım” sayılabilir. Android ayarlarında reklam kimliğini silerek veya sıfırlayarak ya da uygulama gösterdiğinde Profil › Reklam tercihleri bölümünden buna itiraz edebilirsin. Yukarıda anlatılan hakları bize yazarak kullanabilirsin. Bu hakları kullanman sana nasıl davrandığımızı asla değiştirmez.","Yaş: Tanetto 16 yaş ve üzeri kişiler içindir.","Değişiklikler: bu politika değişirse güncel sürüm her zaman bu sayfada olacaktır. Son güncelleme: 11.11.2026."],"terms":["Tanetto olduğu gibi sunulur, kesintisiz çalışma garantisi yoktur ve zamanla değişebilir.","Uygulama, sanal bir arkadaşla küçük günlük alışkanlıklar edinmene yardımcı olur ve tıbbi ya da psikolojik danışmanlığın yerini tutmaz.","Yazdıkların sana aittir: cihazında ve hesap kullanıyorsan kişisel yedeğinde. Uygulamayı kendini zorlamadan, gönül rahatlığıyla kullan.","Ücretli özellikler: Tanetto ücretsizdir. Tanetto Plus (aylık veya yıllık abonelik) ve Tanì paketleri isteğe bağlıdır ve Google Play üzerinden satın alınır; ödeme, yenileme, iptal ve iadeleri Google Play kendi koşullarına göre yönetir. Abonelikler, Google Play › Abonelikler'den iptal edene kadar otomatik yenilenir: iptal bir sonraki yenilemeyi durdurur ve Plus, ödenmiş dönemin sonuna kadar etkin kalır. Tanì yalnızca uygulama içinde kullanılan sanal bir paradır: parasal değeri yoktur ve paraya çevrilemez.","Tanetto'nun çizimleri, metinleri, müzikleri ve kodu telif hakkıyla korunur; izin alınmadan kopyalanamaz ya da yeniden kullanılamaz.","Her türlü sorun için gizlilik politikasında belirtilen iletişim adresine yazabilirsin."],"back":"Tanetto'ya dön","del":"Tanetto hesabını sil"}};

const pick = () => { const q = (/[?&]lang=([a-z]+)/.exec(location.search) || [])[1]; if (q && Object.prototype.hasOwnProperty.call(S, q)) return q; /* 1.0.8: ?lang=constructor non rompe la pagina */ const n = (navigator.language || "en").toLowerCase(); if (/^zh-(tw|hk|mo)|hant/.test(n)) return "zht"; const l = n.slice(0, 2); return S[l] ? l : "en"; };

"use strict";
const S = {"it":{"lang":"Italiano","locale":"it-IT","privB":"Informativa privacy","termsB":"Condizioni d'uso","priv":["Titolare del trattamento: Snugbloom Studio, nome commerciale di uno sviluppatore individuale con sede in Italia. Nome e indirizzo postale dello sviluppatore sono indicati nella sezione «Info sullo sviluppatore» della pagina di Tanetto su Google Play. Contatto: tanettoapp@gmail.com.","Quali dati: Tanetto funziona anche senza account. In quel caso compagno, obiettivi, diario, giardino e progressi vengono salvati solo nella memoria di questo dispositivo e non vengono inviati a nessuno. I pensieri scritti in «Lascia andare» non vengono salvati affatto.","Se scrivi il tuo nome per il saluto (è facoltativo), resta salvato allo stesso modo: sul dispositivo e, se hai un account, nel backup online.","Copia dei dati: se tocchi «Salva una copia», Tanetto crea un file con i tuoi progressi direttamente sul tuo dispositivo. Il file resta a te e non viene inviato a nessuno. Con «Ripristina una copia» il file viene letto solo dal tuo dispositivo.","Account facoltativo e backup online: se scegli di creare un account (con Google o con e-mail e password), conserviamo il tuo indirizzo e-mail e una copia dei tuoi progressi, solo per farti accedere e per permetterti di ripristinarli. I dati sono custoditi da Google Firebase (Google Ireland Ltd.) su server nell'Unione Europea, trasmessi in modo cifrato e accessibili solo con il tuo account. L'accesso (Firebase Authentication) è invece gestito da Google negli Stati Uniti, nell'ambito dell'EU-US Data Privacy Framework. Base giuridica: esecuzione del servizio che hai richiesto (art. 6, par. 1, lett. b del GDPR). Il backup resta finché non elimini il profilo: puoi farlo quando vuoi in Profilo › Account e backup › Gestisci account › Elimina profilo, oppure dalla pagina tanettoapp.github.io/Tanetto/elimina-account.html. L'account e il backup vengono cancellati subito.","Acquisti: i pagamenti di Tanetto Plus e dei pacchetti di Tanì sono gestiti interamente da Google Play. Non riceviamo mai i dati della tua carta o del pagamento: Google comunica all'app solo quali acquisti sono attivi, per sbloccarli.","Statistiche anonime: per capire se l'app è utile contiamo, in forma aggregata, alcune azioni, per esempio quante volte l'app viene aperta o se viene usata nei giorni successivi. Usiamo GoatCounter, un servizio di statistiche che non usa cookie e non crea profili. Per inviare il conteggio il dispositivo si collega al servizio, che riceve tecnicamente l'indirizzo IP senza conservarlo in forma identificabile. Base giuridica: legittimo interesse a migliorare l'app (art. 6, par. 1, lett. f del GDPR).","Hosting: le pagine dell'app sono ospitate da un fornitore esterno, che può registrare l'indirizzo IP per motivi tecnici e di sicurezza secondo la propria informativa.","Cookie: Tanetto non usa cookie di profilazione propri. L'archiviazione locale serve solo a far funzionare l'app ed è strettamente necessaria. Nell'app Android puoi scegliere di guardare brevi pubblicità per ricevere un piccolo premio: non compaiono mai da sole, solo quando scegli tu di guardarne una.","Video con premio (solo app Android): le pubblicità sono fornite da Google AdMob (Google Ireland Ltd. e Google LLC; i dati possono essere trattati anche negli Stati Uniti). Google tratta questi dati come titolare autonomo secondo la propria informativa (https://policies.google.com/privacy); i trasferimenti verso gli Stati Uniti si basano sull'EU-US Data Privacy Framework. Tanetto non riceve mai il tuo ID pubblicità. Dove la legge lo richiede (Spazio economico europeo, Regno Unito e Svizzera), prima che venga mostrata qualsiasi pubblicità ti chiediamo il consenso con lo strumento di Google per la gestione del consenso (UMP); puoi cambiarlo quando vuoi in Profilo › Scelte sulla pubblicità. Per preparare e riprodurre i video, Google può raccogliere l'ID pubblicità del dispositivo, l'indirizzo IP e informazioni sulla tua interazione con gli annunci, per mostrarli, misurarli e prevenire le frodi e, solo con il tuo consenso, per personalizzarli. Base giuridica: il tuo consenso, dove richiesto (art. 6, par. 1, lett. a del GDPR), e il legittimo interesse a offrire premi facoltativi e a prevenire le frodi (art. 6, par. 1, lett. f del GDPR). Puoi reimpostare o eliminare l'ID pubblicità nelle impostazioni di Android. Come Google usa questi dati: https://policies.google.com/technologies/partner-sites. Puoi guardare al massimo 5 video al giorno e con Tanetto Plus non vedi nessuna pubblicità. Google può anche raccogliere dati diagnostici sul servizio pubblicitario (per esempio arresti anomali e prestazioni) e ricavare una posizione approssimativa dal tuo indirizzo IP, per gli stessi scopi.","Conservazione: i dati sul dispositivo restano finché non li cancelli. Puoi farlo in qualsiasi momento con «Ricomincia da capo» o cancellando i dati del browser. Le statistiche sono solo numeri aggregati.","I tuoi diritti: puoi chiedere informazioni, accesso, rettifica, cancellazione e limitazione, e opporti al trattamento, scrivendo al contatto qui sopra. Puoi anche presentare reclamo all'autorità di controllo: in Italia è il Garante per la protezione dei dati personali. Puoi anche chiedere una copia dei tuoi dati in un formato portabile e ritirare il consenso in qualsiasi momento, senza effetti su quanto fatto prima.","Diritti privacy negli stati USA: se vivi in uno stato degli USA con una legge sulla privacy dei consumatori, come la California, ti informiamo che non vendiamo i tuoi dati personali in cambio di denaro. Mostrare video con premio tramite Google AdMob può valere come «condivisione» per la pubblicità mirata secondo quelle leggi. Puoi opporti eliminando o reimpostando l'ID pubblicità nelle impostazioni di Android, oppure in Profilo › Scelte sulla pubblicità quando l'app la mostra, e puoi esercitare i diritti descritti sopra scrivendoci. Esercitare questi diritti non cambierà mai il modo in cui ti trattiamo.","Età: Tanetto è pensato per persone dai 16 anni in su.","Modifiche: se questa informativa cambia, la versione aggiornata sarà sempre in questa pagina. Ultimo aggiornamento: 11/11/2026."],"terms":["Tanetto è offerto così com'è, senza garanzia di funzionamento continuo, e può cambiare nel tempo.","L'app aiuta a costruire piccole abitudini quotidiane con un compagno virtuale e non sostituisce consigli medici o psicologici.","Quello che scrivi resta tuo: sul tuo dispositivo e, se usi un account, nel tuo backup personale. Usa l'app con serenità, senza forzarti.","Funzioni a pagamento: Tanetto è gratuito. Tanetto Plus (abbonamento mensile o annuale) e i pacchetti di Tanì sono facoltativi e si acquistano tramite Google Play, che gestisce pagamento, rinnovi, disdette e rimborsi secondo le proprie condizioni. Gli abbonamenti si rinnovano da soli finché non li disdici in Google Play › Abbonamenti: la disdetta ferma il rinnovo successivo e Plus resta attivo fino alla fine del periodo già pagato. I Tanì sono una moneta virtuale da usare solo nell'app: non hanno valore in denaro e non si possono convertire in soldi.","Illustrazioni, testi, musiche e codice di Tanetto sono protetti dal diritto d'autore e non possono essere copiati o riutilizzati senza permesso.","Per qualsiasi domanda puoi scrivere al contatto indicato nell'informativa privacy."],"back":"Torna a Tanetto","del":"Elimina il tuo account Tanetto"},"de":{"lang":"Deutsch","locale":"de-DE","privB":"Datenschutzerklärung","termsB":"Nutzungsbedingungen","priv":["Verantwortlicher: Snugbloom Studio, der Geschäftsname eines einzelnen Entwicklers mit Sitz in Italien. Vollständiger Name und Postanschrift des Entwicklers stehen auf der Google-Play-Seite von Tanetto bei den Informationen zum Entwickler. Kontakt: tanettoapp@gmail.com.","Welche Daten: Tanetto funktioniert auch ohne Konto. Dann werden Begleiter, Ziele, Tagebuch, Garten und Fortschritt nur im Speicher dieses Geräts gesichert und an niemanden gesendet. Gedanken, die du bei „Loslassen“ schreibst, werden überhaupt nicht gespeichert.","Wenn du deinen Namen für die Begrüßung eingibst (freiwillig), wird er genauso gespeichert: auf deinem Gerät und, falls du ein Konto hast, in der Online-Sicherung.","Kopie der Daten: Wenn du auf „Kopie speichern“ tippst, erstellt Tanetto direkt auf deinem Gerät eine Datei mit deinem Fortschritt. Die Datei bleibt bei dir und wird an niemanden gesendet. Bei „Kopie wiederherstellen“ wird die Datei nur von deinem Gerät gelesen.","Freiwilliges Konto und Online-Backup: Wenn du ein Konto erstellst (mit Google oder mit E-Mail und Passwort), speichern wir deine E-Mail-Adresse und eine Kopie deines Fortschritts, nur damit du dich anmelden und ihn wiederherstellen kannst. Die Daten liegen bei Google Firebase (Google Ireland Ltd.) auf Servern in der Europäischen Union, werden verschlüsselt übertragen und sind nur mit deinem Konto zugänglich. Die Anmeldung selbst (Firebase Authentication) wickelt Google in den USA ab, auf Grundlage des EU-US Data Privacy Framework. Rechtsgrundlage: Erbringung des von dir gewünschten Dienstes (Art. 6 Abs. 1 lit. b DSGVO). Das Backup bleibt, bis du dein Profil löschst: jederzeit unter Profil › Konto und Backup › Konto verwalten › Profil löschen oder auf der Seite tanettoapp.github.io/Tanetto/elimina-account.html. Konto und Backup werden sofort gelöscht.","Käufe: Die Zahlungen für Tanetto Plus und Tanì-Pakete wickelt vollständig Google Play ab. Wir erhalten nie deine Karten- oder Zahlungsdaten: Google teilt der App nur mit, welche Käufe aktiv sind, damit sie freigeschaltet werden.","Anonyme Statistik: Um zu verstehen, ob die App hilft, zählen wir zusammengefasst einige Aktionen, zum Beispiel wie oft die App geöffnet wird oder ob sie an den Folgetagen genutzt wird. Wir nutzen GoatCounter, einen Statistikdienst ohne Cookies und ohne Profile. Zum Senden der Zählung verbindet sich das Gerät mit dem Dienst, der dabei technisch die IP-Adresse erhält, sie aber nicht identifizierbar speichert. Rechtsgrundlage: berechtigtes Interesse an der Verbesserung der App (Art. 6 Abs. 1 lit. f DSGVO).","Hosting: Die Seiten der App werden von einem externen Anbieter bereitgestellt, der die IP-Adresse aus technischen und Sicherheitsgründen gemäß seiner eigenen Datenschutzerklärung protokollieren kann.","Cookies: Tanetto selbst verwendet keine Tracking-Cookies. Der lokale Speicher dient nur dem Funktionieren der App und ist unbedingt erforderlich. In der Android-App kannst du dir freiwillig kurze Werbevideos ansehen, um eine kleine Belohnung zu bekommen: Sie erscheinen nie von selbst, sondern nur, wenn du dich dafür entscheidest.","Videos mit Belohnung (nur Android-App): Die Werbung stellt Google AdMob bereit (Google Ireland Ltd. und Google LLC; Daten können auch in den USA verarbeitet werden). Google verarbeitet diese Daten als eigenständig Verantwortlicher nach seiner eigenen Datenschutzerklärung (https://policies.google.com/privacy); Übermittlungen in die USA stützen sich auf das EU-US Data Privacy Framework. Tanetto selbst erhält deine Werbe-ID nie. Wo es gesetzlich vorgeschrieben ist (Europäischer Wirtschaftsraum, Vereinigtes Königreich und Schweiz), bitten wir dich mit dem Einwilligungstool von Google (UMP) um deine Einwilligung, bevor überhaupt Werbung angezeigt wird; du kannst sie jederzeit unter Profil › Werbe-Einstellungen ändern. Um die Videos vorzubereiten und anzuzeigen, kann Google die Werbe-ID deines Geräts, deine IP-Adresse und Informationen über deine Interaktion mit der Werbung erheben, um Werbung auszuliefern, zu messen und Betrug zu verhindern und, nur mit deiner Einwilligung, um sie zu personalisieren. Rechtsgrundlage: deine Einwilligung, wo sie erforderlich ist (Art. 6 Abs. 1 lit. a DSGVO), und das berechtigte Interesse, freiwillige Belohnungen anzubieten und Betrug zu verhindern (Art. 6 Abs. 1 lit. f DSGVO). Die Werbe-ID kannst du in den Android-Einstellungen zurücksetzen oder löschen. Wie Google diese Daten nutzt: https://policies.google.com/technologies/partner-sites. Du kannst höchstens 5 Videos am Tag ansehen, und mit Tanetto Plus siehst du gar keine Werbung. Google kann außerdem zu denselben Zwecken Diagnosedaten zum Werbedienst erfassen (zum Beispiel Abstürze und Leistung) und aus deiner IP-Adresse einen ungefähren Standort ableiten.","Speicherdauer: Die Daten auf dem Gerät bleiben, bis du sie löschst. Das geht jederzeit mit „Von vorne beginnen“ oder durch Löschen der Browserdaten. Die Statistik besteht nur aus zusammengefassten Zahlen.","Deine Rechte: Du kannst Auskunft, Berichtigung, Löschung und Einschränkung verlangen und der Verarbeitung widersprechen, indem du an den Kontakt oben schreibst. Außerdem kannst du dich bei der zuständigen Datenschutzaufsichtsbehörde beschweren. Du kannst außerdem eine Kopie deiner Daten in einem übertragbaren Format verlangen und deine Einwilligung jederzeit widerrufen; was vorher geschehen ist, bleibt davon unberührt.","Datenschutzrechte in US-Bundesstaaten: Wenn du in einem US-Bundesstaat mit einem Verbraucherdatenschutzgesetz lebst, zum Beispiel in Kalifornien: Wir verkaufen deine personenbezogenen Daten nicht gegen Geld. Das Anzeigen von Belohnungsvideos über Google AdMob kann nach diesen Gesetzen als „Weitergabe“ (Sharing) für zielgerichtete Werbung gelten. Du kannst widersprechen, indem du deine Werbe-ID in den Android-Einstellungen löschst oder zurücksetzt, oder unter Profil › Werbe-Einstellungen, wenn die App diesen Punkt anzeigt. Die oben beschriebenen Rechte übst du aus, indem du uns schreibst. Dadurch wirst du nie anders behandelt.","Alter: Tanetto ist für Menschen ab 16 Jahren gedacht.","Änderungen: Wenn sich diese Erklärung ändert, findest du die aktuelle Fassung immer hier. Letzte Aktualisierung: 11.11.2026."],"terms":["Tanetto wird so angeboten, wie es ist, ohne Garantie für einen ununterbrochenen Betrieb, und kann sich mit der Zeit ändern.","Die App hilft dabei, kleine tägliche Gewohnheiten mit einem virtuellen Begleiter aufzubauen, und ersetzt keine ärztliche oder psychologische Beratung.","Was du schreibst, gehört dir: auf deinem Gerät und, wenn du ein Konto nutzt, in deinem persönlichen Backup. Nutze die App entspannt und ohne Druck.","Kostenpflichtige Funktionen: Tanetto ist kostenlos. Tanetto Plus (Monats- oder Jahresabo) und Tanì-Pakete sind freiwillig und werden über Google Play gekauft; Google Play wickelt Zahlung, Verlängerungen, Kündigungen und Erstattungen nach den eigenen Bedingungen ab. Abos verlängern sich automatisch, bis du sie in Google Play › Abos kündigst: Die Kündigung stoppt die nächste Verlängerung, und Plus bleibt bis zum Ende des bereits bezahlten Zeitraums aktiv. Tanì sind eine virtuelle Währung nur für die App: Sie haben keinen Geldwert und können nicht in Geld umgetauscht werden.","Illustrationen, Texte, Musik und Code von Tanetto sind urheberrechtlich geschützt und dürfen ohne Erlaubnis nicht kopiert oder wiederverwendet werden.","Bei Fragen kannst du dich an den Kontakt in der Datenschutzerklärung wenden."],"back":"Zurück zu Tanetto","del":"Dein Tanetto-Konto löschen"},"es":{"lang":"Español","locale":"es-ES","privB":"Política de privacidad","termsB":"Condiciones de uso","priv":["Responsable del tratamiento: Snugbloom Studio, nombre comercial de un desarrollador individual con sede en Italia. El nombre completo y la dirección postal del desarrollador figuran en la información del desarrollador de la página de Tanetto en Google Play. Contacto: tanettoapp@gmail.com.","Qué datos: Tanetto también funciona sin cuenta. En ese caso, el compañero, los objetivos, el diario, el jardín y el progreso se guardan solo en la memoria de este dispositivo y no se envían a nadie. Los pensamientos escritos en «Soltar» no se guardan en absoluto.","Si escribes tu nombre para el saludo (es opcional), se guarda de la misma forma: en tu dispositivo y, si tienes una cuenta, en la copia de seguridad en línea.","Copia de los datos: si tocas «Guardar una copia», Tanetto crea un archivo con tu progreso directamente en tu dispositivo. El archivo es tuyo y no se envía a nadie. Con «Restaurar una copia», el archivo solo lo lee tu dispositivo.","Cuenta opcional y copia en línea: si decides crear una cuenta (con Google o con correo y contraseña), guardamos tu dirección de correo y una copia de tu progreso, solo para que puedas iniciar sesión y restaurarlo. Los datos los custodia Google Firebase (Google Ireland Ltd.) en servidores de la Unión Europea, se transmiten cifrados y solo se puede acceder a ellos con tu cuenta. El inicio de sesión (Firebase Authentication) lo gestiona Google en Estados Unidos, al amparo del Marco de Privacidad de Datos UE-EE. UU. Base jurídica: prestación del servicio que has pedido (art. 6.1.b del RGPD). La copia se conserva hasta que elimines tu perfil: puedes hacerlo cuando quieras en Perfil › Cuenta y copia de seguridad › Gestionar cuenta › Eliminar perfil, o en la página tanettoapp.github.io/Tanetto/elimina-account.html. La cuenta y la copia se borran al momento.","Compras: los pagos de Tanetto Plus y de los paquetes de Tanì los gestiona por completo Google Play. Nunca recibimos los datos de tu tarjeta ni del pago: Google solo indica a la app qué compras están activas para desbloquearlas.","Estadísticas anónimas: para saber si la app es útil contamos, de forma agregada, algunas acciones, por ejemplo cuántas veces se abre la app o si se usa en los días siguientes. Usamos GoatCounter, un servicio de estadísticas sin cookies que no crea perfiles. Para enviar el recuento, el dispositivo se conecta al servicio, que recibe técnicamente la dirección IP sin guardarla de forma identificable. Base jurídica: interés legítimo en mejorar la app (art. 6.1.f del RGPD).","Alojamiento: las páginas de la app están alojadas por un proveedor externo, que puede registrar la dirección IP por motivos técnicos y de seguridad según su propia política.","Cookies: Tanetto no usa cookies de seguimiento propias. El almacenamiento local solo sirve para que la app funcione y es estrictamente necesario. En la app de Android puedes elegir ver anuncios cortos para conseguir una pequeña recompensa: nunca aparecen solos, solo cuando tú decides ver uno.","Vídeos con recompensa (solo app de Android): los anuncios los proporciona Google AdMob (Google Ireland Ltd. y Google LLC; los datos también pueden tratarse en Estados Unidos). Google trata estos datos como responsable independiente según su propia política de privacidad (https://policies.google.com/privacy); las transferencias a Estados Unidos se basan en el Marco de Privacidad de Datos UE-EE. UU. Tanetto nunca recibe tu ID de publicidad. Donde la ley lo exige (Espacio Económico Europeo, Reino Unido y Suiza), te pedimos el consentimiento con la herramienta de gestión del consentimiento de Google (UMP) antes de mostrar cualquier anuncio; puedes cambiarlo cuando quieras en Perfil › Opciones de publicidad. Para preparar y mostrar los vídeos, Google puede recoger el ID de publicidad del dispositivo, la dirección IP e información sobre tu interacción con los anuncios, para mostrarlos, medirlos y prevenir el fraude y, solo con tu consentimiento, para personalizarlos. Base jurídica: tu consentimiento, cuando es necesario (art. 6.1.a del RGPD), y el interés legítimo en ofrecer recompensas opcionales y prevenir el fraude (art. 6.1.f del RGPD). Puedes restablecer o eliminar el ID de publicidad en los ajustes de Android. Cómo usa Google estos datos: https://policies.google.com/technologies/partner-sites. Puedes ver como máximo 5 vídeos al día y, con Tanetto Plus, no ves ningún anuncio. Google también puede recoger datos de diagnóstico del servicio de anuncios (por ejemplo, fallos y rendimiento) y deducir una ubicación aproximada a partir de tu dirección IP, con los mismos fines.","Conservación: los datos del dispositivo se quedan hasta que los borres. Puedes hacerlo cuando quieras con «Empezar de nuevo» o borrando los datos del navegador. Las estadísticas son solo números agregados.","Tus derechos: puedes solicitar información, acceso, rectificación, supresión y limitación, y oponerte al tratamiento escribiendo al contacto indicado arriba. También puedes reclamar ante la autoridad de control: en España, la Agencia Española de Protección de Datos. También puedes pedir una copia de tus datos en un formato portable y retirar tu consentimiento en cualquier momento, sin que afecte a lo realizado antes.","Derechos de privacidad en estados de EE. UU.: si vives en un estado de EE. UU. con una ley de privacidad del consumidor, como California, te informamos de que no vendemos tus datos personales a cambio de dinero. Mostrar vídeos con recompensa mediante Google AdMob puede considerarse «compartir» datos para publicidad dirigida según esas leyes. Puedes oponerte borrando o restableciendo tu ID de publicidad en los ajustes de Android, o en Perfil › Opciones de publicidad cuando la app lo muestre, y puedes ejercer los derechos descritos arriba escribiéndonos. Ejercer estos derechos nunca cambiará el trato que recibes.","Edad: Tanetto está pensada para personas a partir de 16 años.","Cambios: si esta política cambia, la versión actualizada estará siempre en esta página. Última actualización: 11/11/2026."],"terms":["Tanetto se ofrece tal cual, sin garantía de funcionamiento ininterrumpido, y puede cambiar con el tiempo.","La app ayuda a crear pequeños hábitos diarios con un compañero virtual y no sustituye el consejo médico o psicológico.","Lo que escribes es tuyo: en tu dispositivo y, si usas una cuenta, en tu copia personal. Usa la app con calma, sin forzarte.","Funciones de pago: Tanetto es gratis. Tanetto Plus (suscripción mensual o anual) y los paquetes de Tanì son opcionales y se compran a través de Google Play, que gestiona el pago, las renovaciones, las cancelaciones y los reembolsos según sus propias condiciones. Las suscripciones se renuevan solas hasta que las canceles en Google Play › Suscripciones: la cancelación detiene la siguiente renovación y Plus sigue activo hasta el final del periodo ya pagado. Los Tanì son una moneda virtual para usar solo dentro de la app: no tienen valor económico y no se pueden cambiar por dinero.","Las ilustraciones, textos, música y código de Tanetto están protegidos por derechos de autor y no se pueden copiar ni reutilizar sin permiso.","Para cualquier duda puedes escribir al contacto indicado en la política de privacidad."],"back":"Volver a Tanetto","del":"Elimina tu cuenta de Tanetto"},"en":{"lang":"English","locale":"en-GB","privB":"Privacy policy","termsB":"Terms of use","priv":["Data controller: Snugbloom Studio, the trading name of an individual developer based in Italy. The developer's legal name and postal address are shown in the “About the developer” section of Tanetto's Google Play page. Contact: tanettoapp@gmail.com.","What data: Tanetto also works without an account. In that case your companion, goals, journal, garden and progress are saved only in this device's memory and are not sent to anyone. Thoughts written in “Let it go” are not saved at all.","If you type your name for the greeting (it's optional), it's stored the same way: on your device and, if you have an account, in the online backup.","Copy of your data: if you tap “Save a copy”, Tanetto creates a file with your progress directly on your device. The file stays with you and is not sent to anyone. With “Restore a copy”, the file is read only by your device.","Optional account and online backup: if you choose to create an account (with Google or with email and password), we keep your email address and a copy of your progress, only to let you sign in and restore it. The data is held by Google Firebase (Google Ireland Ltd.) on servers in the European Union, sent encrypted and accessible only with your account. Sign-in itself (Firebase Authentication) is handled by Google in the United States, under the EU–US Data Privacy Framework. Legal basis: providing the service you asked for (Art. 6(1)(b) GDPR). The backup stays until you delete your profile: you can do so anytime in Profile › Account and backup › Manage account › Delete profile, or on the page tanettoapp.github.io/Tanetto/elimina-account.html. The account and the backup are deleted immediately.","Purchases: payments for Tanetto Plus and Tanì packs are handled entirely by Google Play. We never receive your card or payment details: Google only tells the app which purchases are active, so it can unlock them.","Anonymous statistics: to understand whether the app is useful, we count some actions in aggregate form, for example how often the app is opened or whether it's used on the following days. We use GoatCounter, a statistics service with no cookies and no profiles. To send the count, the device connects to the service, which technically receives the IP address without storing it in an identifiable way. Legal basis: legitimate interest in improving the app (Article 6(1)(f) GDPR / UK GDPR).","Hosting: the app's pages are hosted by an external provider, which may log the IP address for technical and security reasons under its own privacy policy.","Cookies: Tanetto itself uses no tracking cookies. Local storage is used only to make the app work and is strictly necessary. In the Android app you can choose to watch short ads to get a small reward: they never appear on their own, only when you choose to watch one.","Rewarded videos (Android app only): ads are provided by Google AdMob (Google Ireland Ltd. and Google LLC; data may also be processed in the United States). Google acts as an independent controller of this data under its own privacy policy (https://policies.google.com/privacy); transfers to the US rely on the EU–US Data Privacy Framework. Tanetto itself never receives your advertising ID. Where the law requires it (European Economic Area, United Kingdom and Switzerland), we ask for your consent with Google's consent management tool (UMP) before any ad is shown; you can change it anytime in Profile › Ad choices. To load and play the videos, Google may collect your device's advertising ID, your IP address and information about your interaction with the ads, to serve and measure them and prevent fraud and, only with your consent, to personalise them. Legal basis: your consent, where required (Art. 6(1)(a) GDPR / UK GDPR), and legitimate interest in offering optional rewards and preventing fraud (Art. 6(1)(f) GDPR / UK GDPR). You can reset or delete the advertising ID in your Android settings. How Google uses this data: https://policies.google.com/technologies/partner-sites. You can watch up to 5 videos a day, and with Tanetto Plus you see no ads at all. Google may also collect diagnostic information about the ad service (for example crashes and performance) and estimate an approximate location from your IP address, for the same purposes.","Retention: data on the device stays until you delete it. You can do so at any time with “Start over” or by clearing your browser data. Statistics are only aggregate numbers.","Your rights: you can request information, access, correction, deletion and restriction, and object to processing, by writing to the contact above. You can also complain to your data protection authority (in the UK, the ICO). You can also ask for a copy of your data in a portable format, and you can withdraw your consent at any time; this does not affect what was done before.","US state privacy rights: if you live in a US state with a consumer privacy law, such as California, note that we do not sell your personal information for money. Showing reward videos through Google AdMob may count as “sharing” for targeted advertising under those laws. You can opt out by deleting or resetting your advertising ID in your Android settings, or in Profile › Ad choices when the app shows it, and you can use the rights described above by writing to us. Using these rights will never change how we treat you.","Age: Tanetto is meant for people aged 16 and over.","Changes: if this policy changes, the updated version will always be on this page. Last updated: 11/11/2026."],"terms":["Tanetto is offered as it is, without a guarantee of uninterrupted operation, and may change over time.","The app helps you build small daily habits with a virtual companion and does not replace medical or psychological advice.","What you write is yours: on your device and, if you use an account, in your personal backup. Use the app calmly, without pushing yourself.","Paid features: Tanetto is free. Tanetto Plus (monthly or yearly subscription) and Tanì packs are optional and are bought through Google Play, which handles payment, renewals, cancellations and refunds under its own terms. Subscriptions renew automatically until you cancel them in Google Play › Subscriptions: cancelling stops the next renewal, and Plus stays active until the end of the period already paid. Tanì are a virtual currency for use only inside the app: they have no monetary value and cannot be exchanged for money.","Tanetto's illustrations, texts, music and code are protected by copyright and may not be copied or reused without permission.","For any question you can write to the contact listed in the privacy policy."],"back":"Back to Tanetto","del":"Delete your Tanetto account"},"fr":{"lang":"Français","locale":"fr-FR","privB":"Politique de confidentialité","termsB":"Conditions d'utilisation","priv":["Responsable du traitement : Snugbloom Studio, nom commercial d'un développeur indépendant établi en Italie. Le nom complet et l'adresse postale du développeur figurent dans les informations sur le développeur de la page Google Play de Tanetto. Contact : tanettoapp@gmail.com.","Quelles données : Tanetto fonctionne aussi sans compte. Dans ce cas, le compagnon, les objectifs, le journal, le jardin et les progrès sont enregistrés uniquement dans la mémoire de cet appareil et ne sont envoyés à personne. Les pensées écrites dans « Lâcher prise » ne sont pas enregistrées du tout.","Si tu écris ton prénom pour le message d'accueil (c'est facultatif), il est enregistré de la même façon : sur ton appareil et, si tu as un compte, dans la sauvegarde en ligne.","Copie des données : si tu touches « Enregistrer une copie », Tanetto crée un fichier avec ta progression directement sur ton appareil. Le fichier reste chez toi et n'est envoyé à personne. Avec « Restaurer une copie », le fichier est lu uniquement par ton appareil.","Compte facultatif et sauvegarde en ligne : si tu choisis de créer un compte (avec Google ou avec e-mail et mot de passe), nous conservons ton adresse e-mail et une copie de ta progression, uniquement pour te permettre de te connecter et de la restaurer. Les données sont hébergées par Google Firebase (Google Ireland Ltd.) sur des serveurs dans l'Union européenne, transmises de façon chiffrée et accessibles uniquement avec ton compte. La connexion elle-même (Firebase Authentication) est gérée par Google aux États-Unis, dans le cadre du Data Privacy Framework UE-États-Unis. Base légale : exécution du service que tu as demandé (art. 6, par. 1, point b du RGPD). La sauvegarde reste jusqu'à ce que tu supprimes ton profil : tu peux le faire à tout moment dans Profil › Compte et sauvegarde › Gérer le compte › Supprimer le profil, ou sur la page tanettoapp.github.io/Tanetto/elimina-account.html. Le compte et la sauvegarde sont supprimés immédiatement.","Achats : les paiements de Tanetto Plus et des packs de Tanì sont entièrement gérés par Google Play. Nous ne recevons jamais les données de ta carte ou de ton paiement : Google indique seulement à l'app quels achats sont actifs, pour les débloquer.","Statistiques anonymes : pour savoir si l'app est utile, nous comptons de façon agrégée certaines actions, par exemple combien de fois l'app est ouverte ou si elle est utilisée les jours suivants. Nous utilisons GoatCounter, un service de statistiques sans cookies et sans profilage. Pour envoyer le comptage, l'appareil se connecte au service, qui reçoit techniquement l'adresse IP sans la conserver de façon identifiable. Base légale : intérêt légitime à améliorer l'app (art. 6, par. 1, point f du RGPD).","Hébergement : les pages de l'app sont hébergées par un prestataire externe, qui peut enregistrer l'adresse IP pour des raisons techniques et de sécurité selon sa propre politique.","Cookies : Tanetto n'utilise lui-même aucun cookie de suivi. Le stockage local sert uniquement au fonctionnement de l'app et est strictement nécessaire. Dans l'app Android, tu peux choisir de regarder de courtes publicités pour recevoir une petite récompense : elles n'apparaissent jamais d'elles-mêmes, seulement quand tu choisis d'en regarder une.","Vidéos récompensées (app Android uniquement) : les publicités sont fournies par Google AdMob (Google Ireland Ltd. et Google LLC ; les données peuvent aussi être traitées aux États-Unis). Google traite ces données en tant que responsable de traitement indépendant, selon sa propre politique de confidentialité (https://policies.google.com/privacy) ; les transferts vers les États-Unis reposent sur le cadre de protection des données UE–États-Unis (Data Privacy Framework). Tanetto ne reçoit jamais ton identifiant publicitaire. Là où la loi l'exige (Espace économique européen, Royaume-Uni et Suisse), nous te demandons ton consentement avec l'outil de gestion du consentement de Google (UMP) avant toute publicité ; tu peux le modifier à tout moment dans Profil › Choix publicitaires. Pour préparer et afficher les vidéos, Google peut collecter l'identifiant publicitaire de l'appareil, l'adresse IP et des informations sur ton interaction avec les annonces, afin de les diffuser, de les mesurer et de prévenir la fraude et, uniquement avec ton consentement, de les personnaliser. Base légale : ton consentement, lorsqu'il est requis (art. 6, par. 1, point a du RGPD), et l'intérêt légitime à proposer des récompenses facultatives et à prévenir la fraude (art. 6, par. 1, point f du RGPD). Tu peux réinitialiser ou supprimer l'identifiant publicitaire dans les paramètres d'Android. Comment Google utilise ces données : https://policies.google.com/technologies/partner-sites. Tu peux regarder au maximum 5 vidéos par jour, et avec Tanetto Plus tu ne vois aucune publicité. Google peut aussi collecter des données de diagnostic sur le service publicitaire (par exemple plantages et performances) et estimer une position approximative à partir de ton adresse IP, pour les mêmes finalités.","Conservation : les données de l'appareil restent jusqu'à ce que tu les effaces. Tu peux le faire à tout moment avec « Tout recommencer » ou en effaçant les données du navigateur. Les statistiques ne sont que des chiffres agrégés.","Tes droits : tu peux demander l'information, l'accès, la rectification, l'effacement et la limitation, et t'opposer au traitement en écrivant au contact ci-dessus. Tu peux aussi déposer une plainte auprès de la CNIL. Tu peux aussi demander une copie de tes données dans un format portable et retirer ton consentement à tout moment, sans effet sur ce qui a été fait avant.","Droits à la vie privée dans les États américains : si tu vis dans un État américain doté d'une loi sur la vie privée des consommateurs, comme la Californie, sache que nous ne vendons pas tes données personnelles contre de l'argent. L'affichage de vidéos avec récompense via Google AdMob peut être considéré comme un « partage » à des fins de publicité ciblée au sens de ces lois. Tu peux t'y opposer en supprimant ou en réinitialisant ton identifiant publicitaire dans les réglages Android, ou dans Profil › Choix publicitaires lorsque l'app l'affiche, et tu peux exercer les droits décrits ci-dessus en nous écrivant. Exercer ces droits ne changera jamais la façon dont nous te traitons.","Âge : Tanetto s'adresse aux personnes de 16 ans et plus.","Modifications : si cette politique change, la version à jour sera toujours sur cette page. Dernière mise à jour : 11/11/2026."],"terms":["Tanetto est proposé tel quel, sans garantie de fonctionnement ininterrompu, et peut évoluer avec le temps.","L'app aide à construire de petites habitudes quotidiennes avec un compagnon virtuel et ne remplace pas un avis médical ou psychologique.","Ce que tu écris t'appartient : sur ton appareil et, si tu utilises un compte, dans ta sauvegarde personnelle. Utilise l'app sereinement, sans te forcer.","Fonctions payantes : Tanetto est gratuit. Tanetto Plus (abonnement mensuel ou annuel) et les packs de Tanì sont facultatifs et s'achètent via Google Play, qui gère le paiement, les renouvellements, les résiliations et les remboursements selon ses propres conditions. Les abonnements se renouvellent automatiquement jusqu'à ce que tu les résilies dans Google Play › Abonnements : la résiliation arrête le renouvellement suivant et Plus reste actif jusqu'à la fin de la période déjà payée. Les Tanì sont une monnaie virtuelle à utiliser uniquement dans l'app : ils n'ont aucune valeur monétaire et ne peuvent pas être échangés contre de l'argent.","Les illustrations, textes, musiques et le code de Tanetto sont protégés par le droit d'auteur et ne peuvent pas être copiés ou réutilisés sans autorisation.","Pour toute question, tu peux écrire au contact indiqué dans la politique de confidentialité."],"back":"Retour à Tanetto","del":"Supprimer ton compte Tanetto"},"pt":{"lang":"Português (BR)","locale":"pt-BR","privB":"Política de privacidade","termsB":"Termos de uso","priv":["Controlador dos dados: Snugbloom Studio, nome comercial de um desenvolvedor individual com sede na Itália. O nome completo e o endereço postal do desenvolvedor aparecem nas informações do desenvolvedor, na página do Tanetto no Google Play. Contato: tanettoapp@gmail.com.","Quais dados: o Tanetto também funciona sem conta. Nesse caso, o companheiro, as metas, o diário, o jardim e o progresso ficam salvos só na memória deste aparelho e não são enviados a ninguém. Os pensamentos escritos em “Deixe ir” não são salvos de jeito nenhum.","Se você escrever seu nome para a saudação (é opcional), ele fica salvo do mesmo jeito: no seu dispositivo e, se você tiver uma conta, no backup online.","Cópia dos dados: se você tocar em “Salvar uma cópia”, o Tanetto cria um arquivo com seu progresso diretamente no seu aparelho. O arquivo fica com você e não é enviado a ninguém. Com “Restaurar uma cópia”, o arquivo é lido apenas pelo seu aparelho.","Conta opcional e backup online: se você decidir criar uma conta (com o Google ou com e-mail e senha), guardamos seu endereço de e-mail e uma cópia do seu progresso, só para você entrar e restaurá-lo. Os dados ficam com o Google Firebase (Google Ireland Ltd.) em servidores na União Europeia, são transmitidos com criptografia e só podem ser acessados com a sua conta. O login em si (Firebase Authentication) é feito pelo Google nos Estados Unidos, com base no EU-US Data Privacy Framework. Base legal: prestação do serviço que você pediu (art. 6.º, n.º 1, alínea b do RGPD). O backup fica guardado até você excluir seu perfil: dá para fazer isso quando quiser em Perfil › Conta e backup › Gerenciar conta › Excluir perfil, ou na página tanettoapp.github.io/Tanetto/elimina-account.html. A conta e o backup são apagados na hora.","Compras: os pagamentos do Tanetto Plus e dos pacotes de Tanì são feitos inteiramente pelo Google Play. Nunca recebemos os dados do seu cartão ou do pagamento: o Google só informa ao app quais compras estão ativas, para liberá-las.","Estatísticas anônimas: para entender se o app é útil, contamos de forma agregada algumas ações, por exemplo quantas vezes o app é aberto ou se é usado nos dias seguintes. Usamos o GoatCounter, um serviço de estatísticas sem cookies e sem perfis. Para enviar a contagem, o aparelho se conecta ao serviço, que recebe tecnicamente o endereço IP sem guardá-lo de forma identificável. Base legal: legítimo interesse em melhorar o app (art. 7º, IX da LGPD e art. 6º, 1, f do GDPR europeu).","Hospedagem: as páginas do app são hospedadas por um fornecedor externo, que pode registrar o endereço IP por motivos técnicos e de segurança, conforme sua própria política.","Cookies: o Tanetto não usa cookies de rastreamento próprios. O armazenamento local serve só para o app funcionar e é estritamente necessário. No app para Android, você pode escolher assistir a anúncios curtos para ganhar uma pequena recompensa: eles nunca aparecem sozinhos, só quando você decide assistir a um.","Vídeos com recompensa (só no app para Android): os anúncios são fornecidos pelo Google AdMob (Google Ireland Ltd. e Google LLC; os dados também podem ser tratados nos Estados Unidos). O Google trata esses dados como controlador independente, de acordo com a própria política de privacidade (https://policies.google.com/privacy); as transferências para os Estados Unidos se baseiam no EU-US Data Privacy Framework. O Tanetto nunca recebe o seu ID de publicidade. Onde a lei exige (Espaço Econômico Europeu, Reino Unido e Suíça), pedimos seu consentimento com a ferramenta de gestão de consentimento do Google (UMP) antes de qualquer anúncio; você pode mudá-lo quando quiser em Perfil › Escolhas de publicidade. Para preparar e exibir os vídeos, o Google pode coletar o ID de publicidade do aparelho, o endereço IP e informações sobre sua interação com os anúncios, para exibi-los, medi-los e evitar fraudes e, só com seu consentimento, para personalizá-los. Base legal: seu consentimento, quando necessário (art. 7º, I da LGPD e art. 6º, 1, a do GDPR europeu), e o legítimo interesse em oferecer recompensas opcionais e evitar fraudes (art. 7º, IX da LGPD e art. 6º, 1, f do GDPR europeu). Você pode redefinir ou excluir o ID de publicidade nas configurações do Android. Como o Google usa esses dados: https://policies.google.com/technologies/partner-sites. Você pode assistir a no máximo 5 vídeos por dia e, com o Tanetto Plus, não vê nenhum anúncio. O Google também pode coletar dados de diagnóstico do serviço de anúncios (por exemplo, falhas e desempenho) e estimar uma localização aproximada a partir do seu endereço IP, para as mesmas finalidades.","Retenção: os dados no aparelho ficam até você apagá-los. Você pode fazer isso quando quiser com “Começar de novo” ou apagando os dados do navegador. As estatísticas são apenas números agregados.","Seus direitos: você pode pedir informações, acesso, correção, eliminação e limitação, e se opor ao tratamento, escrevendo para o contato acima. Também pode fazer uma reclamação à autoridade de proteção de dados: no Brasil, a ANPD. Você também pode pedir uma cópia dos seus dados em formato portável e retirar seu consentimento a qualquer momento, sem afetar o que foi feito antes.","Direitos de privacidade em estados dos EUA: se você mora em um estado dos EUA com uma lei de privacidade do consumidor, como a Califórnia, saiba que não vendemos seus dados pessoais em troca de dinheiro. Exibir vídeos com recompensa pelo Google AdMob pode contar como “compartilhamento” para publicidade direcionada segundo essas leis. Você pode recusar excluindo ou redefinindo seu ID de publicidade nas configurações do Android, ou em Perfil › Escolhas de publicidade quando o app mostrar essa opção, e pode exercer os direitos descritos acima escrevendo para nós. Exercer esses direitos nunca vai mudar a forma como tratamos você.","Idade: o Tanetto é pensado para pessoas a partir de 16 anos.","Alterações: se esta política mudar, a versão atualizada estará sempre nesta página. Última atualização: 11/11/2026."],"terms":["O Tanetto é oferecido como está, sem garantia de funcionamento contínuo, e pode mudar com o tempo.","O app ajuda a criar pequenos hábitos diários com um companheiro virtual e não substitui orientação médica ou psicológica.","O que você escreve é seu: no seu aparelho e, se você usar uma conta, no seu backup pessoal. Use o app com tranquilidade, sem se cobrar.","Recursos pagos: o Tanetto é gratuito. O Tanetto Plus (assinatura mensal ou anual) e os pacotes de Tanì são opcionais e são comprados pelo Google Play, que cuida do pagamento, das renovações, dos cancelamentos e dos reembolsos conforme os próprios termos. As assinaturas renovam automaticamente até você cancelar em Google Play › Assinaturas: o cancelamento interrompe a próxima renovação e o Plus continua ativo até o fim do período já pago. Os Tanì são uma moeda virtual para usar só dentro do app: não têm valor em dinheiro e não podem ser trocados por dinheiro.","As ilustrações, textos, músicas e o código do Tanetto são protegidos por direitos autorais e não podem ser copiados ou reutilizados sem permissão.","Para qualquer dúvida, escreva para o contato indicado na política de privacidade."],"back":"Voltar ao Tanetto","del":"Excluir sua conta do Tanetto"},"ja":{"lang":"日本語","locale":"ja-JP","privB":"プライバシーポリシー","termsB":"利用規約","priv":["データ管理者：Snugbloom Studio（イタリアを拠点とする個人開発者の屋号）。開発者の氏名と住所は、Google Play の Tanetto のページにあるデベロッパー情報に記載されています。連絡先：tanettoapp@gmail.com。","取り扱うデータ：Tanettoはアカウントなしでも使えます。その場合、パートナー、目標、日記、お庭、進み具合はこの端末の中だけに保存され、誰にも送信されません。「手放そう」に書いた思いは一切保存されません。","あいさつ用に名前を入力した場合（任意）、同じように保存されます。端末内と、アカウントがある場合はオンラインのバックアップです。","データのコピー：「コピーを保存」をタップすると、Tanettoは進み具合を含むファイルを端末上に直接作成します。ファイルはあなたの手元に残り、誰にも送信されません。「コピーを復元」では、ファイルはあなたの端末だけが読み込みます。","任意のアカウントとオンラインバックアップ：アカウントを作成した場合（Google、またはメールアドレスとパスワード）、ログインと復元のためだけに、メールアドレスと進み具合のコピーを保管します。データはGoogle Firebase（Google Ireland Ltd.）が欧州連合内のサーバーで管理し、暗号化して送信され、あなたのアカウントでのみアクセスできます。ログイン処理（Firebase Authentication）は、EU-米国データプライバシーフレームワークに基づき、Google が米国で行います。法的根拠：あなたが求めたサービスの提供（GDPR第6条1項b）。バックアップはプロフィールを削除するまで保管されます。削除はいつでも「マイページ › アカウントとバックアップ › アカウントの管理 › プロフィールを削除」、またはページ tanettoapp.github.io/Tanetto/elimina-account.html からできます。アカウントとバックアップはすぐに削除されます。","購入：Tanetto PlusとTanìのパックの支払いは、すべてGoogle Playが処理します。カードや支払いの情報を私たちが受け取ることはありません。Googleがアプリに伝えるのは、ロックを解除するために、どの購入が有効かという情報だけです。","匿名の統計：アプリが役に立っているかを知るため、アプリが開かれた回数や翌日以降も使われているかなど、一部の操作を集計した形で数えています。Cookieもプロフィールも使わない統計サービスGoatCounterを利用しています。集計を送るために端末はこのサービスに接続し、サービスは技術的にIPアドレスを受け取りますが、個人を特定できる形では保存しません。法的根拠：アプリを改善するための正当な利益（GDPR/英国GDPR第6条1項（f））。","ホスティング：アプリのページは外部の事業者がホストしており、その事業者は自社のプライバシーポリシーに基づき、技術上・セキュリティ上の理由でIPアドレスを記録することがあります。","Cookie：Tanetto自体はトラッキング用のCookieを使いません。ローカルストレージはアプリを動かすためだけに使われ、厳密に必要なものです。Androidアプリでは、ちょっとしたごほうびをもらうために短い広告を見るかどうかを、自分で選べます。広告が勝手に表示されることはなく、あなたが選んだときだけ再生されます。","ごほうび付き動画（Androidアプリのみ）：広告はGoogle AdMob（Google Ireland Ltd.およびGoogle LLC）が提供しており、データは米国で処理されることもあります。Googleは、これらのデータを独立した管理者として、自社のプライバシーポリシー（https://policies.google.com/privacy）に基づいて取り扱います。米国への移転はEU-US Data Privacy Frameworkに基づいています。Tanetto自体があなたの広告IDを受け取ることはありません。法律で必要とされる地域（欧州経済領域、英国、スイス）では、広告を表示する前に、Googleの同意管理ツール（UMP）であなたの同意を求めます。同意は「マイページ › 広告の設定」からいつでも変更できます。動画を準備して表示するために、Googleは端末の広告ID、IPアドレス、広告とのやり取りに関する情報を収集することがあります。目的は、広告の配信・効果測定・不正防止と、あなたの同意がある場合に限り広告のパーソナライズです。法的根拠：必要な場合はあなたの同意（GDPR第6条1項a）、および任意のごほうびの提供と不正防止のための正当な利益（GDPR第6条1項f）。広告IDはAndroidの設定でリセットまたは削除できます。Googleによるデータの使い方は、Googleの説明ページ（https://policies.google.com/technologies/partner-sites）で確認できます。動画は1日5本まで見られます。Tanetto Plusでは広告は一切表示されません。また Google は、同じ目的のために、広告サービスの診断情報（クラッシュやパフォーマンスなど）を収集し、IP アドレスからおおよその位置を推定することがあります。","保存期間：端末上のデータは、あなたが削除するまで残ります。「最初からやり直す」やブラウザのデータ消去で、いつでも削除できます。統計は集計された数値のみです。","あなたの権利：上記の連絡先に連絡することで、情報の提供、アクセス、訂正、削除、利用の制限を求めたり、取り扱いに異議を申し立てたりできます。また、データ保護の監督機関（日本では個人情報保護委員会）に苦情を申し立てることもできます。また、データを持ち運び可能な形式で受け取ることを求めたり、同意をいつでも撤回したりできます（撤回前の取り扱いには影響しません）。","米国の州のプライバシー権：カリフォルニア州など、消費者プライバシー法のある米国の州にお住まいの場合、私たちはあなたの個人情報を金銭と引き換えに販売していません。ただし、Google AdMob を通じて報酬動画を表示することは、これらの法律上、ターゲティング広告のための「共有」にあたる場合があります。Android の設定で広告 ID を削除またはリセットするか、アプリに表示される場合は「マイページ › 広告の設定」から、これを拒否できます。上記の権利は、私たちに連絡することで行使できます。権利を行使しても、あなたの扱いが変わることはありません。","年齢：Tanettoは16歳以上の方を対象としています。","変更：このポリシーが変更された場合、最新版は常にこのページに掲載されます。最終更新日：2026/11/11。"],"terms":["Tanettoは現状のまま提供され、継続的な動作を保証するものではありません。内容は変わることがあります。","このアプリはバーチャルなパートナーといっしょに毎日の小さな習慣づくりを手伝うもので、医学的・心理的な助言の代わりにはなりません。","あなたが書いたものはあなたのものです。あなたの端末と、アカウントを使う場合はあなた専用のバックアップに保存されます。無理をせず、ゆったりとご利用ください。","有料機能：Tanettoは無料です。Tanetto Plus（月額または年額の定期購入）とTanìのパックは任意で、Google Playを通じて購入します。支払い、更新、解約、返金はGoogle Playの規約に従って処理されます。定期購入はGoogle Play › 定期購入で解約するまで自動で更新されます。解約すると次回の更新が止まり、Plusはすでに支払った期間の終わりまで有効です。Tanìはアプリ内だけで使える仮想通貨で、金銭的な価値はなく、お金に交換することはできません。","Tanettoのイラスト、文章、音楽、コードは著作権で保護されており、許可なく複製・再利用することはできません。","ご質問は、プライバシーポリシーに記載の連絡先までお寄せください。"],"back":"Tanettoに戻る","del":"Tanettoのアカウントを削除"},"ko":{"lang":"한국어","locale":"ko-KR","privB":"개인정보 처리방침","termsB":"이용 약관","priv":["개인정보 처리자: Snugbloom Studio(이탈리아에 있는 개인 개발자의 상호). 개발자의 실명과 우편 주소는 Google Play의 Tanetto 페이지에 있는 개발자 정보에서 확인할 수 있어요. 연락처: tanettoapp@gmail.com.","수집하는 데이터: Tanetto는 계정 없이도 작동해요. 이 경우 친구, 목표, 일기, 정원, 진행 상황은 이 기기에만 저장되며 누구에게도 전송되지 않아요. ‘흘려보내기’에 적은 생각은 아예 저장되지 않아요.","인사에 쓸 이름을 입력하면(선택 사항) 같은 방식으로 저장돼요. 기기 안에, 그리고 계정이 있다면 온라인 백업에도 저장돼요.","데이터 사본: ‘사본 저장’을 탭하면 Tanetto가 진행 상황이 담긴 파일을 기기에 직접 만들어요. 파일은 사용자에게만 남고 누구에게도 전송되지 않아요. ‘사본 복원’을 하면 파일은 사용자의 기기에서만 읽혀요.","선택 사항인 계정과 온라인 백업: 계정을 만들면(Google 또는 이메일과 비밀번호) 로그인과 복원을 위해서만 이메일 주소와 진행 상황 사본을 보관해요. 데이터는 Google Firebase(Google Ireland Ltd.)가 유럽연합 내 서버에 보관하고, 암호화되어 전송되며, 사용자의 계정으로만 접근할 수 있어요. 로그인 자체(Firebase Authentication)는 EU-미국 데이터 프라이버시 프레임워크에 따라 Google이 미국에서 처리해요. 법적 근거: 사용자가 요청한 서비스 제공(GDPR 제6조 1항 b). 백업은 프로필을 삭제할 때까지 보관돼요. 삭제는 언제든 프로필 › 계정 및 백업 › 계정 관리 › 프로필 삭제, 또는 tanettoapp.github.io/Tanetto/elimina-account.html 페이지에서 할 수 있어요. 계정과 백업은 바로 삭제돼요.","구매: Tanetto Plus와 Tanì 패키지의 결제는 모두 Google Play가 처리해요. 카드나 결제 정보는 절대 받지 않아요. Google은 잠금 해제를 위해 어떤 구매가 활성 상태인지만 앱에 알려 줘요.","익명 통계: 앱이 유용한지 알기 위해 일부 동작의 횟수를 집계해요. 예를 들어 앱이 얼마나 자주 열리는지, 다음 날에도 사용되는지 등이에요. 쿠키와 프로필을 사용하지 않는 통계 서비스 GoatCounter를 이용해요. 집계를 보내기 위해 기기가 이 서비스에 연결되며, 서비스는 기술적으로 IP 주소를 받지만 식별 가능한 방식으로 저장하지 않아요. 법적 근거: 앱 개선에 대한 정당한 이익(GDPR / UK GDPR 제6조 제1항 (f)호).","호스팅: 앱 페이지는 외부 제공업체가 호스팅하며, 해당 업체는 자체 개인정보 처리방침에 따라 기술 및 보안상의 이유로 IP 주소를 기록할 수 있어요.","쿠키: Tanetto 자체는 추적용 쿠키를 사용하지 않아요. 로컬 스토리지는 앱 작동을 위해서만 쓰이며 반드시 필요한 것이에요. Android 앱에서는 작은 보상을 받기 위해 짧은 광고를 볼지 직접 선택할 수 있어요. 광고가 저절로 나타나는 일은 없고, 사용자가 선택할 때만 재생돼요.","보상형 동영상(Android 앱 전용): 광고는 Google AdMob(Google Ireland Ltd. 및 Google LLC)이 제공하며, 데이터는 미국에서 처리될 수도 있어요. Google은 자체 개인정보처리방침(https://policies.google.com/privacy)에 따라 이 데이터를 독립적인 컨트롤러로서 처리해요. 미국으로의 이전은 EU-미국 데이터 프라이버시 프레임워크에 근거해요. Tanetto는 광고 ID를 절대 받지 않아요. 법에서 요구하는 지역(유럽경제지역, 영국, 스위스)에서는 광고를 보여 주기 전에 Google의 동의 관리 도구(UMP)로 동의를 요청해요. 동의는 언제든 프로필 › 광고 선택에서 바꿀 수 있어요. 동영상을 준비하고 보여 주기 위해 Google은 기기의 광고 ID, IP 주소, 광고와의 상호작용에 관한 정보를 수집할 수 있어요. 목적은 광고 게재, 성과 측정, 부정 행위 방지이며, 사용자가 동의한 경우에만 광고 맞춤화에도 쓰여요. 법적 근거: 필요한 경우 사용자의 동의(GDPR 제6조 1항 a), 그리고 선택형 보상 제공과 부정 행위 방지에 대한 정당한 이익(GDPR 제6조 1항 f). 광고 ID는 Android 설정에서 재설정하거나 삭제할 수 있어요. Google이 이 데이터를 사용하는 방법은 Google 안내 페이지(https://policies.google.com/technologies/partner-sites)에서 확인할 수 있어요. 동영상은 하루 최대 5개까지 볼 수 있고, Tanetto Plus에서는 광고가 전혀 표시되지 않아요. 또한 Google은 같은 목적으로 광고 서비스의 진단 정보(예: 오류 및 성능)를 수집하고, IP 주소로 대략적인 위치를 추정할 수 있어요.","보관 기간: 기기의 데이터는 사용자가 삭제할 때까지 남아 있어요. ‘처음부터 다시’를 누르거나 브라우저 데이터를 삭제해서 언제든 지울 수 있어요. 통계는 집계된 숫자일 뿐이에요.","사용자의 권리: 위 연락처로 문의해서 정보 제공, 열람, 정정, 삭제, 처리 제한을 요청하고 처리에 반대할 수 있어요. 또한 개인정보 보호 감독기관(영국의 경우 ICO)에 민원을 제기할 수 있어요. 또한 데이터를 옮길 수 있는 형식으로 받아 보도록 요청하고, 언제든 동의를 철회할 수 있어요. 철회 전에 이루어진 처리에는 영향이 없어요.","미국 주별 개인정보 보호 권리: 캘리포니아처럼 소비자 개인정보 보호법이 있는 미국 주에 살고 있다면, 저희는 개인정보를 돈을 받고 판매하지 않아요. 다만 Google AdMob으로 보상형 동영상을 보여 주는 것은 해당 법에 따라 맞춤 광고를 위한 '공유'로 볼 수 있어요. Android 설정에서 광고 ID를 삭제하거나 재설정하거나, 앱에 표시되는 경우 프로필 › 광고 선택에서 거부할 수 있어요. 위에 설명한 권리는 저희에게 연락해서 행사할 수 있어요. 권리를 행사해도 불이익은 전혀 없어요.","나이: Tanetto는 만 16세 이상을 위한 앱이에요.","변경: 이 방침이 바뀌면 최신 버전은 항상 이 페이지에 있어요. 최종 업데이트: 2026. 11. 11."],"terms":["Tanetto는 있는 그대로 제공되며, 중단 없는 작동을 보장하지 않고, 시간이 지나며 바뀔 수 있어요.","이 앱은 가상 친구와 함께 작은 생활 습관을 만들도록 돕는 앱이며, 의학적 또는 심리적 조언을 대신하지 않아요.","사용자가 쓴 내용은 사용자의 것이에요. 기기에, 그리고 계정을 쓰면 개인 백업에 저장돼요. 무리하지 말고 편안하게 사용하세요.","유료 기능: Tanetto는 무료예요. Tanetto Plus(월간 또는 연간 구독)와 Tanì 패키지는 선택 사항이며 Google Play를 통해 구매해요. 결제, 갱신, 해지, 환불은 Google Play가 자체 약관에 따라 처리해요. 구독은 Google Play › 구독에서 해지할 때까지 자동으로 갱신돼요. 해지하면 다음 갱신이 멈추고, Plus는 이미 결제한 기간이 끝날 때까지 유지돼요. Tanì는 앱 안에서만 쓰는 가상 화폐로, 금전적 가치가 없고 돈으로 바꿀 수 없어요.","Tanetto의 일러스트, 글, 음악, 코드는 저작권으로 보호되며 허가 없이 복제하거나 재사용할 수 없어요.","궁금한 점은 개인정보 처리방침에 적힌 연락처로 문의하세요."],"back":"Tanetto로 돌아가기","del":"Tanetto 계정 삭제"},"zh":{"lang":"简体中文","locale":"zh-CN","privB":"隐私政策","termsB":"使用条款","priv":["数据控制者：Snugbloom Studio（一位常驻意大利的个人开发者的商号）。开发者的姓名和邮寄地址列在 Google Play 上 Tanetto 页面的开发者信息中。联系方式：tanettoapp@gmail.com。","收集哪些数据：Tanetto 不登录也能使用。这种情况下，你的小伙伴、目标、日记、花园和进度只保存在这台设备上，不会发送给任何人。在“放下吧”中写下的念头完全不会被保存。","如果你填写了用于问候的名字（可选），它也会以同样的方式保存：保存在你的设备上；如果你有账号，也会保存在在线备份中。","数据副本：如果你点“保存副本”，Tanetto 会直接在你的设备上生成一个包含你进度的文件。文件由你保管，不会发送给任何人。使用“恢复副本”时，文件只会由你的设备读取。","可选账号与网上备份：如果你选择创建账号（使用 Google 或邮箱和密码），我们会保存你的邮箱地址和一份进度副本，仅用于让你登录和恢复进度。数据由 Google Firebase（Google Ireland Ltd.）存放在欧盟境内的服务器上，以加密方式传输，只有用你的账号才能访问。登录本身（Firebase Authentication）由 Google 在美国处理，依据为欧盟-美国数据隐私框架。法律依据：提供你所请求的服务（GDPR 第 6 条第 1 款 b 项）。备份会一直保留，直到你删除个人资料：你可以随时在“我的 › 账号与备份 › 管理账号 › 删除个人资料”中删除，或在页面 tanettoapp.github.io/Tanetto/elimina-account.html 上删除。账号和备份会立即删除。","购买：Tanetto Plus 和 Tanì 礼包的付款完全由 Google Play 处理。我们绝不会收到你的银行卡或付款信息：Google 只会告诉应用哪些购买有效，以便解锁。","匿名统计：为了了解应用是否有用，我们会以汇总形式统计部分操作，例如应用被打开的频率，或者之后几天是否还在使用。我们使用 GoatCounter，这是一项不使用 Cookie、不建立用户画像的统计服务。为了发送统计数据，设备会连接到该服务，该服务在技术上会接收到 IP 地址，但不会以可识别身份的方式存储。法律依据：改进应用的正当利益（GDPR / 英国 GDPR 第 6(1)(f) 条）。","托管：应用的页面由外部服务商托管，该服务商可能出于技术和安全原因，根据其自身的隐私政策记录 IP 地址。","Cookie：Tanetto 本身不使用任何追踪类 Cookie。本地存储仅用于让应用正常运行，是严格必要的。在 Android 应用中，你可以自己选择观看简短的广告来获得小奖励：广告绝不会自行弹出，只有在你选择观看时才会播放。","奖励视频（仅限 Android 应用）：广告由 Google AdMob（Google Ireland Ltd. 和 Google LLC）提供，数据也可能在美国处理。Google 作为独立的数据控制者，按照其自身的隐私权政策（https://policies.google.com/privacy）处理这些数据；向美国的传输以《欧盟-美国数据隐私框架》为依据。Tanetto 本身绝不会收到你的广告 ID。在法律有要求的地区（欧洲经济区、英国和瑞士），在展示任何广告之前，我们会通过 Google 的同意管理工具（UMP）征求你的同意；你可以随时在“我的 › 广告选择”中更改。为了准备和播放视频，Google 可能会收集设备的广告 ID、IP 地址以及你与广告互动的信息，用于投放和衡量广告、防止欺诈，并且仅在你同意的情况下用于个性化广告。法律依据：在需要时为你的同意（GDPR 第 6 条第 1 款 a 项），以及提供可选奖励和防止欺诈的正当利益（GDPR 第 6 条第 1 款 f 项）。你可以在 Android 设置中重置或删除广告 ID。关于 Google 如何使用这些数据，请参阅 Google 的说明页面（https://policies.google.com/technologies/partner-sites）。你每天最多可以观看 5 个视频；使用 Tanetto Plus 则完全不会看到广告。Google 还可能出于相同目的收集广告服务的诊断信息（例如崩溃和性能数据），并根据你的 IP 地址估算大致位置。","保存期限：设备上的数据会一直保留，直到你删除为止。你可以随时通过“重新开始”或清除浏览器数据来删除。统计数据只是汇总后的数字。","你的权利：你可以通过上述联系方式提出请求，要求获取信息、访问、更正、删除和限制处理你的数据，也可以反对数据处理。你还可以向你所在地的数据保护机构投诉（在英国为 ICO）。你也可以要求以可携带的格式获取你的数据副本，并可随时撤回同意，但这不影响撤回之前的处理。","美国各州隐私权利：如果你居住在设有消费者隐私法的美国州（例如加利福尼亚州），我们不会为换取金钱而出售你的个人信息。不过，根据这些法律，通过 Google AdMob 展示奖励视频可能被视为出于定向广告目的的“共享”。你可以在 Android 设置中删除或重置广告 ID，或在应用显示该选项时前往“我的 › 广告选择”拒绝这种共享；也可以写信给我们，行使上文所述的权利。行使这些权利不会让你受到任何不同对待。","年龄：Tanetto 适合 16 岁及以上的人使用。","变更：如果本政策有变更，更新后的版本将始终发布在本页面。最后更新：2026/11/11。"],"terms":["Tanetto 按现状提供，不保证不间断运行，并且可能随时间变化。","本应用借助一个虚拟小伙伴帮助你养成日常小习惯，不能代替医疗或心理方面的建议。","你写下的内容属于你：保存在你的设备上；如果你使用账号，也保存在你的个人备份中。请轻松地使用本应用，不要勉强自己。","付费功能：Tanetto 是免费的。Tanetto Plus（按月或按年订阅）和 Tanì 礼包是可选的，通过 Google Play 购买，付款、续订、取消和退款均由 Google Play 按其条款处理。订阅会自动续订，直到你在 Google Play › 订阅中取消：取消后将停止下一次续订，Plus 会保持有效直到已付费期间结束。Tanì 是只能在应用内使用的虚拟货币：没有货币价值，不能兑换成钱。","Tanetto 的插图、文字、音乐和代码受版权保护，未经许可不得复制或再次使用。","如有任何问题，可以通过隐私政策中列出的联系方式与我们联系。"],"back":"返回 Tanetto","del":"删除你的 Tanetto 账号"},"zht":{"lang":"繁體中文","locale":"zh-TW","privB":"隱私權政策","termsB":"使用條款","priv":["資料控管者：Snugbloom Studio（一位位於義大利的個人開發者的商號）。開發者的姓名和郵寄地址列在 Google Play 上 Tanetto 頁面的開發人員資訊中。聯絡方式：tanettoapp@gmail.com。","收集哪些資料：Tanetto 不登入也能使用。這種情況下，你的小夥伴、目標、日記、花園和進度只會儲存在這台裝置上，不會傳送給任何人。在「放下吧」中寫下的念頭完全不會被儲存。","如果你填寫了用於問候的名字（可選），它也會以同樣的方式儲存：儲存在你的裝置上；如果你有帳號，也會儲存在線上備份中。","資料備份：如果你點「儲存備份」，Tanetto 會直接在你的裝置上建立一個包含你進度的檔案。這個檔案由你保管，不會傳送給任何人。使用「還原備份」時，檔案只會由你的裝置讀取。","選用帳號與網路備份：如果你選擇建立帳號（使用 Google 或電子郵件和密碼），我們會保存你的電子郵件地址和一份進度副本，僅用於讓你登入並還原進度。資料由 Google Firebase（Google Ireland Ltd.）存放在歐盟境內的伺服器上，以加密方式傳輸，只有用你的帳號才能存取。登入本身（Firebase Authentication）由 Google 在美國處理，依據為歐盟-美國資料隱私框架。法律依據：提供你所要求的服務（GDPR 第 6 條第 1 項 b 款）。備份會一直保留，直到你刪除個人檔案：你隨時可以在「我的 › 帳號與備份 › 管理帳號 › 刪除個人檔案」刪除，或在頁面 tanettoapp.github.io/Tanetto/elimina-account.html 上刪除。帳號和備份會立即刪除。","購買：Tanetto Plus 和 Tanì 禮包的付款完全由 Google Play 處理。我們絕不會收到你的信用卡或付款資料：Google 只會告訴 App 哪些購買有效，以便解鎖。","匿名統計：為了了解這個 App 是否有用，我們會以彙總形式統計部分操作，例如 App 被開啟的頻率，或是否在之後幾天繼續使用。我們使用 GoatCounter，這是一個不使用 Cookie、不建立個人檔案的統計服務。為了傳送統計資料，裝置會連線到該服務，服務在技術上會接收到 IP 位址，但不會以可識別個人的方式儲存。法律依據：改善 App 的正當利益（GDPR / 英國 GDPR 第 6 條第 1 項第 f 款）。","主機代管：App 的網頁由外部服務商代管，該服務商可能基於技術和安全理由，依其自身的隱私權政策記錄 IP 位址。","Cookie：Tanetto 本身不使用任何追蹤 Cookie。本機儲存空間僅用於讓 App 正常運作，屬於絕對必要的用途。在 Android App 中，你可以自己選擇觀看簡短的廣告來獲得小獎勵：廣告絕不會自行跳出，只有在你選擇觀看時才會播放。","獎勵影片（僅限 Android App）：廣告由 Google AdMob（Google Ireland Ltd. 和 Google LLC）提供，資料也可能在美國處理。Google 以獨立資料控管者的身分，依其自身的隱私權政策（https://policies.google.com/privacy）處理這些資料；傳輸至美國係以「歐盟－美國資料隱私框架」為依據。Tanetto 本身絕不會收到你的廣告 ID。在法律有要求的地區（歐洲經濟區、英國和瑞士），在顯示任何廣告之前，我們會透過 Google 的同意管理工具（UMP）徵求你的同意；你隨時可以在「我的 › 廣告選擇」中變更。為了準備和播放影片，Google 可能會收集裝置的廣告 ID、IP 位址，以及你與廣告互動的資訊，用於放送和評估廣告、防止詐欺，並且僅在你同意的情況下用於個人化廣告。法律依據：在需要時為你的同意（GDPR 第 6 條第 1 項 a 款），以及提供選用獎勵和防止詐欺的正當利益（GDPR 第 6 條第 1 項 f 款）。你可以在 Android 設定中重設或刪除廣告 ID。關於 Google 如何使用這些資料，請參閱 Google 的說明頁面（https://policies.google.com/technologies/partner-sites）。你每天最多可以觀看 5 部影片；使用 Tanetto Plus 則完全不會看到廣告。Google 也可能基於相同目的收集廣告服務的診斷資訊（例如當機和效能資料），並根據你的 IP 位址推估大致位置。","保存期限：裝置上的資料會一直保留，直到你刪除為止。你隨時可以透過「重新開始」或清除瀏覽器資料來刪除。統計資料僅為彙總數字。","你的權利：你可以寫信至上述聯絡方式，要求取得資訊、查閱、更正、刪除及限制處理你的資料，並可反對資料處理。你也可以向資料保護主管機關提出申訴（在英國為 ICO）。你也可以要求以可攜的格式取得你的資料副本，並可隨時撤回同意，但這不影響撤回之前的處理。","美國各州隱私權利：如果你居住在設有消費者隱私法的美國州（例如加州），我們不會為換取金錢而出售你的個人資料。不過，依照這些法律，透過 Google AdMob 顯示獎勵影片可能被視為基於目標式廣告目的的「分享」。你可以在 Android 設定中刪除或重設廣告 ID，或在應用程式顯示該選項時前往「我的 › 廣告選擇」拒絕這種分享；也可以寫信給我們，行使上文所述的權利。行使這些權利不會讓你受到任何差別待遇。","年齡：Tanetto 適用於 16 歲以上的使用者。","變更：如果本政策有所變更，更新後的版本將一律公布在此頁面。最後更新日期：2026/11/11。"],"terms":["Tanetto 依現狀提供，不保證不中斷運作，並可能隨時間改變。","這個 App 透過虛擬小夥伴幫助你養成每天的小習慣，不能取代醫療或心理專業建議。","你寫下的內容屬於你：保留在你的裝置上；如果你使用帳號，也會保留在你的個人備份中。請放輕鬆使用這個 App，不要勉強自己。","付費功能：Tanetto 是免費的。Tanetto Plus（月訂或年訂）和 Tanì 禮包為選用項目，透過 Google Play 購買，付款、續訂、取消和退款皆由 Google Play 依其條款處理。訂閱會自動續訂，直到你在 Google Play › 訂閱中取消：取消後會停止下一次續訂，Plus 會維持有效到已付費期間結束。Tanì 是只能在 App 內使用的虛擬貨幣：沒有金錢價值，也不能兌換成錢。","Tanetto 的插圖、文字、音樂和程式碼均受著作權保護，未經許可不得複製或重複使用。","如有任何問題，你可以寫信至隱私權政策中列出的聯絡方式。"],"back":"回到 Tanetto","del":"刪除你的 Tanetto 帳號"},"ru":{"lang":"Русский","locale":"ru-RU","privB":"Политика конфиденциальности","termsB":"Условия использования","priv":["Ответственный за обработку данных: Snugbloom Studio — торговое название частного разработчика из Италии. Полное имя и почтовый адрес разработчика указаны в сведениях о разработчике на странице Tanetto в Google Play. Контакт: tanettoapp@gmail.com.","Какие данные: Tanetto работает и без аккаунта. В этом случае питомец, цели, дневник, сад и прогресс сохраняются только в памяти этого устройства и никому не передаются. Мысли, записанные в «Отпусти», не сохраняются вообще.","Если ты укажешь имя для приветствия (это необязательно), оно хранится так же: на твоём устройстве и, если у тебя есть аккаунт, в онлайн-копии.","Копия данных: если нажать «Сохранить копию», Tanetto создаёт файл с твоим прогрессом прямо на твоём устройстве. Файл остаётся у тебя и никому не отправляется. При использовании «Восстановить копию» файл читается только твоим устройством.","Необязательный аккаунт и онлайн-копия: если ты решишь создать аккаунт (через Google или с e-mail и паролем), мы храним твой адрес e-mail и копию твоего прогресса — только чтобы ты мог войти и восстановить его. Данные хранит Google Firebase (Google Ireland Ltd.) на серверах в Европейском союзе, они передаются в зашифрованном виде и доступны только через твой аккаунт. Сам вход (Firebase Authentication) обрабатывает Google в США в рамках EU-US Data Privacy Framework. Правовое основание: оказание услуги, которую ты запросил (ст. 6(1)(b) GDPR). Копия хранится, пока ты не удалишь профиль: это можно сделать в любой момент в «Профиль» › «Аккаунт и резервная копия» › «Управление аккаунтом» › «Удалить профиль» или на странице tanettoapp.github.io/Tanetto/elimina-account.html. Аккаунт и копия удаляются сразу.","Покупки: оплату Tanetto Plus и наборов Tanì полностью обрабатывает Google Play. Мы никогда не получаем данные твоей карты или платежа: Google сообщает приложению только о том, какие покупки активны, чтобы их разблокировать.","Анонимная статистика: чтобы понять, полезно ли приложение, мы подсчитываем некоторые действия в обобщённом виде, например как часто открывается приложение или используется ли оно в последующие дни. Мы используем GoatCounter — сервис статистики без cookie и без профилей. Чтобы передать подсчёт, устройство подключается к сервису, который технически получает IP-адрес, но не хранит его в виде, позволяющем установить личность. Правовое основание: законный интерес в улучшении приложения (статья 6(1)(f) GDPR / UK GDPR).","Хостинг: страницы приложения размещены у внешнего провайдера, который может записывать IP-адрес в технических целях и в целях безопасности в соответствии со своей политикой конфиденциальности.","Cookie: Tanetto само не использует cookie для отслеживания. Локальное хранилище используется только для работы приложения и является строго необходимым. В приложении для Android ты можешь по желанию посмотреть короткую рекламу и получить небольшую награду: реклама никогда не появляется сама, а только когда ты решишь её посмотреть.","Видео с наградой (только приложение для Android): рекламу предоставляет Google AdMob (Google Ireland Ltd. и Google LLC; данные могут обрабатываться и в США). Google обрабатывает эти данные как самостоятельный контролёр согласно собственной политике конфиденциальности (https://policies.google.com/privacy); передача данных в США основана на EU-US Data Privacy Framework. Само Tanetto твой рекламный идентификатор никогда не получает. Там, где этого требует закон (Европейская экономическая зона, Великобритания и Швейцария), прежде чем показать какую-либо рекламу, мы просим твоего согласия с помощью инструмента Google для управления согласием (UMP); изменить его можно в любой момент в «Профиль» › «Настройки рекламы». Чтобы подготовить и показать видео, Google может собирать рекламный идентификатор устройства, IP-адрес и сведения о твоём взаимодействии с рекламой — чтобы показывать её, оценивать её эффективность и предотвращать мошенничество, а только с твоего согласия — чтобы её персонализировать. Правовое основание: твоё согласие, когда оно требуется (ст. 6(1)(a) GDPR), и законный интерес в том, чтобы предлагать необязательные награды и предотвращать мошенничество (ст. 6(1)(f) GDPR). Рекламный идентификатор можно сбросить или удалить в настройках Android. Как Google использует эти данные: https://policies.google.com/technologies/partner-sites. В день можно посмотреть не больше 5 видео, а с Tanetto Plus реклама не показывается совсем. С теми же целями Google может также собирать диагностические данные о работе рекламного сервиса (например, о сбоях и производительности) и определять примерное местоположение по твоему IP-адресу.","Срок хранения: данные на устройстве хранятся, пока ты их не удалишь. Это можно сделать в любой момент через «Начать заново» или очистив данные браузера. Статистика — это только обобщённые числа.","Твои права: ты можешь запросить информацию, доступ, исправление, удаление и ограничение обработки, а также возразить против обработки, написав по указанному выше контакту. Также можно подать жалобу в свой надзорный орган по защите данных (в Великобритании — ICO). Также можно запросить копию своих данных в переносимом формате и в любой момент отозвать согласие; это не влияет на обработку, которая была до отзыва.","Права на конфиденциальность в штатах США: если ты живёшь в штате США, где действует закон о защите данных потребителей (например, в Калифорнии), мы не продаём твои персональные данные за деньги. Однако показ видео с наградой через Google AdMob по этим законам может считаться «передачей» данных для таргетированной рекламы. Ты можешь отказаться от этого, удалив или сбросив рекламный идентификатор в настройках Android или в «Профиль» › «Настройки рекламы», если приложение показывает этот пункт. Права, описанные выше, можно осуществить, написав нам. Это никак не изменит наше отношение к тебе.","Возраст: Tanetto предназначено для людей от 16 лет.","Изменения: если эта политика изменится, актуальная версия всегда будет на этой странице. Последнее обновление: 11.11.2026."],"terms":["Tanetto предоставляется как есть, без гарантии бесперебойной работы, и может меняться со временем.","Приложение помогает формировать маленькие ежедневные привычки вместе с виртуальным питомцем и не заменяет медицинскую или психологическую консультацию.","Всё, что ты пишешь, принадлежит тебе: на твоём устройстве и, если ты пользуешься аккаунтом, в твоей личной копии. Пользуйся приложением спокойно, не перегружая себя.","Платные функции: Tanetto бесплатно. Tanetto Plus (подписка на месяц или год) и наборы Tanì необязательны и покупаются через Google Play, который обрабатывает оплату, продления, отмены и возвраты по своим условиям. Подписка продлевается автоматически, пока ты не отменишь её в Google Play › Подписки: отмена останавливает следующее продление, а Plus остаётся активным до конца уже оплаченного периода. Tanì — виртуальная валюта только для приложения: она не имеет денежной ценности и не обменивается на деньги.","Иллюстрации, тексты, музыка и код Tanetto защищены авторским правом и не могут копироваться или использоваться повторно без разрешения.","По любым вопросам можно написать по контакту, указанному в политике конфиденциальности."],"back":"Вернуться в Tanetto","del":"Удаление аккаунта Tanetto"},"pl":{"lang":"Polski","locale":"pl-PL","privB":"Polityka prywatności","termsB":"Warunki korzystania","priv":["Administrator danych: Snugbloom Studio, nazwa handlowa niezależnego dewelopera z siedzibą we Włoszech. Imię i nazwisko oraz adres pocztowy dewelopera są podane w informacjach o deweloperze na stronie Tanetto w Google Play. Kontakt: tanettoapp@gmail.com.","Jakie dane: Tanetto działa także bez konta. Wtedy twój towarzysz, cele, dziennik, ogród i postępy są zapisywane wyłącznie w pamięci tego urządzenia i nie są nikomu przesyłane. Myśli zapisane w „Puść to” nie są w ogóle zachowywane.","Jeśli wpiszesz swoje imię do powitania (to dobrowolne), jest ono zapisywane tak samo: na twoim urządzeniu i, jeśli masz konto, w kopii zapasowej online.","Kopia danych: jeśli dotkniesz „Zapisz kopię”, Tanetto utworzy plik z twoimi postępami bezpośrednio na twoim urządzeniu. Plik zostaje u ciebie i nie jest nikomu przesyłany. Przy „Przywróć kopię” plik jest odczytywany wyłącznie przez twoje urządzenie.","Konto opcjonalne i kopia online: jeśli zdecydujesz się założyć konto (przez Google albo e-mail i hasło), przechowujemy twój adres e-mail i kopię twoich postępów wyłącznie po to, abyś mógł się zalogować i je przywrócić. Dane przechowuje Google Firebase (Google Ireland Ltd.) na serwerach w Unii Europejskiej; są przesyłane w formie zaszyfrowanej i dostępne tylko z twojego konta. Samo logowanie (Firebase Authentication) obsługuje Google w Stanach Zjednoczonych, na podstawie EU-US Data Privacy Framework. Podstawa prawna: świadczenie usługi, o którą prosisz (art. 6 ust. 1 lit. b RODO). Kopia jest przechowywana do momentu usunięcia profilu: możesz to zrobić w każdej chwili w Profil › Konto i kopia zapasowa › Zarządzaj kontem › Usuń profil albo na stronie tanettoapp.github.io/Tanetto/elimina-account.html. Konto i kopia są usuwane od razu.","Zakupy: płatności za Tanetto Plus i pakiety Tanì obsługuje w całości Google Play. Nigdy nie otrzymujemy danych twojej karty ani płatności: Google przekazuje aplikacji tylko informację, które zakupy są aktywne, aby je odblokować.","Anonimowe statystyki: aby sprawdzić, czy aplikacja jest przydatna, liczymy niektóre działania w formie zbiorczej, na przykład jak często aplikacja jest otwierana lub czy jest używana w kolejnych dniach. Korzystamy z GoatCounter, usługi statystycznej bez plików cookie i bez profili. Aby przesłać licznik, urządzenie łączy się z usługą, która technicznie otrzymuje adres IP, ale nie przechowuje go w sposób umożliwiający identyfikację. Podstawa prawna: prawnie uzasadniony interes polegający na ulepszaniu aplikacji (art. 6 ust. 1 lit. f RODO).","Hosting: strony aplikacji są hostowane przez zewnętrznego dostawcę, który może rejestrować adres IP ze względów technicznych i bezpieczeństwa, zgodnie z własną polityką prywatności.","Pliki cookie: Tanetto samo nie używa śledzących plików cookie. Pamięć lokalna służy wyłącznie do działania aplikacji i jest ściśle niezbędna. W aplikacji na Androida możesz obejrzeć krótką reklamę, aby dostać małą nagrodę, ale tylko jeśli chcesz: reklamy nigdy nie pojawiają się same, tylko wtedy, gdy zdecydujesz się którąś obejrzeć.","Filmy z nagrodą (tylko aplikacja na Androida): reklamy dostarcza Google AdMob (Google Ireland Ltd. i Google LLC; dane mogą być przetwarzane także w Stanach Zjednoczonych). Google przetwarza te dane jako niezależny administrator, zgodnie z własną polityką prywatności (https://policies.google.com/privacy); przekazywanie danych do USA opiera się na ramach ochrony danych UE-USA (EU-US Data Privacy Framework). Tanetto nigdy nie otrzymuje twojego identyfikatora reklamowego. Tam, gdzie wymaga tego prawo (Europejski Obszar Gospodarczy, Wielka Brytania i Szwajcaria), zanim pojawi się jakakolwiek reklama, prosimy o twoją zgodę za pomocą narzędzia Google do zarządzania zgodami (UMP); możesz ją zmienić w każdej chwili w Profil › Ustawienia reklam. Aby przygotować i wyświetlić filmy, Google może zbierać identyfikator reklamowy urządzenia, adres IP i informacje o twojej interakcji z reklamami, aby je wyświetlać, mierzyć ich skuteczność i zapobiegać oszustwom, a tylko za twoją zgodą — aby je personalizować. Podstawa prawna: twoja zgoda, gdy jest wymagana (art. 6 ust. 1 lit. a RODO), oraz prawnie uzasadniony interes polegający na oferowaniu dobrowolnych nagród i zapobieganiu oszustwom (art. 6 ust. 1 lit. f RODO). Identyfikator reklamowy możesz zresetować lub usunąć w ustawieniach Androida. Jak Google wykorzystuje te dane: https://policies.google.com/technologies/partner-sites. Możesz obejrzeć maksymalnie 5 filmów dziennie, a z Tanetto Plus nie widzisz żadnych reklam. Google może też w tych samych celach zbierać dane diagnostyczne usługi reklamowej (np. o awariach i wydajności) i ustalać przybliżoną lokalizację na podstawie twojego adresu IP.","Przechowywanie: dane na urządzeniu pozostają tam, dopóki ich nie usuniesz. Możesz to zrobić w każdej chwili przez „Zacznij od nowa” lub czyszcząc dane przeglądarki. Statystyki to wyłącznie liczby zbiorcze.","Twoje prawa: możesz żądać informacji, dostępu do danych, ich sprostowania, usunięcia i ograniczenia przetwarzania, a także wnieść sprzeciw wobec przetwarzania, pisząc na powyższy adres kontaktowy. Możesz też złożyć skargę do organu ochrony danych (w Polsce: Prezes Urzędu Ochrony Danych Osobowych). Możesz też poprosić o kopię swoich danych w formacie umożliwiającym ich przeniesienie oraz w każdej chwili wycofać zgodę, bez wpływu na wcześniejsze przetwarzanie.","Prawa do prywatności w stanach USA: jeśli mieszkasz w stanie USA, w którym obowiązuje ustawa o ochronie prywatności konsumentów, np. w Kalifornii, informujemy, że nie sprzedajemy twoich danych osobowych za pieniądze. Wyświetlanie filmów z nagrodą przez Google AdMob może jednak według tych przepisów być uznane za „udostępnianie” danych na potrzeby reklamy ukierunkowanej. Możesz się temu sprzeciwić, usuwając lub resetując identyfikator reklamowy w ustawieniach Androida albo w Profil › Ustawienia reklam, jeśli aplikacja pokazuje tę opcję. Opisane wyżej prawa wykonasz, pisząc do nas. Korzystanie z tych praw nigdy nie zmieni tego, jak cię traktujemy.","Wiek: Tanetto jest przeznaczone dla osób, które ukończyły 16 lat.","Zmiany: jeśli ta polityka się zmieni, aktualna wersja zawsze będzie dostępna na tej stronie. Ostatnia aktualizacja: 11.11.2026."],"terms":["Tanetto jest udostępniane w obecnej postaci, bez gwarancji nieprzerwanego działania, i może się z czasem zmieniać.","Aplikacja pomaga budować małe codzienne nawyki z wirtualnym towarzyszem i nie zastępuje porady lekarskiej ani psychologicznej.","To, co piszesz, należy do ciebie: na twoim urządzeniu, a jeśli używasz konta, także w twojej osobistej kopii. Korzystaj z aplikacji spokojnie, bez zmuszania się.","Funkcje płatne: Tanetto jest darmowe. Tanetto Plus (subskrypcja miesięczna lub roczna) i pakiety Tanì są opcjonalne i kupuje się je przez Google Play, który obsługuje płatności, odnowienia, anulowania i zwroty zgodnie z własnymi warunkami. Subskrypcje odnawiają się automatycznie, dopóki nie anulujesz ich w Google Play › Subskrypcje: anulowanie zatrzymuje kolejne odnowienie, a Plus działa do końca opłaconego okresu. Tanì to wirtualna waluta do używania tylko w aplikacji: nie ma wartości pieniężnej i nie można jej wymienić na pieniądze.","Ilustracje, teksty, muzyka i kod Tanetto są chronione prawem autorskim i nie mogą być kopiowane ani ponownie wykorzystywane bez zgody.","W razie pytań możesz napisać na adres kontaktowy podany w polityce prywatności."],"back":"Wróć do Tanetto","del":"Usuń swoje konto Tanetto"},"nl":{"lang":"Nederlands","locale":"nl-NL","privB":"Privacybeleid","termsB":"Gebruiksvoorwaarden","priv":["Verwerkingsverantwoordelijke: Snugbloom Studio, de handelsnaam van een zelfstandige ontwikkelaar in Italië. De volledige naam en het postadres van de ontwikkelaar staan bij de ontwikkelaarsinformatie op de Google Play-pagina van Tanetto. Contact: tanettoapp@gmail.com.","Welke gegevens: Tanetto werkt ook zonder account. In dat geval worden je maatje, doelen, dagboek, tuin en voortgang alleen in het geheugen van dit apparaat opgeslagen en naar niemand verstuurd. Gedachten die je schrijft bij “Laat het los” worden helemaal niet opgeslagen.","Als je je naam invult voor de begroeting (dat is vrijwillig), wordt die op dezelfde manier bewaard: op je apparaat en, als je een account hebt, in de online back-up.","Kopie van je gegevens: als je op “Kopie opslaan” tikt, maakt Tanetto direct op je apparaat een bestand met je voortgang. Het bestand blijft bij jou en wordt naar niemand verstuurd. Met “Kopie terugzetten” wordt het bestand alleen door je apparaat gelezen.","Optioneel account en online back-up: als je ervoor kiest een account te maken (met Google of met e-mail en wachtwoord), bewaren we je e-mailadres en een kopie van je voortgang, alleen zodat je kunt inloggen en hem kunt terugzetten. De gegevens worden bewaard door Google Firebase (Google Ireland Ltd.) op servers in de Europese Unie, versleuteld verstuurd en zijn alleen met jouw account toegankelijk. Het inloggen zelf (Firebase Authentication) handelt Google af in de Verenigde Staten, op basis van het EU-VS Data Privacy Framework. Rechtsgrond: uitvoering van de dienst waar je om vraagt (art. 6 lid 1 sub b AVG). De back-up blijft bewaard tot je je profiel verwijdert: dat kan altijd via Profiel › Account en back-up › Account beheren › Profiel verwijderen, of op de pagina tanettoapp.github.io/Tanetto/elimina-account.html. Account en back-up worden meteen verwijderd.","Aankopen: betalingen voor Tanetto Plus en Tanì-pakketten worden volledig door Google Play afgehandeld. We ontvangen nooit je kaart- of betaalgegevens: Google laat de app alleen weten welke aankopen actief zijn, zodat ze worden ontgrendeld.","Anonieme statistieken: om te begrijpen of de app nuttig is, tellen we sommige acties in geaggregeerde vorm, bijvoorbeeld hoe vaak de app wordt geopend of of hij de dagen erna wordt gebruikt. We gebruiken GoatCounter, een statistiekdienst zonder cookies en zonder profielen. Om de telling te versturen maakt het apparaat verbinding met de dienst, die technisch gezien het IP-adres ontvangt zonder het op een herleidbare manier op te slaan. Rechtsgrond: gerechtvaardigd belang bij het verbeteren van de app (artikel 6, lid 1, onder f AVG).","Hosting: de pagina's van de app worden gehost door een externe aanbieder, die het IP-adres om technische en beveiligingsredenen kan vastleggen volgens zijn eigen privacybeleid.","Cookies: Tanetto gebruikt zelf geen trackingcookies. Lokale opslag wordt alleen gebruikt om de app te laten werken en is strikt noodzakelijk. In de Android-app kun je ervoor kiezen korte advertenties te bekijken om een kleine beloning te krijgen: ze verschijnen nooit vanzelf, alleen als jij ervoor kiest er een te bekijken.","Video's met beloning (alleen Android-app): de advertenties worden geleverd door Google AdMob (Google Ireland Ltd. en Google LLC; gegevens kunnen ook in de Verenigde Staten worden verwerkt). Google verwerkt deze gegevens als zelfstandige verwerkingsverantwoordelijke volgens zijn eigen privacybeleid (https://policies.google.com/privacy); doorgifte naar de VS is gebaseerd op het EU-VS-gegevensprivacykader (Data Privacy Framework). Tanetto zelf ontvangt je advertentie-ID nooit. Waar de wet dat vereist (Europese Economische Ruimte, Verenigd Koninkrijk en Zwitserland), vragen we je toestemming met de toestemmingstool van Google (UMP) voordat er een advertentie wordt getoond; je kunt die altijd wijzigen via Profiel › Advertentiekeuzes. Om de video's voor te bereiden en te tonen, kan Google de advertentie-ID van je apparaat, je IP-adres en informatie over je interactie met de advertenties verzamelen, om ze te tonen, te meten en fraude te voorkomen en, alleen met je toestemming, om ze te personaliseren. Rechtsgrond: je toestemming, waar die vereist is (art. 6 lid 1 sub a AVG), en het gerechtvaardigd belang bij het aanbieden van vrijwillige beloningen en het voorkomen van fraude (art. 6 lid 1 sub f AVG). Je kunt de advertentie-ID resetten of verwijderen in de instellingen van Android. Hoe Google deze gegevens gebruikt: https://policies.google.com/technologies/partner-sites. Je kunt maximaal 5 video's per dag bekijken, en met Tanetto Plus zie je helemaal geen advertenties. Google kan voor dezelfde doeleinden ook diagnostische gegevens over de advertentiedienst verzamelen (bijvoorbeeld crashes en prestaties) en uit je IP-adres een globale locatie afleiden.","Bewaartermijn: gegevens op het apparaat blijven bewaard tot je ze verwijdert. Dat kan op elk moment met “Opnieuw beginnen” of door je browsergegevens te wissen. Statistieken zijn alleen geaggregeerde getallen.","Je rechten: je kunt om informatie, inzage, rectificatie, verwijdering en beperking vragen en bezwaar

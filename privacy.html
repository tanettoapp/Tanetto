строго необходимым. В приложении для Android ты можешь по желанию посмотреть короткую рекламу и получить небольшую награду: реклама никогда не появляется сама, а только когда ты решишь её посмотреть.","Видео с наградой (только приложение для Android): рекламу предоставляет Google AdMob (Google Ireland Ltd. и Google LLC; данные могут обрабатываться и в США). Google обрабатывает эти данные как самостоятельный контролёр согласно собственной политике конфиденциальности (https://policies.google.com/privacy); передача данных в США основана на EU-US Data Privacy Framework. Само Tanetto твой рекламный идентификатор никогда не получает. Там, где этого требует закон (Европейская экономическая зона, Великобритания и Швейцария), прежде чем показать какую-либо рекламу, мы просим твоего согласия с помощью инструмента Google для управления согласием (UMP); изменить его можно в любой момент в «Профиль» › «Приватность и возраст» › «Настройки рекламы». Чтобы подготовить и показать видео, Google может собирать рекламный идентификатор устройства, IP-адрес и сведения о твоём взаимодействии с рекламой — чтобы показывать её, оценивать её эффективность и предотвращать мошенничество, а только с твоего согласия — чтобы её персонализировать. Правовое основание: твоё согласие, когда оно требуется (ст. 6(1)(a) GDPR), и законный интерес в том, чтобы предлагать необязательные награды и предотвращать мошенничество (ст. 6(1)(f) GDPR). Рекламный идентификатор можно сбросить или удалить в настройках Android. Как Google использует эти данные: https://policies.google.com/technologies/partner-sites. В день можно посмотреть не больше 5 видео, а с Tanetto Plus реклама не показывается совсем. С теми же целями Google может также собирать диагностические данные о работе рекламного сервиса (например, о сбоях и производительности) и определять примерное местоположение по твоему IP-адресу.","Срок хранения: данные на устройстве хранятся, пока ты их не удалишь. Это можно сделать в любой момент через «Начать заново» или очистив данные браузера. Статистика — это только обобщённые числа.","Твои права: ты можешь запросить информацию, доступ, исправление, удаление и ограничение обработки, а также возразить против обработки, написав по указанному выше контакту. Также можно подать жалобу в свой надзорный орган по защите данных (в Великобритании — ICO). Также можно запросить копию своих данных в переносимом формате и в любой момент отозвать согласие; это не влияет на обработку, которая была до отзыва.","Права на конфиденциальность в штатах США: если ты живёшь в штате США, где действует закон о защите данных потребителей (например, в Калифорнии), мы не продаём твои персональные данные за деньги. Однако показ видео с наградой через Google AdMob по этим законам может считаться «передачей» данных для таргетированной рекламы. Ты можешь отказаться от этого, удалив или сбросив рекламный идентификатор в настройках Android или в «Профиль» › «Приватность и возраст» › «Настройки рекламы», если приложение показывает этот пункт. Права, описанные выше, можно осуществить, написав нам. Это никак не изменит наше отношение к тебе.","Дети и подростки: Tanetto подходит для любого возраста. В первый раз мы спрашиваем месяц и год рождения, и эти данные остаются только на твоём устройстве. До 13 лет, или если ты не хочешь говорить, показываются только подходящие детям видео с наградой, никогда не персонализированные, и рекламный идентификатор не передаётся. До возраста цифрового согласия в твоей стране (16 лет, если закон не устанавливает меньший) реклама никогда не персонализируется, а онлайн-копия с аккаунтом недоступна: данные остаются только на устройстве, и копию можно сохранить в файл. В чате с питомцем только заранее написанные ответы, и он никому ничего не отправляет. Tanì нельзя обменять на деньги: это просто игровые монетки. Tanetto Plus и наборы Tanì оплачиваются только через Google Play. В США Tanetto не собирает личную информацию детей младше 13 лет: технический идентификатор получают только GoatCounter (IP-адрес, только для подсчёта и без хранения) и Google AdMob (подходящая детям неперсонализированная реклама без рекламного идентификатора). Родители и опекуны могут написать на tanettoapp@gmail.com с любым вопросом или просьбой.","Изменения: если эта политика изменится, актуальная версия всегда будет на этой странице. Последнее обновление: 14.11.2026."],"terms":["Мы стараемся, чтобы Tanetto работал стабильно и со временем становился лучше; это не ограничивает твои права потребителя по закону.","Приложение помогает формировать маленькие ежедневные привычки вместе с виртуальным питомцем и не заменяет медицинскую или психологическую консультацию.","Всё, что ты пишешь, принадлежит тебе: на твоём устройстве и, если ты пользуешься аккаунтом, в твоей личной копии. Пользуйся приложением спокойно, не перегружая себя.","Платные функции: Tanetto можно скачать бесплатно. Tanetto Plus (подписка на месяц или год) и наборы Tanì необязательны и покупаются через Google Play, который обрабатывает оплату, продления, отмены и возвраты по своим условиям. Подписка продлевается автоматически, пока ты не отменишь её в Google Play › Подписки: отмена останавливает следующее продление, а Plus остаётся активным до конца уже оплаченного периода. Tanì — виртуальная валюта только для приложения: она не имеет денежной ценности и не обменивается на деньги.","Если тебе ещё нет 18 лет, перед любой покупкой спроси разрешения у родителей или опекуна.","Платный цифровой контент (Tanetto Plus и Tanì) становится доступен сразу после покупки; возвраты осуществляются по правилам Google Play и в соответствии с твоими законными правами.","Иллюстрации, тексты, музыка и код Tanetto защищены авторским правом и не могут копироваться или использоваться повторно без разрешения.","Эти условия регулируются законодательством Италии; если ты потребитель, за тобой также сохраняется защита по законам страны, где ты живёшь.","По любым вопросам можно написать по контакту, указанному в политике конфиденциальности."],"back":"Вернуться в Tanetto","del":"Удаление аккаунта Tanetto"},"pl":{"lang":"Polski","locale":"pl-PL","privB":"Polityka prywatności","termsB":"Warunki korzystania","priv":["W skrócie: twój towarzysz, cele i dziennik zostają na tym telefonie. Wpisanie imienia jest dobrowolne, czat nikomu niczego nie wysyła, a reklamy to tylko krótkie filmiki, które oglądasz wtedy, gdy chcesz. Jeśli coś jest niejasne, zapytaj dorosłą osobę, której ufasz.","Administrator danych: Snugbloom Studio, Włochy. Kontakt: tanettoapp@gmail.com.","Jakie dane: Tanetto działa także bez konta. Wtedy twój towarzysz, cele, dziennik, ogród i postępy są zapisywane wyłącznie w pamięci tego urządzenia i nie są nikomu przesyłane. Myśli zapisane w „Puść to” nie są w ogóle zachowywane.","Jeśli wpiszesz swoje imię do powitania (to dobrowolne), jest ono zapisywane tak samo: na twoim urządzeniu i, jeśli masz konto, w kopii zapasowej online.","Kopia danych: jeśli dotkniesz „Zapisz kopię”, Tanetto utworzy plik z twoimi postępami bezpośrednio na twoim urządzeniu. Plik zostaje u ciebie i nie jest nikomu przesyłany. Przy „Przywróć kopię” plik jest odczytywany wyłącznie przez twoje urządzenie.","Konto opcjonalne i kopia online: jeśli zdecydujesz się założyć konto (przez Google albo e-mail i hasło), przechowujemy twój adres e-mail i kopię twoich postępów wyłącznie po to, abyś mógł się zalogować i je przywrócić. Dane przechowuje Google Firebase (Google Ireland Ltd.) na serwerach w Unii Europejskiej; są przesyłane w formie zaszyfrowanej i dostępne tylko z twojego konta. Samo logowanie (Firebase Authentication) obsługuje Google w Stanach Zjednoczonych, na podstawie EU-US Data Privacy Framework. Podstawa prawna: świadczenie usługi, o którą prosisz (art. 6 ust. 1 lit. b RODO). Kopia jest przechowywana do momentu usunięcia profilu: możesz to zrobić w każdej chwili w Profil › Konto i dane › Zarządzaj kontem › Usuń profil albo na stronie tanettoapp.github.io/Tanetto/elimina-account.html. Konto i kopia są usuwane od razu.","Zakupy: płatności za Tanetto Plus i pakiety Tanì obsługuje w całości Google Play. Nigdy nie otrzymujemy danych twojej karty ani płatności: Google przekazuje aplikacji tylko informację, które zakupy są aktywne, aby je odblokować.","Anonimowe statystyki: aby sprawdzić, czy aplikacja jest przydatna, liczymy niektóre działania w formie zbiorczej, na przykład jak często aplikacja jest otwierana, czy jest używana w kolejnych dniach albo z których części się korzysta (np. ze sklepu lub gier), a także otrzymujemy anonimowe raporty o błędach (tylko rodzaj błędu, nigdy to, co piszesz). Korzystamy z GoatCounter, usługi statystycznej bez plików cookie i bez profili, prowadzonej z Irlandii, z danymi na serwerach w Unii Europejskiej (Finlandia i Niemcy). Aby przesłać licznik, urządzenie łączy się z usługą, która technicznie otrzymuje adres IP, ale nie przechowuje go w sposób umożliwiający identyfikację. Podstawa prawna: prawnie uzasadniony interes polegający na ulepszaniu aplikacji (art. 6 ust. 1 lit. f RODO). Statystyki możesz w każdej chwili wyłączyć w Profil › Prywatność i wiek. Są zawsze wyłączone dla osób poniżej wieku zgody cyfrowej lub bez podanego wieku, a przed pytaniem o wiek nic nie jest liczone.","Hosting: strony aplikacji są hostowane przez zewnętrznego dostawcę, który może rejestrować adres IP ze względów technicznych i bezpieczeństwa, zgodnie z własną polityką prywatności.","Pliki cookie: Tanetto samo nie używa śledzących plików cookie. Pamięć lokalna służy wyłącznie do działania aplikacji (i do tego, by nie liczyć statystyk dwa razy) i jest ściśle niezbędna. W aplikacji na Androida możesz obejrzeć krótką reklamę, aby dostać małą nagrodę, ale tylko jeśli chcesz: reklamy nigdy nie pojawiają się same, tylko wtedy, gdy zdecydujesz się którąś obejrzeć.","Filmy z nagrodą (tylko aplikacja na Androida): reklamy dostarcza Google AdMob (Google Ireland Ltd. i Google LLC; dane mogą być przetwarzane także w Stanach Zjednoczonych). Google przetwarza te dane jako niezależny administrator, zgodnie z własną polityką prywatności (https://policies.google.com/privacy); przekazywanie danych do USA opiera się na ramach ochrony danych UE-USA (EU-US Data Privacy Framework). Tanetto nigdy nie otrzymuje twojego identyfikatora reklamowego. Tam, gdzie wymaga tego prawo (Europejski Obszar Gospodarczy, Wielka Brytania i Szwajcaria), zanim pojawi się jakakolwiek reklama, prosimy o twoją zgodę za pomocą narzędzia Google do zarządzania zgodami (UMP); możesz ją zmienić w każdej chwili w Profil › Prywatność i wiek › Ustawienia reklam. Aby przygotować i wyświetlić filmy, Google może zbierać identyfikator reklamowy urządzenia, adres IP i informacje o twojej interakcji z reklamami, aby je wyświetlać, mierzyć ich skuteczność i zapobiegać oszustwom, a tylko za twoją zgodą — aby je personalizować. Podstawa prawna: twoja zgoda, gdy jest wymagana (art. 6 ust. 1 lit. a RODO), oraz prawnie uzasadniony interes polegający na oferowaniu dobrowolnych nagród i zapobieganiu oszustwom (art. 6 ust. 1 lit. f RODO). Identyfikator reklamowy możesz zresetować lub usunąć w ustawieniach Androida. Jak Google wykorzystuje te dane: https://policies.google.com/technologies/partner-sites. Możesz obejrzeć maksymalnie 5 filmów dziennie, a z Tanetto Plus nie widzisz żadnych reklam. Google może też w tych samych celach zbierać dane diagnostyczne usługi reklamowej (np. o awariach i wydajności) i ustalać przybliżoną lokalizację na podstawie twojego adresu IP.","Przechowywanie: dane na urządzeniu pozostają tam, dopóki ich nie usuniesz. Możesz to zrobić w każdej chwili przez „Zacznij od nowa” lub czyszcząc dane przeglądarki. Statystyki to wyłącznie liczby zbiorcze.","Twoje prawa: możesz żądać informacji, dostępu do danych, ich sprostowania, usunięcia i ograniczenia przetwarzania, a także wnieść sprzeciw wobec przetwarzania, pisząc na powyższy adres kontaktowy. Możesz też złożyć skargę do organu ochrony danych (w Polsce: Prezes Urzędu Ochrony Danych Osobowych). Możesz też poprosić o kopię swoich danych w formacie umożliwiającym ich przeniesienie oraz w każdej chwili wycofać zgodę, bez wpływu na wcześniejsze przetwarzanie.","Prawa do prywatności w stanach USA: jeśli mieszkasz w stanie USA, w którym obowiązuje ustawa o ochronie prywatności konsumentów, np. w Kalifornii, informujemy, że nie sprzedajemy twoich danych osobowych za pieniądze. Wyświetlanie filmów z nagrodą przez Google AdMob może jednak według tych przepisów być uznane za „udostępnianie” danych na potrzeby reklamy ukierunkowanej. Możesz się temu sprzeciwić, usuwając lub resetując identyfikator reklamowy w ustawieniach Androida albo w Profil › Prywatność i wiek › Ustawienia reklam, jeśli aplikacja pokazuje tę opcję. Opisane wyżej prawa wykonasz, pisząc do nas. Korzystanie z tych praw nigdy nie zmieni tego, jak cię traktujemy.","Dzieci i nastolatki: Tanetto jest dla osób w każdym wieku. Za pierwszym razem pytamy o miesiąc i rok urodzenia; te dane zostają tylko na twoim urządzeniu. Poniżej 13 lat, albo jeśli wolisz nie mówić, filmiki z nagrodą są tylko odpowiednie dla dzieci, nigdy spersonalizowane, a identyfikator reklamowy nie jest wysyłany. Poniżej wieku zgody cyfrowej w twoim kraju (w Polsce 16 lat) reklamy nigdy nie są spersonalizowane, a kopia online z kontem jest niedostępna: dane zostają tylko na urządzeniu, a kopię możesz zapisać w pliku. Czat z towarzyszem ma tylko gotowe odpowiedzi i nikomu niczego nie wysyła. Tanì to monety z gry, a nie prawdziwe pieniądze; za Tanetto Plus i pakiety Tanì płaci się tylko przez Google Play. W Stanach Zjednoczonych Tanetto nie zbiera danych osobowych dzieci poniżej 13 lat: techniczny identyfikator otrzymują tylko GoatCounter (adres IP, wyłącznie do liczenia i bez przechowywania) oraz Google AdMob (reklamy odpowiednie dla dzieci, niespersonalizowane i bez identyfikatora reklamowego). Rodzice i opiekunowie mogą pisać na adres tanettoapp@gmail.com z każdym pytaniem lub prośbą.","Zmiany: jeśli ta polityka się zmieni, aktualna wersja zawsze będzie dostępna na tej stronie. Ostatnia aktualizacja: 14.11.2026."],"terms":["Staramy się, aby Tanetto działało dobrze i z czasem było coraz lepsze; nie ogranicza to twoich praw konsumenta wynikających z przepisów.","Aplikacja pomaga budować małe codzienne nawyki z wirtualnym towarzyszem i nie zastępuje porady lekarskiej ani psychologicznej.","To, co piszesz, należy do ciebie: na twoim urządzeniu, a jeśli używasz konta, także w twojej osobistej kopii. Korzystaj z aplikacji spokojnie, bez zmuszania się.","Funkcje płatne: Tanetto można pobrać za darmo. Tanetto Plus (subskrypcja miesięczna lub roczna) i pakiety Tanì są opcjonalne i kupuje się je przez Google Play, który obsługuje płatności, odnowienia, anulowania i zwroty zgodnie z własnymi warunkami. Subskrypcje odnawiają się automatycznie, dopóki nie anulujesz ich w Google Play › Subskrypcje: anulowanie zatrzymuje kolejne odnowienie, a Plus działa do końca opłaconego okresu. Tanì to wirtualna waluta do używania tylko w aplikacji: nie ma wartości pieniężnej i nie można jej wymienić na pieniądze.","Jeśli nie masz jeszcze 18 lat, przed zakupem zapytaj rodzica lub opiekuna.","Płatne treści cyfrowe (Tanetto Plus i Tanì) są dostępne od razu po zakupie; zwroty odbywają się zgodnie z zasadami Google Play i twoimi prawami.","Ilustracje, teksty, muzyka i kod Tanetto są chronione prawem autorskim i nie mogą być kopiowane ani ponownie wykorzystywane bez zgody.","Te warunki podlegają prawu włoskiemu; jako konsument zachowujesz też ochronę wynikającą z prawa kraju, w którym mieszkasz.","W razie pytań możesz napisać na adres kontaktowy podany w polityce prywatności."],"back":"Wróć do Tanetto","del":"Usuń swoje konto Tanetto"},"nl":{"lang":"Nederlands","locale":"nl-NL","privB":"Privacybeleid","termsB":"Gebruiksvoorwaarden","priv":["In het kort: je maatje, doelen en dagboek blijven op deze telefoon. Je naam invullen is niet verplicht, de chat verstuurt niets naar iemand en de enige advertenties zijn korte video's die jij zelf kiest om te bekijken. Is iets niet duidelijk? Vraag het aan een volwassene die je vertrouwt.","Verwerkingsverantwoordelijke: Snugbloom Studio, Italië. Contact: tanettoapp@gmail.com.","Welke gegevens: Tanetto werkt ook zonder account. In dat geval worden je maatje, doelen, dagboek, tuin en voortgang alleen in het geheugen van dit apparaat opgeslagen en naar niemand verstuurd. Gedachten die je schrijft bij “Laat het los” worden helemaal niet opgeslagen.","Als je je naam invult voor de begroeting (dat is vrijwillig), wordt die op dezelfde manier bewaard: op je apparaat en, als je een account hebt, in de online back-up.","Kopie van je gegevens: als je op “Kopie opslaan” tikt, maakt Tanetto direct op je apparaat een bestand met je voortgang. Het bestand blijft bij jou en wordt naar niemand verstuurd. Met “Kopie terugzetten” wordt het bestand alleen door je apparaat gelezen.","Optioneel account en online back-up: als je ervoor kiest een account te maken (met Google of met e-mail en wachtwoord), bewaren we je e-mailadres en een kopie van je voortgang, alleen zodat je kunt inloggen en hem kunt terugzetten. De gegevens worden bewaard door Google Firebase (Google Ireland Ltd.) op servers in de Europese Unie, versleuteld verstuurd en zijn alleen met jouw account toegankelijk. Het inloggen zelf (Firebase Authentication) handelt Google af in de Verenigde Staten, op basis van het EU-VS Data Privacy Framework. Rechtsgrond: uitvoering van de dienst waar je om vraagt (art. 6 lid 1 sub b AVG). De back-up blijft bewaard tot je je profiel verwijdert: dat kan altijd via Profiel › Account en gegevens › Account beheren › Profiel verwijderen, of op de pagina tanettoapp.github.io/Tanetto/elimina-account.html. Account en back-up worden meteen verwijderd.","Aankopen: betalingen voor Tanetto Plus en Tanì-pakketten worden volledig door Google Play afgehandeld. We ontvangen nooit je kaart- of betaalgegevens: Google laat de app alleen weten welke aankopen actief zijn, zodat ze worden ontgrendeld.","Anonieme statistieken: om te begrijpen of de app nuttig is, tellen we sommige acties in geaggregeerde vorm, bijvoorbeeld hoe vaak de app wordt geopend, of hij de dagen erna wordt gebruikt of welke onderdelen worden gebruikt (zoals de winkel of de spelletjes), en we ontvangen anonieme foutmeldingen (alleen het soort fout, nooit wat jij schrijft). We gebruiken GoatCounter, een statistiekdienst zonder cookies en zonder profielen, beheerd vanuit Ierland, met gegevens op servers in de Europese Unie (Finland en Duitsland). Om de telling te versturen maakt het apparaat verbinding met de dienst, die technisch gezien het IP-adres ontvangt zonder het op een herleidbare manier op te slaan. Rechtsgrond: gerechtvaardigd belang bij het verbeteren van de app (artikel 6, lid 1, onder f AVG). Je kunt de statistieken altijd uitzetten in Profiel › Privacy en leeftijd. Ze staan altijd uit voor iedereen onder de leeftijd van digitale toestemming of zonder opgegeven leeftijd, en vóór de vraag over je leeftijd wordt niets geteld.","Hosting: de pagina's van de app worden gehost door een externe aanbieder, die het IP-adres om technische en beveiligingsredenen kan vastleggen volgens zijn eigen privacybeleid.","Cookies: Tanetto gebruikt zelf geen trackingcookies. Lokale opslag wordt alleen gebruikt om de app te laten werken (en om statistieken niet dubbel te tellen) en is strikt noodzakelijk. In de Android-app kun je ervoor kiezen korte advertenties te bekijken om een kleine beloning te krijgen: ze verschijnen nooit vanzelf, alleen als jij ervoor kiest er een te bekijken.","Video's met beloning (alleen Android-app): de advertenties worden geleverd door Google AdMob (Google Ireland Ltd. en Google LLC; gegevens kunnen ook in de Verenigde Staten worden verwerkt). Google verwerkt deze gegevens als zelfstandige verwerkingsverantwoordelijke volgens zijn eigen privacybeleid (https://policies.google.com/privacy); doorgifte naar de VS is gebaseerd op het EU-VS-gegevensprivacykader (Data Privacy Framework). Tanetto zelf ontvangt je advertentie-ID nooit. Waar de wet dat vereist (Europese Economische Ruimte, Verenigd Koninkrijk en Zwitserland), vragen we je toestemming met de toestemmingstool van Google (UMP) voordat er een advertentie wordt getoond; je kunt die altijd wijzigen via Profiel › Privacy en leeftijd › Advertentiekeuzes. Om de video's voor te bereiden en te tonen, kan Google de advertentie-ID van je apparaat, je IP-adres en informatie over je interactie met de advertenties verzamelen, om ze te tonen, te meten en fraude te voorkomen en, alleen met je toestemming, om ze te personaliseren. Rechtsgrond: je toestemming, waar die vereist is (art. 6 lid 1 sub a AVG), en het gerechtvaardigd belang bij het aanbieden van vrijwillige beloningen en het voorkomen van fraude (art. 6 lid 1 sub f AVG). Je kunt de advertentie-ID resetten of verwijderen in de instellingen van Android. Hoe Google deze gegevens gebruikt: https://policies.google.com/technologies/partner-sites. Je kunt maximaal 5 video's per dag bekijken, en met Tanetto Plus zie je helemaal geen advertenties. Google kan voor dezelfde doeleinden ook diagnostische gegevens over de advertentiedienst verzamelen (bijvoorbeeld crashes en prestaties) en uit je IP-adres een globale locatie afleiden.","Bewaartermijn: gegevens op het apparaat blijven bewaard tot je ze verwijdert. Dat kan op elk moment met “Opnieuw beginnen” of door je browsergegevens te wissen. Statistieken zijn alleen geaggregeerde getallen.","Je rechten: je kunt om informatie, inzage, rectificatie, verwijdering en beperking vragen en bezwaar maken tegen de verwerking, door te schrijven naar het contactadres hierboven. Je kunt ook een klacht indienen bij je toezichthouder voor gegevensbescherming (in Nederland de Autoriteit Persoonsgegevens). Je kunt ook een kopie van je gegevens in een overdraagbaar formaat vragen en je toestemming op elk moment intrekken; dat heeft geen gevolgen voor wat daarvoor is gebeurd.","Privacyrechten in Amerikaanse staten: als je in een Amerikaanse staat woont met een privacywet voor consumenten, zoals Californië, dan verkopen wij je persoonsgegevens niet voor geld. Het tonen van video's met beloning via Google AdMob kan volgens die wetten wel gelden als ‘delen’ voor gerichte advertenties. Je kunt daar bezwaar tegen maken door je advertentie-ID te verwijderen of te resetten in de Android-instellingen, of via Profiel › Privacy en leeftijd › Advertentiekeuzes als de app die optie toont. De rechten hierboven oefen je uit door ons te schrijven. Dat verandert nooit hoe we je behandelen.","Kinderen en tieners: Tanetto is voor alle leeftijden. De eerste keer vragen we je geboortemaand en -jaar; die blijven alleen op je apparaat. Onder de 13 jaar, of als je het liever niet zegt, zie je alleen beloningsvideo's die geschikt zijn voor kinderen, nooit gepersonaliseerd, en wordt de advertentie-ID niet verstuurd. Onder de leeftijd voor digitale toestemming in jouw land (in Nederland 16 jaar) zijn advertenties nooit gepersonaliseerd en is de online back-up met een account niet beschikbaar: je gegevens blijven alleen op het apparaat, en je kunt een kopie in een bestand bewaren. De chat met je maatje heeft alleen vooraf geschreven antwoorden en verstuurt niets naar iemand. Tanì zijn munten uit het spel, geen echt geld; Tanetto Plus en Tanì-pakketten betaal je alleen via Google Play. In de Verenigde Staten verzamelt Tanetto geen persoonsgegevens van kinderen onder de 13: alleen GoatCounter (het IP-adres, alleen om te tellen en zonder het te bewaren) en Google AdMob (niet-gepersonaliseerde advertenties die geschikt zijn voor kinderen, zonder advertentie-ID) ontvangen een technische identificatie. Ouders en voogden kunnen met elke vraag of elk verzoek schrijven naar tanettoapp@gmail.com.","Wijzigingen: als dit beleid verandert, staat de bijgewerkte versie altijd op deze pagina. Laatst bijgewerkt: 14-11-2026."],"terms":["We zorgen ervoor dat Tanetto goed werkt en steeds beter wordt; dit beperkt je wettelijke rechten als consument niet.","De app helpt je kleine dagelijkse gewoontes op te bouwen met een virtueel maatje en vervangt geen medisch of psychologisch advies.","Wat je schrijft is van jou: op je apparaat en, als je een account gebruikt, in je persoonlijke back-up. Gebruik de app rustig, zonder jezelf onder druk te zetten.","Betaalde functies: Tanetto is gratis te downloaden. Tanetto Plus (maand- of jaarabonnement) en Tanì-pakketten zijn optioneel en koop je via Google Play, dat betaling, verlengingen, opzeggingen en terugbetalingen regelt volgens de eigen voorwaarden. Abonnementen worden automatisch verlengd tot je ze opzegt via Google Play › Abonnementen: opzeggen stopt de volgende verlenging en Plus blijft actief tot het einde van de al betaalde periode. Tanì zijn een virtuele munt die je alleen in de app gebruikt: ze hebben geen geldwaarde en kunnen niet worden ingewisseld voor geld.","Ben je minderjarig, vraag dan een ouder of voogd voordat je iets koopt.","Betaalde digitale inhoud (Tanetto Plus en Tanì) is direct na aankoop beschikbaar; terugbetalingen volgen het beleid van Google Play en je wettelijke rechten.","De illustraties, teksten, muziek en code van Tanetto zijn auteursrechtelijk beschermd en mogen niet zonder toestemming worden gekopieerd of hergebruikt.","Op deze voorwaarden is het Italiaanse recht van toepassing; als consument houd je ook de bescherming van het recht van het land waar je woont.","Voor vragen kun je schrijven naar het contactadres in het privacybeleid."],"back":"Terug naar Tanetto","del":"Je Tanetto-account verwijderen"},"tr":{"lang":"Türkçe","locale":"tr-TR","privB":"Gizlilik politikası","termsB":"Kullanım koşulları","priv":["Kısacası: arkadaşın, hedeflerin ve günlüğün bu telefonda kalır. Adını yazmak isteğe bağlıdır, sohbet kimseye hiçbir şey göndermez ve tek reklam, izlemeyi senin seçtiğin kısa videolardır. Anlamadığın bir şey olursa güvendiğin bir yetişkine sor.","Veri sorumlusu: Snugbloom Studio, İtalya. İletişim: tanettoapp@gmail.com.","Hangi veriler: Tanetto hesap olmadan da çalışır. Bu durumda arkadaşın, hedeflerin, günlüğün, bahçen ve ilerlemen yalnızca bu cihazın belleğine kaydedilir ve kimseye gönderilmez. “Bırak gitsin” bölümüne yazılan düşünceler hiç kaydedilmez.","Selamlama için adını yazarsan (isteğe bağlıdır), aynı şekilde saklanır: cihazında ve hesabın varsa çevrimiçi yedekte.","Verilerinin kopyası: “Kopya kaydet”e dokunursan Tanetto ilerlemeni içeren bir dosyayı doğrudan cihazında oluşturur. Dosya sende kalır ve kimseye gönderilmez. “Kopyayı geri yükle” ile dosya yalnızca cihazın tarafından okunur.","İsteğe bağlı hesap ve çevrim içi yedek: Hesap oluşturmayı seçersen (Google ile ya da e-posta ve şifreyle), yalnızca giriş yapabilmen ve ilerlemeni geri yükleyebilmen için e-posta adresini ve ilerlemenin bir kopyasını saklarız. Veriler Google Firebase (Google Ireland Ltd.) tarafından Avrupa Birliği'ndeki sunucularda tutulur, şifreli olarak iletilir ve yalnızca senin hesabınla erişilebilir. Girişin kendisi (Firebase Authentication) ise AB-ABD Veri Gizliliği Çerçevesi kapsamında Google tarafından ABD'de yürütülür. Hukuki dayanak: talep ettiğin hizmetin sunulması (GDPR md. 6/1-b). Yedek, profilini silene kadar saklanır: bunu istediğin zaman Profil › Hesap ve veriler › Hesabı yönet › Profili sil yoluyla ya da tanettoapp.github.io/Tanetto/elimina-account.html sayfasından yapabilirsin. Hesap ve yedek hemen silinir.","Satın alımlar: Tanetto Plus ve Tanì paketlerinin ödemeleri tamamen Google Play tarafından yapılır. Kart veya ödeme bilgilerini asla almayız: Google uygulamaya yalnızca hangi satın alımların etkin olduğunu, kilitleri açmak için bildirir.","Anonim istatistikler: uygulamanın işe yarayıp yaramadığını anlamak için bazı işlemleri toplu olarak sayarız; örneğin uygulamanın ne sıklıkla açıldığını, sonraki günlerde kullanılıp kullanılmadığını ya da hangi bölümlerin (mağaza veya oyunlar gibi) kullanıldığını. Ayrıca anonim hata raporları alırız (yalnızca hatanın türü, yazdıkların asla). Çerez ve profil kullanmayan bir istatistik hizmeti olan GoatCounter'ı kullanırız; hizmet İrlanda'dan yönetilir ve veriler Avrupa Birliği'ndeki (Finlandiya ve Almanya) sunucularda tutulur. Sayımı göndermek için cihaz bu hizmete bağlanır; hizmet teknik olarak IP adresini alır ancak onu kimliği belirlenebilir şekilde saklamaz. Hukuki dayanak: uygulamayı geliştirmeye yönelik meşru menfaat (GDPR / UK GDPR madde 6(1)(f)). İstatistikleri istediğin zaman Profil › Gizlilik ve yaş bölümünden kapatabilirsin. Dijital rıza yaşının altındakiler veya yaşını belirtmeyenler için her zaman kapalıdır ve yaş sorusundan önce hiçbir şey sayılmaz.","Barındırma: uygulamanın sayfaları harici bir sağlayıcı tarafından barındırılır; bu sağlayıcı teknik ve güvenlik nedenleriyle, kendi gizlilik politikası çerçevesinde IP adresini kaydedebilir.","Çerezler: Tanetto'nun kendisi takip çerezi kullanmaz. Yerel depolama yalnızca uygulamanın çalışması (ve istatistiklerin iki kez sayılmaması) için kullanılır ve kesinlikle gereklidir. Android uygulamasında, küçük bir ödül kazanmak için istersen kısa reklamlar izleyebilirsin: reklamlar asla kendiliğinden çıkmaz, yalnızca sen izlemeyi seçtiğinde açılır.","Ödüllü videolar (yalnızca Android uygulaması): reklamlar Google AdMob (Google Ireland Ltd. ve Google LLC) tarafından sağlanır; veriler Amerika Birleşik Devletleri'nde de işlenebilir. Google bu verileri kendi gizlilik politikasına (https://policies.google.com/privacy) göre bağımsız veri sorumlusu olarak işler; ABD'ye aktarımlar AB-ABD Veri Gizliliği Çerçevesi'ne dayanır. Tanetto'nun kendisi reklam kimliğini asla almaz. Yasanın gerektirdiği yerlerde (Avrupa Ekonomik Alanı, Birleşik Krallık ve İsviçre), herhangi bir reklam gösterilmeden önce Google'ın izin yönetimi aracıyla (UMP) iznini isteriz; bu izni istediğin zaman Profil › Gizlilik ve yaş › Reklam tercihleri bölümünden değiştirebilirsin. Videoları hazırlamak ve göstermek için Google, cihazının reklam kimliğini, IP adresini ve reklamlarla etkileşimine ilişkin bilgileri toplayabilir; bunu reklamları sunmak, ölçmek ve dolandırıcılığı önlemek için, yalnızca iznin varsa da reklamları kişiselleştirmek için yapar. Hukuki dayanak: gerektiği durumlarda iznin (GDPR md. 6/1-a) ve isteğe bağlı ödüller sunma ile dolandırıcılığı önlemeye yönelik meşru menfaat (GDPR md. 6/1-f). Reklam kimliğini Android ayarlarından sıfırlayabilir veya silebilirsin. Google'ın bu verileri nasıl kullandığı: https://policies.google.com/technologies/partner-sites. Günde en fazla 5 video izleyebilirsin; Tanetto Plus ile hiç reklam görmezsin. Google ayrıca aynı amaçlarla reklam hizmetine ait tanılama verilerini (örneğin çökmeler ve performans) toplayabilir ve IP adresinden yaklaşık konumunu tahmin edebilir.","Saklama süresi: cihazdaki veriler sen silene kadar kalır. Bunu istediğin zaman “Baştan başla” ile ya da tarayıcı verilerini silerek yapabilirsin. İstatistikler yalnızca toplu sayılardan oluşur.","Hakların: yukarıdaki iletişim adresine yazarak bilgi, erişim, düzeltme, silme ve kısıtlama talep edebilir, işlemeye itiraz edebilirsin. Ayrıca veri koruma otoritesine şikâyette bulunabilirsin: Türkiye'de bu, Kişisel Verileri Koruma Kurumu'dur (KVKK). Ayrıca verilerinin taşınabilir bir biçimde bir kopyasını isteyebilir ve onayını istediğin zaman geri çekebilirsin; bu, geri çekmeden önceki işlemleri etkilemez.","ABD eyaletlerinde gizlilik hakları: Kaliforniya gibi tüketici gizliliği yasası olan bir ABD eyaletinde yaşıyorsan, kişisel verilerini para karşılığında satmadığımızı bilmeni isteriz. Ancak Google AdMob aracılığıyla ödüllü videolar göstermek, bu yasalara göre hedefli reklam amacıyla “paylaşım” sayılabilir. Android ayarlarında reklam kimliğini silerek veya sıfırlayarak ya da uygulama gösterdiğinde Profil › Gizlilik ve yaş › Reklam tercihleri bölümünden buna itiraz edebilirsin. Yukarıda anlatılan hakları bize yazarak kullanabilirsin. Bu hakları kullanman sana nasıl davrandığımızı asla değiştirmez.","Çocuklar ve gençler: Tanetto her yaş içindir. İlk seferde doğum ayını ve yılını sorarız; bu bilgi yalnızca cihazında kalır. 13 yaşın altındaysan ya da söylememeyi tercih edersen yalnızca çocuklara uygun ödüllü videolar gösterilir, hiçbir zaman kişiselleştirilmez ve reklam kimliği gönderilmez. Ülkendeki dijital rıza yaşının altındaysan (kanun daha düşük bir yaş belirlemiyorsa 16) reklamlar asla kişiselleştirilmez ve hesapla çevrimiçi yedekleme kullanılamaz: veriler yalnızca cihazda kalır ve bir kopyasını dosyaya kaydedebilirsin. Arkadaşınla sohbette yalnızca önceden yazılmış cevaplar vardır ve kimseye hiçbir şey gönderilmez. Tanì oyun parasıdır, gerçek para değildir; Tanetto Plus ve Tanì paketleri yalnızca Google Play ile ödenir. ABD'de Tanetto, 13 yaşından küçük çocuklardan kişisel bilgi toplamaz: teknik bir tanımlayıcı alan hizmetler yalnızca GoatCounter (yalnızca saymak için IP adresi, saklanmaz) ve Google AdMob'dur (çocuklara uygun, kişiselleştirilmemiş, reklam kimliği kullanılmayan reklamlar). Ebeveynler ve vasiler her türlü soru veya talep için tanettoapp@gmail.com adresine yazabilir.","Değişiklikler: bu politika değişirse güncel sürüm her zaman bu sayfada olacaktır. Son güncelleme: 14.11.2026."],"terms":["Tanetto'nun iyi çalışması ve zamanla gelişmesi için çalışıyoruz; bu, tüketici olarak yasal haklarını sınırlamaz.","Uygulama, sanal bir arkadaşla küçük günlük alışkanlıklar edinmene yardımcı olur ve tıbbi ya da psikolojik danışmanlığın yerini tutmaz.","Yazdıkların sana aittir: cihazında ve hesap kullanıyorsan kişisel yedeğinde. Uygulamayı kendini zorlamadan, gönül rahatlığıyla kullan.","Ücretli özellikler: Tanetto ücretsiz indirilebilir. Tanetto Plus (aylık veya yıllık abonelik) ve Tanì paketleri isteğe bağlıdır ve Google Play üzerinden satın alınır; ödeme, yenileme, iptal ve iadeleri Google Play kendi koşullarına göre yönetir. Abonelikler, Google Play › Abonelikler'den iptal edene kadar otomatik yenilenir: iptal bir sonraki yenilemeyi durdurur ve Plus, ödenmiş dönemin sonuna kadar etkin kalır. Tanì yalnızca uygulama içinde kullanılan sanal bir paradır: parasal değeri yoktur ve paraya çevrilemez.","18 yaşından küçüksen, bir şey satın almadan önce anne, baba ya da velinden izin iste.","Ücretli dijital içerik (Tanetto Plus ve Tanì) satın aldığın anda kullanıma açılır; iadeler Google Play politikalarına ve yasal haklarına göre yapılır.","Tanetto'nun çizimleri, metinleri, müzikleri ve kodu telif hakkıyla korunur; izin alınmadan kopyalanamaz ya da yeniden kullanılamaz.","Bu koşullar İtalyan hukukuna tabidir; tüketiciysen yaşadığın ülkenin yasalarının sağladığı korumalar da geçerlidir.","Her türlü sorun için gizlilik politikasında belirtilen iletişim adresine yazabilirsin."],"back":"Tanetto'ya dön","del":"Tanetto hesabını sil"}};
const $ = (id) => document.getElementById(id);

const pick = () => { const q = (/[?&]lang=([a-z]+)/.exec(location.search) || [])[1]; if (q && Object.prototype.hasOwnProperty.call(S, q)) return q; /* 1.0.8: ?lang=constructor non rompe la pagina */ const n = (navigator.language || "en").toLowerCase(); if (/^zh-(tw|hk|mo)|hant/.test(n)) return "zht"; const l = n.slice(0, 2); return S[l] ? l : "en"; };

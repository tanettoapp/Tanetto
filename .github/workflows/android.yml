name: App Android di prova

on:
  push:
    branches: [main]
    paths: ["index.html", "app-android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app-android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Pacchetti
        run: npm ci
      - name: Prepara i file dell'app
        run: |
          set -o pipefail
          { python3 prep_www.py && npx cap sync android; } 2>&1 | tee prep.log || { echo '### Errore preparazione' >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"; tail -60 prep.log >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"; exit 1; }
      - name: Costruisci l'APK
        working-directory: app-android/android
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon 2>&1 | tee build.log || { echo '### Errore costruzione' >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"; grep -iE "error|what went wrong|failed|exception" build.log | head -40 >> "$GITHUB_STEP_SUMMARY"; tail -40 build.log >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"; exit 1; }
      - name: Rinomina
        run: cp android/app/build/outputs/apk/debug/app-debug.apk tanetto-prova.apk
      - name: Pubblica l'APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-prova
          name: Tanetto per Android (prova)
          body: "APK di prova costruito automaticamente dall'ultima versione. Solo per test, non per lo store."
          prerelease: true
          make_latest: false
          files: app-android/tanetto-prova.apk

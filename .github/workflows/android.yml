name: App Android di prova

on:
  push:
    branches: [main]
    paths: ["index.html", "app-android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Pacchetti
        run: npm ci
      - name: Prepara i file dell'app
        run: python3 prep_www.py && npx cap sync android
      - name: Costruisci l'APK
        working-directory: app-android/android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Rinomina
        run: cp android/app/build/outputs/apk/debug/app-debug.apk tanetto-prova.apk
      - name: Pubblica l'APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-prova
          name: Tanetto per Android (prova)
          body: "APK di prova costruito automaticamente dall'ultima versione. Solo per test, non per lo store."
          prerelease: true
          make_latest: false
          files: app-android/tanetto-prova.apk

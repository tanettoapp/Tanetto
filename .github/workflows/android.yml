name: App Android di prova

on:
  push:
    branches: [main]
    paths: ["index.html", "app-android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app-android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Costruisci l'APK
        run: bash ci_build.sh
        shell: bash
      - name: Pubblica l'APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-prova
          name: Tanetto per Android (prova)
          body: "APK di prova costruito automaticamente dall'ultima versione. Solo per test, non per lo store."
          prerelease: true
          make_latest: false
          files: app-android/tanetto-prova.apk
      - name: Diagnostica
        if: failure()
        run: |
          { echo "Ultima costruzione non riuscita."; echo; echo '```'; tail -80 ci.log 2>/dev/null || echo "nessun log"; echo '```'; } > diag.md
      - name: Pubblica la diagnostica
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-diagnostica
          name: Diagnostica costruzione Android
          body_path: app-android/diag.md
          prerelease: true
          make_latest: false
